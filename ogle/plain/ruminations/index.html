<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Ruminations — CJ Replogle</title>
<style>
  body { font-family:"Times New Roman",Times,serif; color:#000; background:#fff;
         margin:12px; max-width:46em; line-height:1.4; }
  h1 { font-size:1.9em; margin:0 0 0.5em; }
  hr { border:none; border-top:1px solid #000; margin:1em 0; }
  p { margin:0.5em 0; }
  #login label { }
  #login input { font-family:inherit; font-size:1rem; border:1px solid #999; padding:2px 4px; }
  #login button, #out { font-family:inherit; font-size:1rem; cursor:pointer;
                        background:none; border:none; padding:0; color:#00e; text-decoration:underline; }
  #status { color:#555; font-size:0.9em; margin-left:8px; }
  .entry { margin:0 0 1.1em; }
  .date { color:#555; font-size:0.85em; margin:0 0 0.2em; }
  .text { margin:0; white-space:pre-wrap; }
  .foot { font-size:0.85em; }
</style>
</head>
<body>
<h1>Ruminations</h1>

<div id="login">
  <label for="pw">Password:</label>
  <input type="password" id="pw" autocomplete="current-password"
         onkeydown="if(event.key==='Enter')signin()">
  <button onclick="signin()">sign in</button>
  <span id="status"></span>
</div>

<div id="list" style="display:none"></div>

<hr>
<p class="foot"><a href="/ogle/plain/">&larr; back</a><span id="out-wrap" style="display:none"> &middot; <button id="out" onclick="signout();return false">sign out</button></span></p>

<script>
  const WORKER_URL = 'https://ruminations-worker.cjreplogle.workers.dev';
  const KEY = 'ruminations_authed';

  function esc(s){ return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  // **bold** *italic* __underline__ ~~strike~~ (same markers as the editor)
  function fmt(h){ return h
    .replace(/\*\*(?=\S)([\s\S]*?\S)\*\*/g, '<b>$1</b>')
    .replace(/__(?=\S)([\s\S]*?\S)__/g, '<u>$1</u>')
    .replace(/~~(?=\S)([\s\S]*?\S)~~/g, '<s>$1</s>')
    .replace(/(^|[^*\w])\*(?=\S)([^*\n]*?\S)\*(?![*\w])/g, '$1<i>$2</i>'); }
  function setStatus(m){ document.getElementById('status').textContent = m || ''; }

  async function load(){
    const pw = localStorage.getItem(KEY);
    if (!pw) return;
    setStatus('loading…');
    try {
      const res = await fetch(WORKER_URL, { headers: { Authorization: 'Bearer ' + pw } });
      if (res.status === 401) { setStatus('wrong password'); signout(); return; }
      if (!res.ok) { setStatus('could not load'); return; }
      const posts = await res.json();
      document.getElementById('login').style.display = 'none';
      document.getElementById('out-wrap').style.display = '';
      const el = document.getElementById('list');
      el.style.display = '';
      el.innerHTML = posts.length
        ? posts.map(p => `<div class="entry">${p.title ? `<p><b>${esc(p.title)}</b></p>` : ''}<p class="date">${esc(p.date)}</p><p class="text">${fmt(esc(p.body))}</p></div>`).join('')
        : '<p>Nothing yet.</p>';
      setStatus('');
    } catch(e) { setStatus('error: ' + e.message); }
  }

  function signin(){
    const pw = document.getElementById('pw').value.trim();
    if (!pw) { setStatus('enter password'); return; }
    localStorage.setItem(KEY, pw);
    load();
  }

  function signout(){
    localStorage.removeItem(KEY);
    const el = document.getElementById('list');
    el.style.display = 'none'; el.innerHTML = '';
    document.getElementById('login').style.display = '';
    document.getElementById('out-wrap').style.display = 'none';
    document.getElementById('pw').value = '';
    setStatus('');
  }

  if (localStorage.getItem(KEY)) load();
</script>
</body>
</html>

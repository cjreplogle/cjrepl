<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noimageindex">
<title>UCCOM Elo</title>
<meta name="description" content="Medcat Elo ladders — Ping Pong and FIFA.">
<meta property="og:title" content="UCCOM Elo">
<meta property="og:description" content="Medcat Elo ladders — Ping Pong and FIFA.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://cjre.pl/ogle/elo/">
<meta property="og:image" content="https://cjre.pl/ogle/pong/og.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#e00122">
<link rel="icon" href="../pong/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../pong/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --bg:#f5f5f5; --card:#fff; --ink:#111; --mute:#6f6f6f; --line:#e4e4e4; --acc:#e00122; --field:#f3f3f3;
          --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06); }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0b0b0b; --card:#161616; --ink:#f2f2f2; --mute:#8f8f8f; --line:#262626; --field:#202020;
            --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:Inter,system-ui,-apple-system,sans-serif;
         line-height:1.45; -webkit-font-smoothing:antialiased; min-height:100vh; }
  .wrap { max-width:720px; margin:0 auto; padding:20px 16px 48px; }
  .back { color:var(--mute); text-decoration:none; font-size:.85rem; } .back:hover { color:var(--ink); }
  h1 { font-size:2.2rem; font-weight:800; letter-spacing:-.02em; margin:28px 0 2px; }
  .sub { color:var(--mute); margin:0 0 28px; }
  .pick { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media (max-width:520px) { .pick { grid-template-columns:1fr; } }
  a.game { display:block; text-decoration:none; color:inherit; background:var(--card); border:1px solid var(--line);
           border-radius:20px; padding:26px 20px 22px; text-align:center; box-shadow:var(--shadow);
           position:relative; overflow:hidden; transition:transform .2s cubic-bezier(.2,.8,.2,1), box-shadow .2s, border-color .2s;
           animation:up .5s cubic-bezier(.2,.8,.2,1) both; }
  a.game::before { content:""; position:absolute; inset:0 0 auto; height:4px; background:var(--acc); }
  a.game:hover { transform:translateY(-4px); border-color:var(--acc); box-shadow:0 14px 34px rgba(224,1,34,.18); }
  a.game:active { transform:scale(.98); }
  a.game:focus-visible { outline:2px solid var(--acc); outline-offset:3px; }
  a.game img { width:96px; height:96px; display:block; margin:0 auto 14px; transition:transform .3s; }
  a.game:hover img { transform:rotate(-8deg) scale(1.05); }
  a.game.fifa { --acc:#5aaee8; }
  a.game.fifa:hover { box-shadow:0 14px 34px rgba(90,174,232,.22); }
  a.game.fifa:focus-visible { outline-color:#5aaee8; }
  .name { font-size:1.5rem; font-weight:800; letter-spacing:-.01em; }
  .lead { font-size:.85rem; color:var(--mute); margin-top:6px; min-height:1.3em; }
  .lead b { color:var(--ink); }
  .back, h1, .sub { animation:up .5s cubic-bezier(.2,.8,.2,1) both; } h1 { animation-delay:.03s; } .sub { animation-delay:.06s; }
  a.game { animation-delay:.12s; } a.game:nth-child(2) { animation-delay:.2s !important; }
  .lead { transition:opacity .3s; } .lead:empty { opacity:0; }
  .lead b, .lead { animation:up .4s ease both; }
  @keyframes up { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:none; } }
  @media (prefers-reduced-motion: reduce) { *, *::before { animation:none !important; transition:none !important; } }
</style>
</head>
<body>
<div class="wrap">
<a class="back" href="/ogle/">&larr; back</a>
<h1>UCCOM Elo</h1>
<p class="sub">Medcat Elo ladders. Pick your game.</p>
<div class="pick">
  <a class="game" href="../pong/"><img src="../pong/icon.svg" alt=""><div class="name">Ping Pong</div><div class="lead" id="l-pong"></div></a>
  <a class="game fifa" href="../fifa/"><img src="../fifa/icon.svg" alt=""><div class="name">FIFA</div><div class="lead" id="l-fifa"></div></a>
</div>
</div>
<script>
// Show each ladder's current #1 (same Elo rules as the game pages, top player only).
const API = 'https://pong-worker.cjreplogle.workers.dev';
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// Same math as the game pages (group's spreadsheet): K = 40, MROUND to 2, zero-sum; draws score 0.5.
const mround2 = x => Math.sign(x) * Math.round(Math.abs(x) / 2) * 2;   // like Sheets MROUND (half away from 0)
async function leader(g) {
  const el = document.getElementById('l-' + g);
  try {
    const ms = await (await fetch(API + '/matches' + (g === 'fifa' ? '?g=fifa' : ''))).json();
    const P = {}, get = n => P[n.toLowerCase()] ||= { name: n, elo: 1000 };
    for (const m of ms) {
      const A = get(m.a), B = get(m.b);
      const res = m.sa > m.sb ? 1 : m.sa < m.sb ? 0 : 0.5, e = 1 / (1 + 10 ** ((B.elo - A.elo) / 400));
      const dA = mround2(40 * (res - e)), dB = -dA;
      A.elo += dA; B.elo += dB;
    }
    const top = Object.values(P).sort((x, y) => y.elo - x.elo)[0];
    el.innerHTML = top ? `🥇 <b>${esc(top.name)}</b> &middot; ${top.elo} &middot; ${ms.length} game${ms.length === 1 ? '' : 's'}` : 'No games yet';
  } catch { el.textContent = ''; }
}
leader('pong'); leader('fifa');
</script>
</body>
</html>

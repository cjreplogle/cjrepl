<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noimageindex">
<title>Swimming &mdash; CJ Replogle</title>
<style>
  body { font-family:"Times New Roman",Times,serif; color:#000; background:#fff;
         margin:12px; max-width:46em; line-height:1.4; }
  h1 { font-size:1.9em; margin:0 0 0.1em; }
  hr { border:none; border-top:1px solid #000; margin:1em 0; }
  p { margin:0.6em 0; }
  .top-back { margin:0 0 0.6em; font-size:0.9em; }
  .gallery { display:grid; grid-template-columns:repeat(auto-fill, minmax(12em, 1fr)); gap:0.5em; }
  .gallery figure { margin:0; }
  .expand { display:none; }
  .gallery label { display:block; cursor:pointer; }
  .gallery img { display:block; width:100%; height:10em; object-fit:cover; background:#eee; }
  .gallery figure:has(.expand:checked) { grid-column:1 / -1; }
  .gallery figure:has(.expand:checked) img { height:auto; max-height:85vh; object-fit:contain; }
  .foot { font-size:0.85em; color:#555; }
  .foot a { color:#555; }
</style>
</head>
<body>
<p class="top-back"><a href="https://cjre.pl/ogle/friends">&larr; back</a></p>
<h1>Swimming</h1>

<p>Some photos from club swim, 2023&ndash;2026.</p>

<hr>

<div class="gallery">
<figure><input type="checkbox" id="e1" class="expand"><label for="e1"><img src="thumb/s1.jpg" data-full="s1.jpg" alt="Club swim" fetchpriority="high"></label></figure>
<figure><input type="checkbox" id="e2" class="expand"><label for="e2"><img src="thumb/s2.jpg" data-full="s2.jpg" alt="Club swim" loading="lazy"></label></figure>
<figure><input type="checkbox" id="e3" class="expand"><label for="e3"><img src="thumb/s3.jpg" data-full="s3.jpg" alt="Nationals team" loading="lazy"></label></figure>
<figure><input type="checkbox" id="e4" class="expand"><label for="e4"><img src="thumb/s4.jpg" data-full="s4.jpg" alt="Diving off the blocks at nationals" loading="lazy"></label></figure>
<figure><input type="checkbox" id="e5" class="expand"><label for="e5"><img src="thumb/s5.jpg" data-full="s5.jpg" alt="College Club Swimming group photo" loading="lazy"></label></figure>
<figure><input type="checkbox" id="e6" class="expand"><label for="e6"><img src="thumb/s6.jpg" data-full="s6.jpg" alt="Teammates poolside" loading="lazy"></label></figure>
<figure><input type="checkbox" id="e7" class="expand"><label for="e7"><img src="thumb/s7.jpg" data-full="s7.jpg" alt="Team at the natatorium" loading="lazy"></label></figure>
<figure><input type="checkbox" id="e8" class="expand"><label for="e8"><img src="thumb/s8.jpg" data-full="s8.jpg" alt="Team in green" loading="lazy"></label></figure>
<figure><input type="checkbox" id="e9" class="expand"><label for="e9"><img src="thumb/s9.jpg" data-full="s9.jpg" alt="Team in green" loading="lazy"></label></figure>
<figure><input type="checkbox" id="e10" class="expand"><label for="e10"><img src="thumb/s10.jpg" data-full="s10.jpg" alt="Teammates at nationals" loading="lazy"></label></figure>
<figure><input type="checkbox" id="e11" class="expand"><label for="e11"><img src="thumb/s11.jpg" data-full="s11.jpg" alt="Swimming butterfly in a race" loading="lazy"></label></figure>
</div>

<hr>

<p class="foot"><a href="https://cjre.pl/">cjre.pl</a> / contact: replogcj(at)mail.uc.edu</p>

<script>
// Load the full-size image only when a photo is expanded.
(function () {
  document.querySelectorAll(".expand").forEach(function (cb) {
    cb.addEventListener("change", function () {
      if (!cb.checked) return;
      var img = cb.parentNode.querySelector("img[data-full]");
      if (img) { img.src = img.getAttribute("data-full"); img.removeAttribute("data-full"); }
    });
  });
})();
</script>
</body>
</html>

<!DOCTYPE html>

<title>Euro Trip 2026 &mdash; CJ Replogle</title>
<style>
  body { font-family:"Times New Roman",Times,serif; color:#000; background:#fff;
         margin:12px; max-width:46em; line-height:1.4; }
  h1 { font-size:1.9em; margin:0 0 0.1em; }
  hr { border:none; border-top:1px solid #000; margin:1em 0; }
  p { margin:0.6em 0; }
  .top-back { margin:0 0 0.6em; font-size:0.9em; }
  .gallery { display:grid; grid-template-columns:repeat(auto-fill, minmax(12em, 1fr)); gap:0.5em; }
  .gallery figure { margin:0; }
  .expand { display:none; }
  .gallery label { display:block; cursor:pointer; }
  .gallery img { display:block; width:100%; height:10em; object-fit:cover; background:#eee; }
  .gallery figure:has(.expand:checked) { grid-column:1 / -1; }
  .gallery figure:has(.expand:checked) img { height:auto; max-height:85vh; object-fit:contain; }
  .foot { font-size:0.85em; color:#555; }
  .foot a { color:#555; }
</style>
</head>

<script>
// Load the full-size image only when a photo is expanded.
(function () {
  document.querySelectorAll(".expand").forEach(function (cb) {
    cb.addEventListener("change", function () {
      if (!cb.checked) return;
      var img = cb.parentNode.querySelector("img[data-full]");
      if (img) { img.src = img.getAttribute("data-full"); img.removeAttribute("data-full"); }
    });
  });
})();
</script>

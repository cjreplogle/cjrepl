<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Janki 3D sample card</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/cjreplogle/janki@1d6d7f81734ea0380f5b1e2681c4c4b7cd1c3ee0/tools/anatomy3d/style.css">
<style>
/* styled after the mock Janki window on cjre.pl/ogle/janki (its dark palette: the model's labels are light) */
:root{color-scheme:dark;--mk-win:#111214;--mk-edge:#3a3b3e;--mk-pill:#09090a;--mk-text:#fff;--mk-zero:#8a8f98;
  --mk-new:#82b6ff;--mk-learn:#ff6b6b;--mk-due:#36c75e;--mk-practice:#86e39a;--mk-sync:#a9bde6;--mk-hover:#ffffff0f;
  --mk-g0:#ff8585;--mk-g0b:#3d2024;--mk-g1:#f0a45a;--mk-g1b:#3b2b1c;--mk-g2:#5fd081;--mk-g2b:#173220;--mk-g3:#80b3ff;--mk-g3b:#1a2b46}
html,body{margin:0;height:100%;overflow:hidden;background:var(--mk-win)}
.mk-win{position:absolute;inset:0;font-size:10px;line-height:1;color:var(--mk-text);background:var(--mk-win);
  font-family:"Lora",Georgia,serif;user-select:none;overflow:hidden}
.mk-lights{position:absolute;font-size:12.5px;top:.6em;left:.58em;display:flex;gap:.62em;z-index:4}
.mk-lights i{width:.88em;height:.88em;border-radius:50%}
.mk-lights i:nth-child(1){background:#ff5f57}.mk-lights i:nth-child(2){background:#febc2e}.mk-lights i:nth-child(3){background:#28c840}
.mk-bar{position:absolute;font-size:12.5px;left:50%;transform:translateX(-50%);top:2.15em;height:2.25em;display:flex;align-items:center;gap:2.2em;
  padding:0 1.4em;font-weight:700;white-space:nowrap;background:var(--mk-pill);border-radius:1.125em;z-index:4}
.mk-bar .cal{display:flex;color:#a8d0ff}.mk-bar .cal svg{width:1.15em;height:1.15em}
.mk-bar .practice{color:var(--mk-practice)}.mk-bar .sync{color:var(--mk-sync)}
.qa{position:absolute;top:6.6em;left:1.6em;right:1.6em;bottom:7.2em;text-align:center}
.prompt{font-size:2em;font-weight:700;line-height:1.3;margin-bottom:.4em}
.body{display:flex;align-items:center;gap:2.8em;height:calc(100% - 3.4em)}
.stage{position:relative;flex:0 0 100%;height:100%;overflow:hidden;transition:flex-basis .5s cubic-bezier(.2,.8,.2,1)}
.stage #jka,.stage .jka-wrap{height:100% !important;background:transparent !important}
.qa.back .stage{flex-basis:58%}
#ans{flex:1;min-width:0;text-align:left;animation:sIn .45s .15s ease-out both}
@keyframes sIn{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}}
hr#answer{display:none}
.name{font-size:2.6em;font-weight:700;line-height:1.2;margin-bottom:.3em;color:var(--mk-text)}
.facts{font-size:1.6em;line-height:1.5;color:#cfd3da}.facts b{color:var(--mk-text)}
.mk-counts{position:absolute;left:0;right:0;bottom:4em;font-size:11.25px;text-align:center;color:var(--mk-zero)}
.mk-counts .u{text-decoration:underline}.mk-counts .n{color:var(--mk-new)}.mk-counts .l{color:var(--mk-learn)}.mk-counts .d{color:var(--mk-due)}
.back-side .mk-counts{visibility:hidden}
.hint{position:absolute;right:1.4em;bottom:6.4em;font-size:.85em;color:var(--mk-zero);pointer-events:none}
.mk-answer{position:absolute;left:1.15em;right:1.15em;bottom:.9em;height:2.1em;display:flex;font-size:11.25px;
  background:var(--mk-pill);border-radius:.6em;overflow:hidden}
.mk-answer>*{flex:1;display:flex;align-items:center;justify-content:center;cursor:pointer;border:0;padding:0;margin:0;
  font:inherit;color:inherit;background:none}
.mk-answer>*:hover{background:var(--mk-hover)}
.mk-answer.mk-grades{height:2.35em;gap:.8em;background:none;overflow:visible}
.mk-answer>.mk-g{position:relative;border-radius:.55em}
.mk-answer>.mk-g em{position:absolute;left:0;right:0;bottom:calc(100% + .4em);font-size:.88em;font-style:normal;text-align:center;color:inherit}
.mk-answer>.mk-g0{color:var(--mk-g0);background:var(--mk-g0b)}.mk-answer>.mk-g1{color:var(--mk-g1);background:var(--mk-g1b)}
.mk-answer>.mk-g2{color:var(--mk-g2);background:var(--mk-g2b)}.mk-answer>.mk-g3{color:var(--mk-g3);background:var(--mk-g3b)}
.mk-answer>.mk-g:hover,.mk-answer>.mk-g.hit{filter:brightness(1.18)}
.mk-answer>*:focus{outline:none}
.jka-mplay,.jka-gpl,html body .jka-views .jka-gpl{display:none !important}
/* the engine's phone rules paint html/body/#qa/.jka-wrap black: keep the window colour behind the model */
html:root,html:root body,html body #qa.qa,html body .stage,html body .stage #jka,html body .stage .jka-wrap,html body .card{background:transparent !important}
html:root{background:var(--mk-win) !important}
</style>
</head><body>
<div class="mk-win" id="win">
  <div class="mk-lights"><i></i><i></i><i></i></div>
  <div class="mk-bar"><span class="cal"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3.5 10h17M8 3v4M16 3v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="8.5" cy="14.5" r="1.2" fill="currentColor"/><circle cx="12" cy="14.5" r="1.2" fill="currentColor"/><circle cx="15.5" cy="14.5" r="1.2" fill="currentColor"/></svg></span><span>Decks</span><span>Add</span><span>Browse</span><span>Stats</span><span class="practice">Practice</span><span class="sync">Sync</span></div>
  <div class="qa" id="qa">
    <div class="prompt" id="prompt"></div>
    <div class="body"><div class="stage"><div id="jka" data-side="front" data-mode="name"></div></div>
    <div id="ans" hidden><hr id="answer"><div class="name" id="a-name"></div><div class="facts" id="a-facts"></div></div></div>
  </div>
  <div class="mk-counts" id="counts"></div>
  <div class="hint">drag to rotate · scroll to zoom · Space / Z X C V to answer</div>
  <div class="mk-answer" id="bar"></div>
</div>
<script>
(function () {
  var CDN = "https://cdn.jsdelivr.net/gh/cjreplogle/janki@1d6d7f81734ea0380f5b1e2681c4c4b7cd1c3ee0";
  var root = document.getElementById("jka"), qa = document.getElementById("qa"), bar = document.getElementById("bar"), side = "front";
  var L = "_jk3d_lowerlimb2.glb", U = "_jk3d_upperlimb2.glb", T = "_jk3d_trunk7.glb";
  var CARDS = [
    {name: "Greater trochanter", mode: "name", model: L, meshes: "Femur", landmark: "greater trochanter", region: "hip", cam: "lateral",
     facts: "Insertion of gluteus medius and minimus, piriformis, obturator internus and the gemelli"},
    {name: "Sartorius", mode: "attach", model: L, meshes: "Sartorius muscle", region: "thigh", cam: "anterior", nerve: "Femoral nerve",
     origin: "Anterior superior iliac spine (ASIS)", insertion: "Medial surface of the proximal tibia (pes anserinus)",
     q: "Sartorius — origin and insertion?",
     facts: "<b>Origin:</b> anterior superior iliac spine (ASIS)<br><b>Insertion:</b> medial proximal tibia (pes anserinus)"},
    {name: "Femoral nerve", mode: "name", model: L, meshes: "Femoral nerve", region: "thigh", cam: "anterior",
     facts: "L2–L4. Motor to the anterior thigh; sensory via the saphenous nerve to the medial leg and foot"},
    {name: "Femoral artery", mode: "name", model: L, meshes: "Femoral artery", region: "thigh", cam: "anteromedial",
     facts: "Femoral triangle, lateral → medial: Nerve, Artery, Vein (NAV)"},
    {name: "Biceps brachii", mode: "name", model: U, meshes: "Long head of biceps brachii, Short head of biceps brachii", region: "arm", cam: "anterior",
     facts: "Flexes and supinates the forearm · musculocutaneous nerve (C5–C6)"},
    {name: "Trapezius", mode: "name", model: T, limb: "right", cam: "posterior",
     meshes: "Descending part of trapezius muscle.l, Descending part of trapezius muscle.r, Transverse part of trapezius muscle.l, Transverse part of trapezius muscle.r, Ascending part of trapezius muscle.l, Ascending part of trapezius muscle.r",
     facts: "Accessory nerve (CN XI) · elevates, retracts and depresses the scapula"}
  ];
  var idx = 0;
  function cfg() { var c = CARDS[idx];
    return {model: CDN + "/assets/anatomy3d/" + c.model, side: side, mode: c.mode, name: c.name, meshes: c.meshes,
      landmark: c.landmark || "", region: c.region || "", cam: c.cam || "", limb: c.limb || "", reflect: "",
      origin: c.origin || "", insertion: c.insertion || "", nerve: c.nerve || "", xray: false, front: "show", peel: []}; }
  function mount() { if (!window.JKANAT) return; root.setAttribute("data-side", side); root.setAttribute("data-mode", CARDS[idx].mode); window.JKANAT.mount(root, cfg()); }
  function render() {
    var c = CARDS[idx];
    document.getElementById("prompt").textContent = c.q || "What is highlighted?";
    document.getElementById("a-name").textContent = c.name;
    document.getElementById("a-facts").innerHTML = c.facts;
    document.getElementById("counts").innerHTML = '<span class="n u">' + (CARDS.length - idx) + '</span> + <span class="l">0</span> + <span class="d">0</span>';
    document.getElementById("win").classList.toggle("back-side", side === "back");
    qa.classList.toggle("back", side === "back");
    document.getElementById("ans").hidden = side === "front";
    bar.classList.toggle("mk-grades", side === "back");
    bar.innerHTML = side === "front"
      ? '<button data-k="flip">Show Answer</button>'
      : [["Again","<1m"],["Hard","<6m"],["Good","<10m"],["Easy","4d"]].map(function (b, i) {
          return '<button class="mk-g mk-g' + i + '" data-k="rate"><em>' + b[1] + '</em>' + b[0] + '</button>'; }).join("");
  }
  function go(to) { if (side === "back" && to === "front") idx = (idx + 1) % CARDS.length; side = to; render(); mount(); }
  bar.addEventListener("click", function (e) { var b = e.target.closest("button"); if (!b) return;
    go(b.dataset.k === "flip" ? "back" : "front"); });
  document.addEventListener("keydown", function (e) {
    if (side === "front" && (e.key === " " || e.key === "Enter")) { e.preventDefault(); go("back"); }
    else if (side === "back") {
      // like Janki: Space/Enter = Good, Z/X/C/V (or 1-4) = Again/Hard/Good/Easy
      var k = e.key.toLowerCase(), i = {"1":0,"2":1,"3":2,"4":3,"z":0,"x":1,"c":2,"v":3," ":2,"enter":2}[k];
      if (i == null || e.metaKey || e.ctrlKey || e.altKey) return;
      e.preventDefault();
      var b = bar.querySelectorAll("button")[i]; if (b) b.classList.add("hit");
      setTimeout(function () { go("front"); }, 120);
    }
  });
  render();
  var sc = document.createElement("script"); sc.src = CDN + "/assets/anatomy3d/_jk3d-anat-69.js"; sc.onload = mount; document.head.appendChild(sc);
})();
</script>
</body></html>

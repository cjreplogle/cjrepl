<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Janki 3D sample card</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@400..700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#000;color:#fff;font-family:"Lora",Georgia,serif;color-scheme:dark}
.win{position:absolute;inset:0;display:flex;flex-direction:column;border:1px solid #2a2a2a;border-radius:16px;overflow:hidden;background:#000}
.qa{flex:1;overflow:hidden;padding:18px 18px 8px;text-align:center;font-size:20px}
.prompt{font-weight:600;margin-bottom:10px}
.stage{position:relative;height:calc(100% - 44px);border-radius:12px;overflow:hidden}
.stage #jka,.stage .jka-wrap{height:100% !important}
.qa.back .stage{height:calc(100% - 156px)}
hr#answer{border:0;border-top:1px solid #333;margin:12px 0 8px}
.name{font-size:22px;font-weight:700}
.facts{color:#b0b8c1;font-size:15px;margin-top:2px}
.bar{flex:none;display:flex;justify-content:center;gap:6px;padding:6px 10px 10px;background:#000;font-family:-apple-system,system-ui,sans-serif}
.bar .col{flex:0 1 150px;display:flex;flex-direction:column;align-items:stretch;gap:2px;text-align:center}
.bar .ivl{font-size:11px;color:rgba(255,255,255,.45)}
.bar button{font:400 13px -apple-system,system-ui,sans-serif;color:#fff;background:rgba(255,255,255,.08);border:none;border-radius:15px;padding:6px 14px;cursor:pointer;box-shadow:0 .5px 1px rgba(0,0,0,.35);transition:filter .15s,background-color .15s}
.bar button:hover{background:rgba(255,255,255,.13)}
.bar button:focus{outline:none}
.bar button:focus-visible{box-shadow:inset 0 0 0 2px rgba(176,203,246,.8)}
.bar .again{color:#ff8080;font-weight:500;background:rgba(220,60,60,.18)}
.bar .hard{color:#ffb560;font-weight:500;background:rgba(220,140,40,.16)}
.bar .good{color:#6ddd80;font-weight:500;background:rgba(60,200,90,.16)}
.bar .easy{color:#78c4ff;font-weight:500;background:rgba(60,140,240,.18)}
.bar .again:hover,.bar .hard:hover,.bar .good:hover,.bar .easy:hover{filter:brightness(1.15)}
.bar .col.solo{flex:1 1 100%}
.count{position:absolute;left:14px;top:12px;font:11px -apple-system,system-ui,sans-serif;color:#6e7681}
.facts b{color:#fff}
.hint{position:absolute;right:14px;bottom:62px;font:11px -apple-system,system-ui,sans-serif;color:#6e7681;pointer-events:none}
</style>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/cjreplogle/janki@31432f7c07af74085d7b548a4735348dc6030a51/tools/anatomy3d/style.css">
</head><body>
<div class="win">
  <div class="qa" id="qa">
    <div class="prompt" id="prompt"></div>
    <div class="stage"><div id="jka" data-side="front" data-mode="name"></div></div>
    <div id="ans" hidden><hr id="answer"><div class="name" id="a-name"></div><div class="facts" id="a-facts"></div></div>
  </div>
  <div class="count" id="count"></div>
  <div class="hint">drag to rotate · scroll to zoom · Space / Z X C V to answer</div>
  <div class="bar" id="bar"></div>
</div>
<script>
(function () {
  var CDN = "https://cdn.jsdelivr.net/gh/cjreplogle/janki@31432f7c07af74085d7b548a4735348dc6030a51";
  var root = document.getElementById("jka"), qa = document.getElementById("qa"), bar = document.getElementById("bar"), side = "front";
  var L = "_jk3d_lowerlimb2.glb", U = "_jk3d_upperlimb2.glb", T = "_jk3d_trunk7.glb";
  var CARDS = [
    {name: "Greater trochanter", mode: "name", model: L, meshes: "Femur", landmark: "greater trochanter", region: "hip", cam: "lateral",
     facts: "Insertion of gluteus medius and minimus, piriformis, obturator internus and the gemelli"},
    {name: "Sartorius", mode: "attach", model: L, meshes: "Sartorius muscle", region: "thigh", cam: "anterior", nerve: "Femoral nerve",
     origin: "Anterior superior iliac spine (ASIS)", insertion: "Medial surface of the proximal tibia (pes anserinus)",
     q: "Sartorius — origin and insertion?",
     facts: "<b>Origin:</b> anterior superior iliac spine (ASIS)<br><b>Insertion:</b> medial proximal tibia (pes anserinus)"},
    {name: "Femoral nerve", mode: "name", model: L, meshes: "Femoral nerve", region: "thigh", cam: "anterior",
     facts: "L2–L4. Motor to the anterior thigh; sensory via the saphenous nerve to the medial leg and foot"},
    {name: "Femoral artery", mode: "name", model: L, meshes: "Femoral artery", region: "thigh", cam: "anteromedial",
     facts: "Femoral triangle, lateral → medial: Nerve, Artery, Vein (NAV)"},
    {name: "Biceps brachii", mode: "name", model: U, meshes: "Long head of biceps brachii, Short head of biceps brachii", region: "arm", cam: "anterior",
     facts: "Flexes and supinates the forearm · musculocutaneous nerve (C5–C6)"},
    {name: "Trapezius", mode: "name", model: T, limb: "right", cam: "posterior",
     meshes: "Descending part of trapezius muscle.l, Descending part of trapezius muscle.r, Transverse part of trapezius muscle.l, Transverse part of trapezius muscle.r, Ascending part of trapezius muscle.l, Ascending part of trapezius muscle.r",
     facts: "Accessory nerve (CN XI) · elevates, retracts and depresses the scapula"}
  ];
  var idx = 0;
  function cfg() { var c = CARDS[idx];
    return {model: CDN + "/assets/anatomy3d/" + c.model, side: side, mode: c.mode, name: c.name, meshes: c.meshes,
      landmark: c.landmark || "", region: c.region || "", cam: c.cam || "", limb: c.limb || "", reflect: "",
      origin: c.origin || "", insertion: c.insertion || "", nerve: c.nerve || "", xray: false, front: "show", peel: []}; }
  function mount() { if (!window.JKANAT) return; root.setAttribute("data-side", side); root.setAttribute("data-mode", CARDS[idx].mode); window.JKANAT.mount(root, cfg()); }
  function render() {
    var c = CARDS[idx];
    document.getElementById("prompt").textContent = c.q || "What is highlighted?";
    document.getElementById("a-name").textContent = c.name;
    document.getElementById("a-facts").innerHTML = c.facts;
    document.getElementById("count").textContent = "Card " + (idx + 1) + " of " + CARDS.length;
    qa.classList.toggle("back", side === "back");
    document.getElementById("ans").hidden = side === "front";
    bar.innerHTML = side === "front"
      ? '<div class="col solo"><span class="ivl">&nbsp;</span><button data-k="flip">Show Answer</button></div>'
      : [["again","Again","<1m"],["hard","Hard","6m"],["good","Good","10m"],["easy","Easy","4d"]].map(function (b) {
          return '<div class="col"><span class="ivl">' + b[2] + '</span><button class="' + b[0] + '" data-k="rate">' + b[1] + '</button></div>'; }).join("");
  }
  function go(to) { if (side === "back" && to === "front") idx = (idx + 1) % CARDS.length; side = to; render(); mount(); }
  bar.addEventListener("click", function (e) { var b = e.target.closest("button"); if (!b) return;
    go(b.dataset.k === "flip" ? "back" : "front"); });
  document.addEventListener("keydown", function (e) {
    if (side === "front" && (e.key === " " || e.key === "Enter")) { e.preventDefault(); go("back"); }
    else if (side === "back") {
      // like Janki: Space/Enter = Good, Z/X/C/V (or 1-4) = Again/Hard/Good/Easy
      var k = e.key.toLowerCase(), i = {"1":0,"2":1,"3":2,"4":3,"z":0,"x":1,"c":2,"v":3," ":2,"enter":2}[k];
      if (i == null || e.metaKey || e.ctrlKey || e.altKey) return;
      e.preventDefault();
      var b = bar.querySelectorAll("button")[i]; if (b) b.style.filter = "brightness(1.5)";
      setTimeout(function () { go("front"); }, 120);
    }
  });
  render();
  var sc = document.createElement("script"); sc.src = CDN + "/assets/anatomy3d/_jk3d-anat-67.js"; sc.onload = mount; document.head.appendChild(sc);
})();
</script>
</body></html>

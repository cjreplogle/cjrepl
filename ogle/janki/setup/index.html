<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Janki Setup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
<style>
/* Same theme as the main Janki page (cjre.pl/ogle/janki) */
:root{color-scheme:light dark;--bg:#fff;--text:#1f2328;--muted:#59636e;--border:#d0d7de;--surface:#f6f8fa;--link:#0969da;--err:#cf222e;}
@media (prefers-color-scheme:dark){:root{--bg:#000;--text:#fff;--muted:#b0b8c1;--border:#333;--surface:#111;--link:#58a6ff;--err:#ff7b72;}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;
 background:var(--bg);color:var(--text);font-family:"Lora",Georgia,"Times New Roman",serif;font-size:16px;line-height:1.5}
form{width:100%;max-width:320px;text-align:center;animation:fadeIn .45s ease-out}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){form{animation:none}}
h1{font-size:2em;font-weight:600;line-height:1.25;margin:0 0 6px}
p{color:var(--muted);margin:0 0 18px}
input,button{width:100%;font:inherit;padding:9px 12px;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--text)}
input:focus{outline:none;border-color:var(--link)}
button{margin-top:10px;cursor:pointer;background:transparent;color:var(--link);border-color:var(--link);font-weight:600}
button:hover{background:var(--surface)}
#err{color:var(--err);min-height:1.5em;margin:10px 0 0;font-size:.95em}
</style>
</head>
<body>
<form id="f">
  <h1>Janki Setup</h1>
  <p>Enter the password to continue.</p>
  <input id="pw" type="password" autocomplete="current-password" placeholder="Password" autofocus>
  <button type="submit">Open</button>
  <div id="err"></div>
</form>

const u=b=>Uint8Array.from(atob(b),c=>c.charCodeAt(0));
async function open_(pw){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u(D.s),iterations:250000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:u(D.i)},key,u(D.c)));
}
async function go(pw,remember){
  try{const html=await open_(pw);
    if(remember){try{sessionStorage.setItem("jk_setup_pw",pw);}catch(e){}}
    document.open();document.write(html);document.close();return true;
  }catch(e){return false;}
}
document.getElementById("f").addEventListener("submit",async e=>{
  e.preventDefault();const err=document.getElementById("err");err.textContent="";
  if(!await go(document.getElementById("pw").value.trim(),true))err.textContent="Wrong password.";
});

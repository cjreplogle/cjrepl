<head>
<meta charset="UTF-8">

<title>Janki Setup</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;--bg:#fff;--text:#1f2328;--muted:#59636e;--border:#d0d7de;--surface:#f6f8fa;--link:#0969da;--err:#cf222e;}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1117;--text:#e6edf3;--muted:#9198a1;--border:#3d444d;--surface:#151b23;--link:#4493f8;--err:#f85149;}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--text);font-family:"Lora",Georgia,serif;padding:16px}
form{width:100%;max-width:320px;text-align:center}
h1{font-size:1.5em;margin:0 0 6px}
p{color:var(--muted);margin:0 0 18px}
input,button{width:100%;font:inherit;padding:10px 12px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text)}
button{margin-top:10px;cursor:pointer;background:var(--link);border-color:var(--link);color:#fff}
#err{color:var(--err);min-height:1.4em;margin:10px 0 0;font-size:.95em}
</style>
</head>
<body>
<form id="f">
  <h1>Janki Setup</h1>
  <p>Enter the password to continue.</p>
  <input id="pw" type="password" autocomplete="current-password" placeholder="Password" autofocus>
  <button type="submit">Open</button>
  <div id="err"></div>
</form>

const u=b=>Uint8Array.from(atob(b),c=>c.charCodeAt(0));
async function open_(pw){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u(D.s),iterations:250000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:u(D.i)},key,u(D.c)));
}
async function go(pw,remember){
  try{const html=await open_(pw);
    if(remember){try{sessionStorage.setItem("jk_setup_pw",pw);}catch(e){}}
    document.open();document.write(html);document.close();return true;
  }catch(e){return false;}
}
document.getElementById("f").addEventListener("submit",async e=>{
  e.preventDefault();const err=document.getElementById("err");err.textContent="";
  if(!await go(document.getElementById("pw").value.trim(),true))err.textContent="Wrong password.";
});
try{const s=sessionStorage.getItem("jk_setup_pw");if(s)go(s,false);}catch(e){}

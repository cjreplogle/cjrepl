# Rephrase — study the same card in different words

*Janki can show a card **reworded** — the same fact phrased differently — so you
learn the concept instead of pattern-matching a string of text. The rephrase is
**display-only**: it never touches scheduling, intervals, or grading, and every
rephrase lives under the **same** card, so getting the reworded version right
counts exactly like getting the original right. Generation can be 100% local or imported from an agent of your choice (suggested).

<p>
  <img src="images/reword-original.png" alt="Original cloze card" width="48%">
  <img src="images/reword-reworded.png" alt="Same card, reworded" width="48%">
</p>

*Left: the card as written. Right: the same card reworded (note the **Reworded**
toggle bottom-left, with a **›** arrow to cycle to the next wording). Cloze
deletions, formatting, and images are preserved; only the phrasing changes.*

---

## What it does

- **Same card, new words.** The reworded text is swapped in at display time. The
  scheduler only ever sees the original card, so due counts, intervals, and your
  grade are identical whether you read the original or a rephrase.
- **Easily switch back.** A small **Original / Reworded** toggle sits in the
  bottom-left corner (styled to match the Practice "show original slide" button).
  In the original view it stays hidden until you hover near it or press
  **`Tab + R`**, so it never clutters a fresh card.
- **Multiple wordings.** If a card has more than one rephrase, a **›** arrow
  appears next to the toggle to cycle through them. View swaps fade in and out.
- **Faithful.** Cloze blanks (`[...]`), bold/lists/other formatting, and any
  images are carried across; only the wording is rewritten.

---

## Pick your AI model and generate-by-prompt (as `.rp`)

The highest-quality rephrases come from pasting wording out of any capable AI.
Janki gives you a ready-made prompt and a tolerant importer, so no card content
ever leaves your machine except the text you personally paste.

Open **Tools → Janki: Settings → Rephrase**.

1. **Copy rephrase prompt…** — opens a deck picker where you check which decks to
   pull from and choose what goes into the prompt (**Front** / **Back**,
   **Cloze** / **Basic** cards). It copies a ready-to-paste prompt to your
   clipboard. "Skip cards that already have rephrasings" avoids re-generating
   ones you've already imported.
2. **Paste it into any AI** (a chat model, a local model — your choice). The prompt
   asks it to hand back a downloadable **`janki-rephrase.rp`** file — just download
   it. (Models that can't create files print the JSON instead; use Import from
   clipboard for those.)
3. **Import** the result:
   - **Import (.rp)…** — pick a saved file (`.rp`, `.json`, `.txt`, `.rtf`,
     `.md`). The parser is deliberately forgiving: it handles messy or
     plaintext JSON, code fences, prose around the JSON, and even salvages
     malformed output, and it reports how many cards were imported vs. skipped
     (and why).
   - **Import from clipboard** — same parser, straight from what you copied.

For large sets, paste from a **file** rather than into a terminal.

---

## On-device concurrent generation (experimental backup)

Janki can also generate rephrases **entirely on your Mac** using Apple's
on-device foundation models (no network). This is kept as an **experimental
backup** — the bring-your-own-AI path above generally produces better wording and
works the same on any machine. 

If you are a medical student, I would err with caution using this as results have been 
less consistent. I've got it to a functional level but local-runtime models have a bit 
of improving to do before I am confident in suggesting their use here. The minor
details are what is important, and the most advanced models **are best for language 
specificity**. In my ideal world, everything is ran locally... but I digress.

Under **Tools → Janki: Settings → Rephrase → Experimental backup**, enable
on-device generation to have rephrases prepared in the background as you study, or
use the one-off button to rephrase the current card. The **Reworded** toggle
appears live on the card as soon as a rephrase finishes generating for it.

---

## Managing your rephrases

- **Preview current card…** — see the rephrases stored for the card in front of
  you (shown alongside the original).
- **View all rewords…** — a searchable browser of every stored rephrase, with a
  per-rephrase **×** to delete individual wordings.

Rephrases are stored locally in `user_files/rewords.json` (which survives add-on
updates) and persist across restarts.

> Everything here is local and reversible: on-device generation is off by
> default, imported wording lives only in your own collection's `user_files`, and
> any rephrase can be deleted individually from **View all rewords…**.

---

> [!NOTE]
> AI generated subcards fundamentally lacks the verification and
> intentional phrasing built-in to human phrased content. I have judged that modifying card
> phrasing *how this is implemented* will be useful to me, however, as with all AI
> generated content, I cannot verify that everything generated by this tool will be
> accurate. Please use discretion and use this feature with responsibility. Always
> defer conflicts to human-generated content, or better, ask questions and discuss ideas
> with those who have expertise.

  <script>
    const README_URL =
      "https://raw.githubusercontent.com/cjreplogle/janki/master/docs/rephrase.md";

    const REPO_URL =
      "https://github.com/cjreplogle/janki";

    const REPO_BLOB_URL =
      `${REPO_URL}/blob/master/docs/`;

    const RAW_REPO_URL =
      "https://raw.githubusercontent.com/cjreplogle/janki/master/docs/";

    // Route the Janki docs to their cjre.pl subpages instead of the GitHub .md.
    const DOC_PAGES = {
      "docs/practice-questions.md": "https://cjre.pl/ogle/janki/practice/",
      "docs/mobile-cards.md":       "https://cjre.pl/ogle/janki/mobile/",
      "docs/load-todays-lectures.md": "https://cjre.pl/ogle/janki/load/",
      "docs/rephrase.md":           "https://cjre.pl/ogle/janki/rephrase/",
      "practice-questions.md":      "https://cjre.pl/ogle/janki/practice/",
      "mobile-cards.md":            "https://cjre.pl/ogle/janki/mobile/",
      "load-todays-lectures.md":    "https://cjre.pl/ogle/janki/load/",
      "rephrase.md":                "https://cjre.pl/ogle/janki/rephrase/",
    };

    marked.setOptions({
      gfm: true,
      breaks: false
    });

    // Fade the corner mark out once scrolled away from the very top.
    const cornerMark = document.querySelector(".corner-mark");
    if (cornerMark) {
      // Only fade on scroll when the content column actually reaches under the
      // mark (narrow/mobile widths). On desktop it sits in the margin and never
      // overlaps the text, so leave it visible.
      const overlaps = () => {
        const content = document.getElementById("content");
        if (!content) return false;
        return content.getBoundingClientRect().right >
          cornerMark.getBoundingClientRect().left;
      };
      const updateCornerMark = () =>
        cornerMark.classList.toggle(
          "hidden",
          overlaps() && window.scrollY > 8
        );
      window.addEventListener("scroll", updateCornerMark, { passive: true });
      window.addEventListener("resize", updateCornerMark);
      updateCornerMark();
    }

    // Static-first, then refresh: render the baked-in README immediately (instant
    // paint, works offline), then fetch the live README in the background and
    // re-render only if it changed — so the page is fast AND never stays desynced.
    const baked =
      document.getElementById("readme-source")
        .textContent
        .replace(/^\s*<!--README:START-->\s*/, "")
        .replace(/\s*<!--README:END-->\s*$/, "");

    render(baked);

    fetch(README_URL)
      .then(response =>
        response.ok ? response.text() : Promise.reject()
      )
      .then(live => {
        if (live.trim() !== baked.trim()) {
          render(live);
        }
      })
      .catch(() => {
        // Offline or GitHub unreachable — keep the baked copy.
      });

    function render(markdown) {
        const html = marked.parse(markdown);
        const container = document.createElement("div");

        container.innerHTML = html;

        container
          .querySelectorAll("blockquote")
          .forEach(blockquote => {
            const firstParagraph =
              blockquote.querySelector("p");

            if (!firstParagraph) {
              return;
            }

            const html = firstParagraph.innerHTML;

            const match = html.match(
              /^\s*\[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\]\s*(?:<br\s*\/?>)?/i
            );

            if (!match) {
              return;
            }

            const type =
              match[1].toLowerCase();

            firstParagraph.innerHTML =
              html.substring(match[0].length);

            blockquote.classList.add(
              "markdown-alert",
              `markdown-alert-${type}`
            );

            const title =
              document.createElement("div");

            title.className =
              "markdown-alert-title";

            const titles = {
              note: "Note",
              tip: "Tip",
              important: "Important",
              warning: "Warning",
              caution: "Caution"
            };

            const icons = {
              note: "ⓘ",
              tip: "💡",
              important: "❗",
              warning: "⚠️",
              caution: "🛑"
            };

            title.textContent =
              `${icons[type]} ${titles[type]}`;

            blockquote.prepend(title);

            const dismiss =
              document.createElement("button");

            dismiss.type = "button";
            dismiss.className = "alert-dismiss";
            dismiss.setAttribute(
              "aria-label",
              "Dismiss"
            );
            dismiss.textContent = "✕";

            const dismissAlert = () => {
              if (blockquote.classList.contains("dismissing")) {
                return;
              }
              // Fade + slide out, collapsing the space, then remove.
              blockquote.style.maxHeight =
                blockquote.scrollHeight + "px";
              void blockquote.offsetHeight;
              blockquote.classList.add("dismissing");
              blockquote.style.maxHeight = "0px";

              blockquote.addEventListener(
                "transitionend",
                () => blockquote.remove(),
                { once: true }
              );
            };

            dismiss.addEventListener("click", e => {
              e.stopPropagation();
              dismissAlert();
            });

            // Clicking anywhere on the alert dismisses it too (but not its links).
            blockquote.style.cursor = "pointer";
            blockquote.addEventListener("click", e => {
              if (e.target.closest("a")) {
                return;
              }
              dismissAlert();
            });

            blockquote.appendChild(dismiss);
          });

        container
          .querySelectorAll("a")
          .forEach(link => {
            const href =
              link.getAttribute("href");

            if (!href) {
              return;
            }

            if (
              href.startsWith("#") ||
              href.startsWith("http://") ||
              href.startsWith("https://") ||
              href.startsWith("mailto:")
            ) {
              return;
            }

            const mappedDoc =
              DOC_PAGES[href] || DOC_PAGES[href.replace(/^\.\//, "")];
            if (mappedDoc) {
              link.href = mappedDoc;
              return;
            }

            if (
              href === "../../releases" ||
              href === "../releases" ||
              href === "releases"
            ) {
              link.href =
                `${REPO_URL}/releases`;

              return;
            }

            if (
              href === "../../issues" ||
              href === "../issues" ||
              href === "issues"
            ) {
              link.href =
                `${REPO_URL}/issues`;

              return;
            }

            if (
              href === "../../discussions" ||
              href === "../discussions" ||
              href === "discussions"
            ) {
              link.href =
                `${REPO_URL}/discussions`;

              return;
            }

            link.href =
              new URL(
                href,
                REPO_BLOB_URL
              ).href;

            link.target = "_blank";
            link.rel = "noopener noreferrer";
          });

        container
          .querySelectorAll("img")
          .forEach(img => {
            const src =
              img.getAttribute("src");

            if (!src) {
              return;
            }

            if (
              src.startsWith("http://") ||
              src.startsWith("https://") ||
              src.startsWith("data:")
            ) {
              return;
            }

            img.src =
              new URL(
                src,
                RAW_REPO_URL
              ).href;
          });

        container
          .querySelectorAll("a")
          .forEach(link => {
            if (
              link.href.startsWith("http")
            ) {
              link.target = "_blank";
              link.rel = "noopener noreferrer";
            }
          });

        // Make each ## section collapsible via a +/− toggle on the right.
        container
          .querySelectorAll("h2")
          .forEach(h2 => {
            const body =
              document.createElement("div");

            body.className = "section-body";

            let el = h2.nextElementSibling;

            while (el && el.tagName !== "H2") {
              const next = el.nextElementSibling;
              body.appendChild(el);
              el = next;
            }

            const toggle =
              document.createElement("button");

            toggle.type = "button";
            toggle.className = "section-toggle";
            toggle.setAttribute(
              "aria-expanded",
              "true"
            );
            toggle.textContent = "−";

            h2.classList.add("section-header");
            h2.appendChild(toggle);
            h2.after(body);

            const setOpen = open => {
              toggle.textContent = open ? "−" : "+";
              toggle.setAttribute(
                "aria-expanded",
                open ? "true" : "false"
              );

              if (open) {
                body.classList.remove("collapsed");
                body.style.maxHeight =
                  body.scrollHeight + "px";

                body.addEventListener(
                  "transitionend",
                  function te(e) {
                    if (e.propertyName === "max-height") {
                      body.style.maxHeight = "";
                      body.removeEventListener(
                        "transitionend",
                        te
                      );
                    }
                  }
                );
              } else {
                body.style.maxHeight =
                  body.scrollHeight + "px";
                void body.offsetHeight;
                body.classList.add("collapsed");
              }
            };

            h2.addEventListener("click", e => {
              if (e.target.closest("a")) {
                return;
              }

              setOpen(
                toggle.getAttribute(
                  "aria-expanded"
                ) !== "true"
              );
            });
          });

        // Link the page title (h1) to the GitHub repo.
        const heading = container.querySelector("h1");

        if (heading) {
          const repoLink = document.createElement("a");
          repoLink.href = REPO_URL;
          repoLink.target = "_blank";
          repoLink.rel = "noopener noreferrer";
          repoLink.style.color = "inherit";
          repoLink.style.textDecoration = "none";

          while (heading.firstChild) {
            repoLink.appendChild(heading.firstChild);
          }

          heading.appendChild(repoLink);
        }

        // The cjre.pl/ogle mark lives fixed at the top-right (see .corner-mark),
        // so drop the baked footer copy from the bottom of the content.
        const footerLink =
          container.querySelector('a[href*="cjre.pl/ogle"]');

        if (footerLink && footerLink.parentElement) {
          footerLink.parentElement.remove();
        }

        container.classList.add("fade-in");

        document
          .getElementById("content")
          .replaceChildren(container);
    }
  </script>

</body>
</html>

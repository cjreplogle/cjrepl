<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Janki</title>
  <script src="../marked.min.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">

  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --text: #1f2328;
      --muted: #59636e;
      --border: #d0d7de;
      --surface: #f6f8fa;
      --link: #0969da;
      --note-text: #0969da;
      --note-border: #0969da;
      --note-bg: #ddf4ff;
      --tip-text: #1a7f37;
      --tip-border: #1a7f37;
      --tip-bg: #dafbe1;
      --important-text: #8250df;
      --important-border: #8250df;
      --important-bg: #fbefff;
      --warning-text: #9a6700;
      --warning-border: #9a6700;
      --warning-bg: #fff8c5;
      --caution-text: #cf222e;
      --caution-border: #cf222e;
      --caution-bg: #ffebe9;
      --error-text: #cf222e;
      --error-border: #ff8182;
      --error-bg: #ffebe9;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #000000;
        --text: #ffffff;
        --muted: #b0b8c1;
        --border: #333333;
        --surface: #111111;
        --link: #58a6ff;
        --note-text: #58a6ff;
        --note-border: #58a6ff;
        --note-bg: #06151f;
        --tip-text: #56d364;
        --tip-border: #56d364;
        --tip-bg: #071a0d;
        --important-text: #bc8cff;
        --important-border: #bc8cff;
        --important-bg: #160d24;
        --warning-text: #e3b341;
        --warning-border: #e3b341;
        --warning-bg: #211a05;
        --caution-text: #ff7b72;
        --caution-border: #ff7b72;
        --caution-bg: #210b0b;
        --error-text: #ff7b72;
        --error-border: #ff8182;
        --error-bg: #210b0b;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 10px;
      background: var(--bg);
      color: var(--text);
      font-family:
        "Lora",
        Georgia,
        "Times New Roman",
        serif;
      font-size: 16px;
      line-height: 1.5;
    }

    .markdown-body {
      max-width: 900px;
      margin: 0 auto;
    }

    .fade-in {
      animation: fadeIn 0.45s ease-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(4px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .fade-in {
        animation: none;
      }
    }

    /* Mock Anki cloze on the tagline's "Anki": blank [...] → revealed answer, in
       Janki's cloze blue. */
    /* Keep the tagline's "Anki" (and its [...] cloze blank/reveal) blue in every
       state — static first paint, mid-animation, and after the reveal. */
    p[align="center"] a,
    .cloze-mock,
    .cloze-reveal {
      color: #6db3ff !important;
    }

    /* First-load "card" intro (mobile): center the splash like an Anki card,
       tap to grade (color flare) or scroll — then the page behaves normally. */
    .splash {
      min-height: 0;
      display: flex;
      flex-direction: column;
      transition: min-height 0.55s cubic-bezier(0.4, 0, 0.2, 1);
    }
    /* Card intro: fill the viewport (page content sits below the fold); the title
       stays at the top and the tagline is centred in the remaining space. */
    body.card-mode .splash {
      min-height: 100vh;
      min-height: 100dvh;
    }
    /* While the card is up, hide the rest of the page so nothing peeks. */
    body.card-mode .splash ~ * { display: none !important; }
    /* Center the tagline in the actual visible viewport; the title stays at top.
       On dismiss it's animated from here up to its normal position (see JS). */
    body.card-mode .tagline {
      position: fixed;
      top: 50%;
      left: 0;
      right: 0;
      transform: translateY(-50%);
      margin: 0;
      padding: 0 18px;
      z-index: 70;
    }
    /* Prominent, responsive tagline size (bigger on mobile), robust across the
       card/typewriter timing. */
    .tagline {
      font-size: clamp(1.45rem, 5.2vw, 2.15rem) !important;
      line-height: 1.35;
      margin: 1.5em 0 1.7em;   /* breathing room above/below in the normal layout */
    }
    @media (prefers-reduced-motion: reduce) {
      .splash { transition: none; }
    }
    /* Legal / support fine print (everything after the #legal marker) — smaller. */
    #legal ~ * {
      font-size: 0.85em;
      opacity: 0.8;
    }
    #legal ~ h2 { font-size: 1.1em; }
    .card-hint {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 26px;
      text-align: center;
      font-size: 0.8rem;
      opacity: 0.4;
      pointer-events: none;
      z-index: 40;
      animation: hintPulse 2s ease-in-out infinite;
    }
    @keyframes hintPulse { 50% { opacity: 0.14; } }
    .grade-flare {
      position: fixed;
      inset: 0;
      z-index: 60;
      pointer-events: none;
      opacity: 0;
      animation: gradeFlare 0.6s ease-out forwards;
      /* background (a radial glow in the grade colour, from the tap point) is set
         inline per tap; emulates the janki reviewer's grade glow. */
    }
    @keyframes gradeFlare {
      0% { opacity: 0; }
      22% { opacity: 0.55; }
      100% { opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .grade-flare { animation-duration: 0.25s; }
      body.card-mode .splash { transition: none; }
    }

    .cloze-mock {
      font-weight: normal;
      text-decoration: none;
    }

    .cloze-reveal {
      display: inline-block;
      animation: clozeReveal 0.45s ease-out;
    }

    @keyframes clozeReveal {
      from {
        opacity: 0;
        filter: blur(3px);
        transform: translateY(2px);
      }

      to {
        opacity: 1;
        filter: blur(0);
        transform: translateY(0);
      }
    }

    h1, h2, h3, h4, h5, h6 {
      margin-top: 24px;
      margin-bottom: 16px;
      font-weight: 600;
      line-height: 1.25;
    }

    h1 {
      padding-bottom: 0.3em;
      font-size: 2em;
    }

    #content h1 {
      margin-top: 4px;
    }

    h2 {
      padding-bottom: 0.3em;
      border-bottom: 1px solid var(--border);
      font-size: 1.5em;
    }

    h3 {
      font-size: 1.25em;
    }

    h4 {
      font-size: 1em;
    }

    p {
      margin-top: 0;
      margin-bottom: 16px;
    }

    a {
      color: var(--link);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    img,
    video {
      max-width: 100%;
      height: auto;
    }

    ul,
    ol {
      margin-top: 0;
      margin-bottom: 16px;
      padding-left: 2em;
    }

    li + li {
      margin-top: 0.25em;
    }

    code,
    tt {
      padding: 0.2em 0.4em;
      margin: 0;
      font-size: 85%;
      background: var(--surface);
      border-radius: 6px;
      font-family:
        ui-monospace,
        SFMono-Regular,
        "SF Mono",
        Menlo,
        Consolas,
        "Liberation Mono",
        monospace;
    }

    pre {
      padding: 16px;
      overflow: auto;
      margin-top: 0;
      margin-bottom: 16px;
      background: var(--surface);
      border-radius: 6px;
      line-height: 1.45;
    }

    pre code {
      padding: 0;
      margin: 0;
      background: transparent;
      border: 0;
      font-size: 100%;
      white-space: pre;
    }

    blockquote {
      margin: 0 0 16px;
      padding: 0 1em;
      color: var(--muted);
      border-left: 0.25em solid var(--border);
    }

    blockquote > :first-child {
      margin-top: 0;
    }

    blockquote > :last-child {
      margin-bottom: 0;
    }

    hr {
      height: 0.25em;
      padding: 0;
      margin: 24px 0;
      background: var(--border);
      border: 0;
    }

    table {
      width: 100%;
      margin-bottom: 16px;
      border-spacing: 0;
      border-collapse: collapse;
      display: block;
      overflow-x: auto;
    }

    th,
    td {
      padding: 6px 13px;
      border: 1px solid var(--border);
    }

    th {
      font-weight: 600;
      background: var(--surface);
    }

    tr {
      background: var(--bg);
      border-top: 1px solid var(--border);
    }

    tr:nth-child(2n) {
      background: var(--surface);
    }

    strong {
      font-weight: 600;
    }

    .markdown-alert {
      position: relative;
      overflow: hidden;
      padding: 8px 16px;
      margin-bottom: 16px;
      border-left: 4px solid;
      border-radius: 4px;
      transition:
        max-height 0.28s ease,
        opacity 0.28s ease,
        transform 0.28s ease,
        margin 0.28s ease,
        padding 0.28s ease;
    }

    .markdown-alert.dismissing {
      opacity: 0;
      transform: translateX(16px);
      margin-bottom: 0;
      padding-top: 0;
      padding-bottom: 0;
    }

    .alert-dismiss {
      position: absolute;
      top: 6px;
      right: 8px;
      padding: 2px;
      font-size: 13px;
      line-height: 1;
      color: inherit;
      background: transparent;
      border: 0;
      outline: none;
      cursor: pointer;
      opacity: 0.45;
      transition: opacity 0.15s ease;
    }

    .alert-dismiss:hover {
      opacity: 0.85;
    }

    .markdown-alert > *:last-child {
      margin-bottom: 0;
    }

    .markdown-alert-title {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 4px;
      font-weight: 600;
    }

    .markdown-alert-note {
      color: var(--note-text);
      border-color: var(--note-border);
      background: var(--note-bg);
    }

    .markdown-alert-tip {
      color: var(--tip-text);
      border-color: var(--tip-border);
      background: var(--tip-bg);
    }

    .markdown-alert-important {
      color: var(--important-text);
      border-color: var(--important-border);
      background: var(--important-bg);
    }

    .markdown-alert-warning {
      color: var(--warning-text);
      border-color: var(--warning-border);
      background: var(--warning-bg);
    }

    .markdown-alert-caution {
      color: var(--caution-text);
      border-color: var(--caution-border);
      background: var(--caution-bg);
    }

    .task-list-item {
      list-style-type: none;
    }

    .task-list-item input[type="checkbox"] {
      margin: 0 0.35em 0.25em -1.6em;
      vertical-align: middle;
    }

    h2.section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      cursor: pointer;
    }

    .section-toggle {
      flex: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      padding: 0;
      font-size: 20px;
      line-height: 1;
      color: var(--muted);
      background: transparent;
      border: 0;
      outline: none;
      border-radius: 6px;
      cursor: pointer;
      opacity: 0.4;
      transition: opacity 0.15s ease;
    }

    .section-toggle:hover {
      opacity: 0.75;
    }

    .section-body {
      overflow: hidden;
      transition: max-height 0.3s ease, opacity 0.3s ease;
    }

    .section-body.collapsed {
      max-height: 0 !important;
      opacity: 0;
    }

    .corner-mark {
      position: fixed;
      top: 8px;
      right: 12px;
      z-index: 10;
      font-size: 0.72em;
      color: var(--muted);
      text-decoration: none;
      opacity: 0.65;
      transition: opacity 0.15s ease;
    }

    .corner-mark:hover {
      opacity: 1;
      text-decoration: underline;
    }

    .corner-mark.hidden {
      opacity: 0;
      pointer-events: none;
    }

    /* Mock Janki deck browser, drawn in place of the reviewer.jpg hero. Sized in
       em off a container-width base (1em = 1/90 of the window width), so it scales
       like a screenshot; the dark tokens match Janki on a black background. */
    .anki-mock {
      --mk-win: #f4f4f5;
      --mk-edge: #d4d4d8;
      --mk-pill: #e4e4e7;
      --mk-text: #18181b;
      --mk-zero: #8a8f98;
      --mk-rule: #d4d4d8;
      --mk-new: #1d6fd6;
      --mk-learn: #d63a3a;
      --mk-due: #1f9d4c;
      --mk-practice: #1f9d4c;
      --mk-sync: #4a63a8;
      --mk-hover: #0000000d;
      --mk-opt: #ffffff;
      --mk-cloze: #1d6fd6;
      container-type: inline-size;
      max-width: 900px;
      margin: 0 auto 24px;
    }
    @media (prefers-color-scheme: dark) {
      .anki-mock {
        --mk-win: #111214;
        --mk-edge: #3a3b3e;
        --mk-pill: #09090a;
        --mk-text: #ffffff;
        --mk-zero: #8a8f98;
        --mk-rule: #3a3b3e;
        --mk-new: #82b6ff;
        --mk-learn: #ff6b6b;
        --mk-due: #36c75e;
        --mk-practice: #86e39a;
        --mk-sync: #a9bde6;
        --mk-hover: #ffffff0f;
        --mk-opt: #ffffff08;
        --mk-cloze: #5aa0ff;
      }
    }
    .mk-win {
      position: relative;
      aspect-ratio: 1800 / 1130;
      font-size: calc(100cqw / 90);
      line-height: 1;
      color: var(--mk-text);
      background: var(--mk-win);
      border: 1px solid var(--mk-edge);
      border-radius: 0.8em;
      overflow: hidden;
      user-select: none;
    }
    .mk-lights {
      position: absolute;
      top: 0.6em;
      left: 0.58em;
      display: flex;
      gap: 0.62em;
    }
    .mk-lights i {
      width: 0.88em;
      height: 0.88em;
      border-radius: 50%;
    }
    .mk-lights i:nth-child(1) { background: #ff5f57; }
    .mk-lights i:nth-child(2) { background: #febc2e; }
    .mk-lights i:nth-child(3) { background: #28c840; }
    .mk-bar,
    .mk-actions {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      white-space: nowrap;
    }
    .mk-bar {
      top: 2.15em;
      height: 2.25em;
      align-items: center;
      gap: 2.2em;
      padding: 0 1.4em;
      font-weight: 700;
      background: var(--mk-pill);
      border-radius: 1.125em;
    }
    .mk-bar .practice { color: var(--mk-practice); }
    .mk-bar .sync { color: var(--mk-sync); }
    .mk-table {
      position: absolute;
      top: 8.15em;
      left: 50%;
      width: 39.7em;
      transform: translateX(-50%);
    }
    .mk-row {
      position: relative;
      display: flex;
      align-items: center;
      height: 2.4em;
      padding-right: 0.6em;
    }
    .mk-row.mk-head {
      height: auto;
      padding-bottom: 0.52em;
      margin-bottom: 0.55em;
      font-weight: 700;
      border-bottom: 1px solid var(--mk-rule);
    }
    .mk-name {
      flex: 1;
      display: flex;
    }
    .mk-row:not(.mk-head) .mk-name::before {
      content: attr(data-exp);
      width: 1.45em;
      padding-left: 0.3em;
    }
    .mk-row > span:not(.mk-name) {
      width: 5.8em;
      text-align: center;
    }
    .mk-row .z { color: var(--mk-zero); }
    .mk-row .n { color: var(--mk-new); }
    .mk-row .l { color: var(--mk-learn); }
    .mk-row .d { color: var(--mk-due); }
    .mk-gear {
      position: absolute;
      right: 1.3em;
      width: 0.95em;
      height: 0.95em;
      fill: var(--mk-zero);
    }
    .mk-actions {
      bottom: 1.05em;
      gap: 0.6em;
      font-size: 0.9em;
    }
    .mk-actions span {
      display: flex;
      align-items: center;
      height: 2.55em;
      padding: 0 1.1em;
      background: var(--mk-pill);
      border-radius: 1.28em;
    }

    /* Interactive layer: one view at a time (decks / review / done). */
    .mk-win { outline: none; }
    .mk-bar { z-index: 3; }
    .mk-bar [data-go] { cursor: pointer; }
    .mk-view {
      position: absolute;
      inset: 0;
      display: none;
    }
    .mk-win[data-view="decks"] .mk-decks,
    .mk-win[data-view="review"] .mk-review,
    .mk-win[data-view="done"] .mk-done { display: block; }
    .mk-row[data-deck] {
      cursor: pointer;
      border-radius: 0.4em;
    }
    .mk-row[data-deck]:hover { background: var(--mk-hover); }
    .mk-review { cursor: pointer; }
    .mk-card {
      position: absolute;
      top: 6.7em;
      left: 50%;
      width: min(75em, 88%);
      transform: translateX(-50%);
      font-size: 2.15em;
      line-height: 1.3;
      text-align: center;
    }
    .mk-card.mk-in { animation: fadeIn 0.35s ease-out; }
    .mk-cloze {
      font-weight: 700;
      color: var(--mk-cloze);
    }
    .mk-cloze.mk-ans {
      display: inline-block;
      animation: clozeReveal 0.45s ease-out;
    }
    .mk-card.mk-mcq {
      top: 4.3em;
      width: min(50em, 90%);
      font-size: 1.6em;
      line-height: 1.4;
      text-align: left;
    }
    .mk-opts {
      display: flex;
      flex-direction: column;
      gap: 0.35em;
      margin-top: 0.85em;
    }
    .mk-opt {
      padding: 0.45em 0.6em;
      background: var(--mk-opt);
      border: 1px solid var(--mk-edge);
      border-radius: 0.3em;
      transition: background 0.2s ease, border-color 0.2s ease;
    }
    .mk-opt:hover { border-color: var(--mk-zero); }
    .mk-opt.right { border-color: #35d073; background: #35d07326; }
    .mk-opt.wrong { border-color: #ff5c5c; background: #ff5c5c26; }
    .mk-chip {
      position: absolute;
      left: 1.1em;
      bottom: 5.85em;
      padding: 0.35em 0.75em;
      font-size: 0.9em;
      color: var(--mk-zero);
      border: 1px solid var(--mk-edge);
      border-radius: 1em;
    }
    .mk-chip:hover { color: var(--mk-text); }
    .mk-counts {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 4em;
      font-size: 0.9em;
      text-align: center;
      color: var(--mk-zero);
    }
    .mk-counts .u { text-decoration: underline; }
    .mk-counts .n { color: var(--mk-new); }
    .mk-counts .l { color: var(--mk-learn); }
    .mk-counts .d { color: var(--mk-due); }
    .mk-answer {
      position: absolute;
      left: 1.15em;
      right: 1.15em;
      bottom: 0.9em;
      height: 2.1em;
      display: flex;
      font-size: 0.9em;
      background: var(--mk-pill);
      border-radius: 0.6em;
      overflow: hidden;
    }
    .mk-answer > * {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .mk-answer > *:hover { background: var(--mk-hover); }
    .mk-timer {
      position: absolute;
      top: 0.55em;
      right: 0.8em;
      width: 1.5em;
      height: 1.5em;
      transform: rotate(-90deg);
      display: none;
    }
    .mk-win[data-view="review"] .mk-timer { display: block; }
    .mk-timer circle {
      fill: none;
      stroke-width: 2.4;
    }
    .mk-timer .track { stroke: var(--mk-hover); }
    .mk-timer .fill {
      stroke: var(--mk-zero);
      stroke-dasharray: 56.55;
      stroke-dashoffset: 56.55;
    }
    .mk-timer.run .fill { animation: mkTimer var(--mk-secs) linear forwards; }
    @keyframes mkTimer { to { stroke-dashoffset: 0; } }
    .mk-flare,
    .mk-edge {
      position: absolute;
      inset: 0;
      z-index: 5;
      pointer-events: none;
    }
    .mk-flare { animation: gradeFlare 0.6s ease-out forwards; }
    .mk-edge {
      opacity: 0;
      box-shadow: inset 0 0 3.5em #ff4646b3;
      border-radius: inherit;
    }
    .mk-edge.on { animation: mkEdge 1.8s ease-out; }
    @keyframes mkEdge { 25% { opacity: 1; } }
    .mk-done p {
      position: absolute;
      top: 14em;
      left: 0;
      right: 0;
      margin: 0;
      font-size: 1.3em;
      line-height: 1.5;
      text-align: center;
    }
    .mk-done small {
      color: var(--mk-zero);
      font-size: 0.7em;
    }
    .mk-caption {
      margin-top: 8px;
      font-size: 0.8rem;
      text-align: center;
      color: var(--muted);
    }
    /* Phone widths: a taller window with a bigger base so text stays legible. */
    @container (max-width: 600px) {
      .mk-win {
        aspect-ratio: 4 / 5;
        font-size: calc(100cqw / 52);
      }
      .mk-card { top: 5em; }
    }

    .loading {
      color: var(--muted);
      text-align: center;
      padding: 40px 0;
    }

    .error {
      color: var(--error-text);
      padding: 20px;
      border: 1px solid var(--error-border);
      border-radius: 6px;
      background: var(--error-bg);
    }

    @media (max-width: 600px) {
      body {
        padding: 8px 16px;
        font-size: 15px;
      }

      h1 {
        font-size: 1.75em;

# Janki

<p align="center" style="font-weight: 400;">A feature-rich <a href=https://github.com/ankitects/anki>Anki</a> client for MacOS designed around you.
</p>

<p align="center">
  <img src="docs/media/reviewer.jpg" alt="Frosted-glass reviewer" width="360">
</p>

>[!WARNING]
> Some features within this add-on are still rather experimental. Please use at your own risk!

## Install

Runs as a plugin on top of Anki. No separate app.
Two builds — pick one (each link always downloads the latest release):

- **[⬇ Download `janki.ankiaddon`](https://github.com/cjreplogle/janki/releases/latest/download/janki.ankiaddon)**
  — the full frosted-glass experience. Adds a small, self-healing, reversible
  **patch layer** to Anki that enables the transparency (details below). I use this.
- **[⬇ Download `load-todays-lectures.ankiaddon`](https://github.com/cjreplogle/janki/releases/latest/download/load-todays-lectures.ankiaddon)**
  — a bare-bones version of the add-on that simply has the
  [Load today's lectures](docs/load-todays-lectures.md) import functionality.
  Designed for if you don't care for any of the other features.

1. **Install Anki** (if you haven't yet) from [apps.ankiweb.net](https://apps.ankiweb.net).
2. **Double-click the downloaded `.ankiaddon`** (Anki opens and installs it), or in Anki:
   **Tools → Add-ons → Install from file…** → pick the file.
3. **Restart Anki.** On first launch Janki applies a small one-time patch to Anki
   so the frosted glass can work, then asks you to **quit and reopen once**. Do
   that, and the glass is on. From then on, just open Anki normally.

> [!NOTE]
> **Why the one-time patch + restart?** True transparency needs a setting applied
> before Anki starts drawing — something an add-on alone can't do. Janki modifies
> two of Anki's own files to enable it (backups are kept), and **re-applies
> automatically after any Anki update**, prompting a quick restart when it does.



**From source (devs):** copy the files into
`~/Library/Application Support/Anki2/addons21/janki/`.

### Updating
After the first install, Janki updates itself — no more manual downloads. It
checks this repo's Releases about once a day and, when a newer version is out,
offers a one-click **Update now** (it grabs the matching build, installs it, and
keeps your settings). You can also trigger it anytime with **Tools → Janki: Check
for updates…**, or turn the auto-check off via the `auto_update_check` config.

### Uninstall
Because the glass involves a small patch to Anki's own files, remove it the clean
way: **Tools → Janki: Settings… → General → "Restore stock Anki (remove glass
patch)"**, restart, then delete the add-on from **Tools → Add-ons**. That restores
Anki's original files (repairing its signature) and clears everything Janki added,
so nothing is left behind.

> To change or disable any feature: **Tools → Janki: Settings…**


## Features

- **Frosted-glass reviewer** — revamps the Anki user interface from the ground up. Minimal, yet designed to seamlessly take advantage of modern hardware features. Includes a rework of card animations, application-wide frosted glass transparency, and much, much more...

  <p align="center">
    <img src="docs/media/reviewer2.jpg" alt="Reviewer glass" width="48%">
    <img src="docs/media/reviewer3.jpg" alt="Reviewer glass, another card" width="48%">
  </p>
- **Focus Mode** (**`Tab+F`**) — hides toolbar/answer bar and centers the card.
  Only has the card contents on screen. Also throws in small customizable timer
  which fills over N seconds; when it runs out a red edge-glow flares
  (a "time to move on" nudge). A green flare denotes a card as finished for the day.
- **Lockdown Mode** (`backtick/~+delete`) — locks Janki into fullscreen to keep
  you from getting distracted. Escape by holding space/the entry bind for 10s.
  Tiered into three levels depending on how cooked your attention span is from
  doom-scrolling.
  
  <p align="center">
    <video src="https://github.com/cjreplogle/janki/raw/master/docs/media/scroll-animations.mp4" autoplay loop muted playsinline controls width="560"></video>
  </p>

- **Rephrase** — automatically re-word the same card
  slightly differently while retaining core information (Enable: **`Tab + R`**), so you
  don't simply memorize the card without understanding it. Automatically intersperses
  reworded cards after a single pass, while the original text is easily retrievable. All
  rephrases fall with the same card, so making headway with the adjusted wording has the
  same effect as getting the original card correct.

  **→ [How to Use Card Rephrasing](https://cjre.pl/ogle/janki/rephrase)**
- **Practice questions** — pull multiple-choice questions
  related to the card you're reviewing (**`Tab + Q`**), or load whole question banks into
  Anki as a real, syncable Practice deck. Banks are local `.qb` files; grading is by answer
  choice (correct → suspend, wrong → retry, skip → bury) with a per-bank Score. Runtime is
  100% local.
  
  **→ [Practice system + how to import a document as a question bank](docs/practice-questions.md)**
- **.jank bundles** — one file per content drop: decks (`.apkg`), question banks (`.qb`),
  lecture tag maps (`.json`) and rephrasings (`.rp`) imported together, in the right order,
  without touching your review history. **Settings → General → Import .jank…**, and
  **Build .jank…** to package your own.

  **→ [.jank bundles: importing and building](https://cjre.pl/ogle/janki/jank)**
- **Mobile card theming** *(experimental, off by default)* — AnkiMobile/AnkiDroid can't run
  add-ons, so this can stamp an OLED-dark background, a serif font, and the text-reveal
  animation into your note types (scoped to mobile) so the look rides your normal sync
  to the phone/iPad. It rewrites every note type's templates, so it's opt-in: set
  `"mobile_cards": true` in the add-on config to reveal **Tools → Janki: Mobile cards**
  (Apply / Remove — one-click reversible).
  
  **→ [Mobile cards setup + recommended AnkiMobile settings](docs/mobile-cards.md)**

  <p align="center">
    <video src="https://github.com/cjreplogle/janki/raw/master/docs/media/mobile-cards.mp4" autoplay loop muted playsinline controls width="240"></video>
    <!-- practice mobile clip hidden for now
    <video src="https://github.com/cjreplogle/janki/raw/master/docs/media/mobile-practice.mp4" autoplay loop muted playsinline controls width="240"></video>
    -->
  </p>
- **Load today's lectures** — reads a local `.ics`
  calendar (URL/file) and a local `.txt`/`.xlsx` lecture→tag map, finds your
  classes for the day, and adaptively unsuspends relevant tagged cards
  (AJ/#AK/Hutch decks tested). A calendar is optional — without one you pick
  lectures manually.

  **→ [Load Today's Lectures tutorial](docs/load-todays-lectures.md)**

  <p align="center">
    <img src="docs/media/load-todays-lectures.jpg" alt="Load today's lectures" width="375">
  </p>

  *This feature expects your own calendar export and tag map; set their paths on
  the Lectures → Sources tab (or just run **Tools → Load today's lectures** and
  pick a tag map when prompted). Nothing is uploaded — the calendar is read
  locally (a URL source is optional and fetched only if you enter one).*
- **Caption Mode** — Trying to multitask but still see your anki cards? Press **`Tab + \`**
  to change the Anki notecard view to be in "caption" form. **`Tab+Arrow Keys`**
  adjusts their screen position. Remains visible in this view even when other
  things are in fullscreen. (Note: also integrated to work & adjust with remote buttons)

  <p align="center">
    <video src="https://github.com/cjreplogle/janki/raw/master/docs/media/caption-mode.mp4" autoplay loop muted playsinline controls width="560"></video>
  </p>
- **Global hotkeys & remote** — hold **Tab** as a modifier or use your
  controller to drive the reviewer even when Anki is not focused.
  (i.e. **`Tab+Z`** → again, overrides being unfocused). **`Cmd+Opt+A`** also will globally
  focus the Anki window regardless of whatever else you are doing.
- **Pomodoro** — review-time work intervals, an in-window break screen
  (hold **Space** to skip), and a calm "break due" blue edge tint.
  Toggle the whole system on/off in settings. 
- **Tray menu** — keeps Anki open in the background and allows you to navigate a
  miniaturized menu with other things focused.
- **Quick Zoom** — for whatever god forsaken reason Anki does not have **`Cmd+`**
  or **`Cmd-`** hotkeys to zoom card contents so that exists now...

  <script>
    const README_URL =
      "https://raw.githubusercontent.com/cjreplogle/janki/master/README.md";

    const REPO_URL =
      "https://github.com/cjreplogle/janki";

    const REPO_BLOB_URL =
      `${REPO_URL}/blob/master/`;

    const RAW_REPO_URL =
      "https://raw.githubusercontent.com/cjreplogle/janki/master/";

    // Route the Janki docs to their cjre.pl subpages instead of the GitHub .md.
    const DOC_PAGES = {
      "docs/practice-questions.md": "https://cjre.pl/ogle/janki/practice/",
      "docs/mobile-cards.md":       "https://cjre.pl/ogle/janki/mobile/",
      "docs/load-todays-lectures.md": "https://cjre.pl/ogle/janki/load/",
      "docs/rephrase.md":           "https://cjre.pl/ogle/janki/rephrase/",
      "docs/jank.md":               "https://cjre.pl/ogle/janki/jank/",
      "practice-questions.md":      "https://cjre.pl/ogle/janki/practice/",
      "mobile-cards.md":            "https://cjre.pl/ogle/janki/mobile/",
      "load-todays-lectures.md":    "https://cjre.pl/ogle/janki/load/",
      "rephrase.md":                "https://cjre.pl/ogle/janki/rephrase/",
      "jank.md":                    "https://cjre.pl/ogle/janki/jank/",
    };

    marked.setOptions({
      gfm: true,
      breaks: false
    });

    // Fade the corner mark out once scrolled away from the very top.
    const cornerMark = document.querySelector(".corner-mark");
    if (cornerMark) {
      // Only fade on scroll when the content column actually reaches under the
      // mark (narrow/mobile widths). On desktop it sits in the margin and never
      // overlaps the text, so leave it visible.
      const overlaps = () => {
        const content = document.getElementById("content");
        if (!content) return false;
        return content.getBoundingClientRect().right >
          cornerMark.getBoundingClientRect().left;
      };
      const updateCornerMark = () =>
        cornerMark.classList.toggle(
          "hidden",
          overlaps() && window.scrollY > 8
        );
      window.addEventListener("scroll", updateCornerMark, { passive: true });
      window.addEventListener("resize", updateCornerMark);
      updateCornerMark();
    }

    // Static-first, then refresh: render the baked-in README immediately (instant
    // paint, works offline), then fetch the live README in the background and
    // re-render only if it changed — so the page is fast AND never stays desynced.
    const baked =
      document.getElementById("readme-source")
        .textContent
        .replace(/^\s*<!--README:START-->\s*/, "")
        .replace(/\s*<!--README:END-->\s*$/, "");

    render(baked);

    fetch(README_URL)
      .then(response =>
        response.ok ? response.text() : Promise.reject()
      )
      .then(live => {
        if (live.trim() !== baked.trim()) {
          render(live);
        }
      })
      .catch(() => {
        // Offline or GitHub unreachable — keep the baked copy.
      });

    function render(markdown) {
        const html = marked.parse(markdown);
        const container = document.createElement("div");

        container.innerHTML = html;

        // The README embeds several autoplay+loop videos streamed from GitHub.
        // Left as-is they all download and decode at once (100s of MB of memory),
        // even while off-screen or in collapsed sections. Instead: don't preload,
        // and only play the video that's actually visible — pause the rest so at
        // most one decodes at a time.
        (function lazyVideos() {
          const vids = container.querySelectorAll("video");
          if (!vids.length) return;
          if (window.__vidIO) window.__vidIO.disconnect();
          vids.forEach(v => {
            v.removeAttribute("autoplay");
            v.preload = "none";
            v.muted = true;
          });
          window.__vidIO = new IntersectionObserver(entries => {
            entries.forEach(e => {
              const v = e.target;
              if (e.isIntersecting) {
                const p = v.play();
                if (p && p.catch) p.catch(() => {});
              } else {
                v.pause();
              }
            });
          }, { threshold: 0.25 });
          vids.forEach(v => window.__vidIO.observe(v));
        })();

        container
          .querySelectorAll("blockquote")
          .forEach(blockquote => {
            const firstParagraph =
              blockquote.querySelector("p");

            if (!firstParagraph) {
              return;
            }

            const html = firstParagraph.innerHTML;

            const match = html.match(
              /^\s*\[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\]\s*(?:<br\s*\/?>)?/i
            );

            if (!match) {
              return;
            }

            const type =
              match[1].toLowerCase();

            firstParagraph.innerHTML =
              html.substring(match[0].length);

            blockquote.classList.add(
              "markdown-alert",
              `markdown-alert-${type}`
            );

            const title =
              document.createElement("div");

            title.className =
              "markdown-alert-title";

            const titles = {
              note: "Note",
              tip: "Tip",
              important: "Important",
              warning: "Warning",
              caution: "Caution"
            };

            const icons = {
              note: "ⓘ",
              tip: "💡",
              important: "❗",
              warning: "⚠️",
              caution: "🛑"
            };

            title.textContent =
              `${icons[type]} ${titles[type]}`;

            blockquote.prepend(title);

            const dismiss =
              document.createElement("button");

            dismiss.type = "button";
            dismiss.className = "alert-dismiss";
            dismiss.setAttribute(
              "aria-label",
              "Dismiss"
            );
            dismiss.textContent = "✕";

            const dismissAlert = () => {
              if (blockquote.classList.contains("dismissing")) {
                return;
              }
              // Fade + slide out, collapsing the space, then remove.
              blockquote.style.maxHeight =
                blockquote.scrollHeight + "px";
              void blockquote.offsetHeight;
              blockquote.classList.add("dismissing");
              blockquote.style.maxHeight = "0px";

              blockquote.addEventListener(
                "transitionend",
                () => blockquote.remove(),
                { once: true }
              );
            };

            dismiss.addEventListener("click", e => {
              e.stopPropagation();
              dismissAlert();
            });

            // Clicking anywhere on the alert dismisses it too (but not its links).
            blockquote.style.cursor = "pointer";
            blockquote.addEventListener("click", e => {
              if (e.target.closest("a")) {
                return;
              }
              dismissAlert();
            });

            blockquote.appendChild(dismiss);
          });

        container
          .querySelectorAll("a")
          .forEach(link => {
            const href =
              link.getAttribute("href");

            if (!href) {
              return;
            }

            if (
              href.startsWith("#") ||
              href.startsWith("http://") ||
              href.startsWith("https://") ||
              href.startsWith("mailto:")
            ) {
              return;
            }

            const mappedDoc =
              DOC_PAGES[href] || DOC_PAGES[href.replace(/^\.\//, "")];
            if (mappedDoc) {
              link.href = mappedDoc;
              return;
            }

            if (
              href === "../../releases" ||
              href === "../releases" ||
              href === "releases"
            ) {
              link.href =
                `${REPO_URL}/releases`;

              return;
            }

            if (
              href === "../../issues" ||
              href === "../issues" ||
              href === "issues"
            ) {
              link.href =
                `${REPO_URL}/issues`;

              return;
            }

            if (
              href === "../../discussions" ||
              href === "../discussions" ||
              href === "discussions"
            ) {
              link.href =
                `${REPO_URL}/discussions`;

              return;
            }

            link.href =
              new URL(
                href,
                REPO_BLOB_URL
              ).href;

            link.target = "_blank";
            link.rel = "noopener noreferrer";
          });

        // Swap the hero reviewer photo for a live-drawn mock of the deck browser.
        const hero = container.querySelector('img[src$="reviewer.jpg"]');
        if (hero) {
          (hero.closest("p") || hero).replaceWith(buildAnkiMock());
        }

        container
          .querySelectorAll("img")
          .forEach(img => {
            const src =
              img.getAttribute("src");

            if (!src) {
              return;
            }

            if (
              src.startsWith("http://") ||
              src.startsWith("https://") ||
              src.startsWith("data:")
            ) {
              return;
            }

            img.src =
              new URL(
                src,
                RAW_REPO_URL
              ).href;
          });

        container
          .querySelectorAll("a")
          .forEach(link => {
            if (
              link.href.startsWith("http")
            ) {
              link.target = "_blank";
              link.rel = "noopener noreferrer";
            }
          });

        // Make each ## section collapsible via a +/− toggle on the right.
        container
          .querySelectorAll("h2")
          .forEach(h2 => {
            const body =
              document.createElement("div");

            body.className = "section-body";

            let el = h2.nextElementSibling;

            while (el && el.tagName !== "H2") {
              const next = el.nextElementSibling;
              body.appendChild(el);
              el = next;
            }

            const toggle =
              document.createElement("button");

            toggle.type = "button";
            toggle.className = "section-toggle";
            toggle.setAttribute(
              "aria-expanded",
              "true"
            );
            toggle.textContent = "−";

            h2.classList.add("section-header");
            h2.appendChild(toggle);
            h2.after(body);

            const setOpen = open => {
              toggle.textContent = open ? "−" : "+";
              toggle.setAttribute(
                "aria-expanded",
                open ? "true" : "false"
              );

              if (open) {
                body.classList.remove("collapsed");
                body.style.maxHeight =
                  body.scrollHeight + "px";

                body.addEventListener(
                  "transitionend",
                  function te(e) {
                    if (e.propertyName === "max-height") {
                      body.style.maxHeight = "";
                      body.removeEventListener(
                        "transitionend",
                        te
                      );
                    }
                  }
                );
              } else {
                body.style.maxHeight =
                  body.scrollHeight + "px";
                void body.offsetHeight;
                body.classList.add("collapsed");
              }
            };

            h2.addEventListener("click", e => {
              if (e.target.closest("a")) {
                return;
              }

              setOpen(
                toggle.getAttribute(
                  "aria-expanded"
                ) !== "true"
              );
            });
          });

        // Link the page title (h1) to the GitHub repo.
        const heading = container.querySelector("h1");

        if (heading) {
          const repoLink = document.createElement("a");
          repoLink.href = REPO_URL;
          repoLink.target = "_blank";
          repoLink.rel = "noopener noreferrer";
          repoLink.style.color = "inherit";
          repoLink.style.textDecoration = "none";

          while (heading.firstChild) {
            repoLink.appendChild(heading.firstChild);
          }

          heading.appendChild(repoLink);
        }

        // The cjre.pl/ogle mark lives fixed at the top-right (see .corner-mark),
        // so drop the baked footer copy from the bottom of the content.
        const footerLink =
          container.querySelector('a[href*="cjre.pl/ogle"]');

        if (footerLink && footerLink.parentElement) {
          footerLink.parentElement.remove();
        }

        container.classList.add("fade-in");

        document
          .getElementById("content")
          .replaceChildren(container);

        // Card wrapping must run before the typewriter empties the tagline text
        // (otherwise the "feature-rich" lookup finds nothing to wrap).
        setupCardMode(container);
        typeTagline(container);
    }

    // Interactive mock of Janki (see the .anki-mock CSS): the deck browser opens
    // a reviewer with Janki's real behaviours — cloze reveal, grading by where you
    // click (Again/Hard/Good/Easy left→right, with the grade-colour flare), the
    // card-timer ring + red edge glow, rephrase ↔ original, and practice questions.
    function buildAnkiMock() {
      const GRADES = ["#ff5c5c", "#ffa63d", "#35d073", "#4d9dff"];
      const GRADE_NAMES = ["Again", "Hard", "Good", "Easy"];
      const TIMER_SECS = 12;

      // Cards: {{answer}} marks the cloze; `orig` is the un-rephrased wording.
      const RANKI = [
        { q: 0, t: "polycythemia vera: neoplastic blood disorder, too many RBCs are made<br>mutations often present in {{JAK2}}" },
        { q: 2, t: "Community-acquired pneumonia in adults is most often caused by {{Streptococcus pneumoniae}}",
          orig: "most common cause of community-acquired pneumonia: {{Streptococcus pneumoniae}}" },
        { q: 1, t: "absence seizures (3 Hz spike-and-wave)<br>first-line treatment: {{ethosuximide}}" },
        { q: 2, t: "Kussmaul breathing: deep, rapid respirations compensating for {{metabolic acidosis}}" },
      ];
      const PRACTICE = [
        { q: 0, mcq: true, ans: 3,
          t: "Type 1 diabetes mellitus is caused by a decreased ability of the β cells of the pancreas to produce insulin. A person with Type 1 diabetes mellitus who has neglected to take insulin injections will exhibit which one of the following?",
          opts: ["Increased fatty acid synthesis from glucose in liver",
                 "Decreased conversion of fatty acids to ketone bodies",
                 "Increased stores of triacylglycerol in adipose tissue",
                 "Increased production of acetone",
                 "Increased glucose transport into muscle cells"] },
        { q: 0, mcq: true, ans: 1,
          t: "An infant develops jaundice, hepatomegaly and cataracts after starting breast milk. Deficiency of which enzyme is most likely?",
          opts: ["Galactokinase", "Galactose-1-phosphate uridyltransferase",
                 "Aldolase B", "Fructokinase", "Glucose-6-phosphatase"] },
      ];
      const decks = [
        { exp: "+", name: "AJ", c: [0, 0, 0] },
        { exp: "", name: "_AnKing Step Deck", c: [0, 0, 0] },
        { exp: "+", name: "hUtCh", c: [0, 0, 0] },
        { exp: "+", name: "Ranki", c: [528, 267, 228], cards: RANKI },
      ];
      const practice = { name: "Practice", c: [40, 0, 0], cards: PRACTICE };

      const gear =
        '<svg class="mk-gear" viewBox="0 0 24 24" aria-hidden="true"><path d="M19.4 13a7.5 7.5 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.6 7.6 0 0 0-1.7-1L15 3.3h-4l-.4 2.6a7.6 7.6 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.5 7.5 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.6 7.6 0 0 0 1.7 1l.3 2.6h4l.4-2.6a7.6 7.6 0 0 0 1.7-1l2.5 1 2-3.5ZM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7Z"/></svg>';

      const mock = document.createElement("div");
      mock.className = "anki-mock";
      mock.innerHTML =
        '<div class="mk-win" data-view="decks" tabindex="0" role="application" aria-label="Interactive Janki demo">' +
          '<div class="mk-lights"><i></i><i></i><i></i></div>' +
          '<div class="mk-bar"><span data-go="decks">Decks</span><span>Add</span><span>Browse</span>' +
            '<span>Stats</span><span class="practice" data-go="practice">Practice</span><span class="sync">Sync</span></div>' +
          '<svg class="mk-timer" viewBox="0 0 24 24" aria-hidden="true"><circle class="track" cx="12" cy="12" r="9"/><circle class="fill" cx="12" cy="12" r="9"/></svg>' +
          '<div class="mk-view mk-decks">' +
            '<div class="mk-table"></div>' +
            '<div class="mk-actions"><span>Get Shared</span><span>Create Deck</span>' +
              "<span>Import File</span><span>Load Lectures</span></div>" +
          "</div>" +
          '<div class="mk-view mk-review">' +
            '<div class="mk-card"></div>' +
            '<span class="mk-chip" hidden></span>' +
            '<div class="mk-counts"></div>' +
            '<div class="mk-answer"></div>' +
          "</div>" +
          '<div class="mk-view mk-done"><p>Congratulations! You have finished this deck for now.<br>' +
            "<small>Click to return to your decks.</small></p></div>" +
          '<div class="mk-edge"></div>' +
        "</div>" +
        '<div class="mk-caption">Try it — open <b>Ranki</b> or <b>Practice</b>, click to reveal, then click left → right to grade (Again · Hard · Good · Easy).</div>';

      const win = mock.querySelector(".mk-win");
      const $ = sel => win.querySelector(sel);
      const cardEl = $(".mk-card");
      const chip = $(".mk-chip");
      const timer = $(".mk-timer");
      const edge = $(".mk-edge");
      timer.style.setProperty("--mk-secs", TIMER_SECS + "s");

      let deck = null, idx = 0, revealed = false, showOrig = false, busy = false;
      const card = () => deck.cards[idx % deck.cards.length];

      function renderDecks() {
        const count = (v, cls) => `<span class="${v ? cls : "z"}">${v}</span>`;
        $(".mk-table").innerHTML =
          '<div class="mk-row mk-head"><span class="mk-name">Deck</span>' +
            "<span>New</span><span>Learn</span><span>Due</span></div>" +
          decks.map((d, i) =>
            `<div class="mk-row" data-deck="${i}"><span class="mk-name" data-exp="${d.exp}">${d.name}</span>` +
            count(d.c[0], "n") + count(d.c[1], "l") + count(d.c[2], "d") +
            (d.c.some(Boolean) ? gear : "") + "</div>").join("");
      }

      function setView(v) {
        win.dataset.view = v;
        if (v === "review") return;
        timer.classList.remove("run");
        if (v === "decks") renderDecks();
      }

      function open(d) {
        deck = d;
        idx = 0;
        showCard();
      }

      function cloze(text, answered) {
        return text.replace(/\{\{(.+?)\}\}/g, (_, a) =>
          answered ? `<span class="mk-cloze mk-ans">${a}</span>` : '<span class="mk-cloze">[...]</span>');
      }

      function showCard() {
        if (!deck.c.some(Boolean)) { setView("done"); return; }
        setView("review");
        // Cards come from whichever queue still has cards (new → learn → due).
        const c = card();
        if (!deck.c[c.q]) c.q = deck.c.findIndex(Boolean);
        revealed = false;
        showOrig = false;
        busy = false;
        cardEl.className = "mk-card mk-in" + (c.mcq ? " mk-mcq" : "");
        cardEl.innerHTML = c.mcq
          ? c.t + '<div class="mk-opts">' +
              c.opts.map((o, i) => `<div class="mk-opt" data-opt="${i}"><b>${"ABCDE"[i]}.</b> ${o}</div>`).join("") +
            "</div>"
          : cloze(c.t, false);
        chip.hidden = !c.orig;
        chip.textContent = "↻ Rephrased · show original";
        $(".mk-counts").innerHTML = ["n", "l", "d"]
          .map((k, i) => `<span class="${k}${i === c.q ? " u" : ""}">${deck.c[i]}</span>`).join(" + ");
        $(".mk-answer").innerHTML = '<span data-show>Show Answer</span>';
        timer.classList.remove("run");
        void timer.getBoundingClientRect();
        timer.classList.add("run");
      }

      function reveal() {
        const c = card();
        revealed = true;
        if (c.mcq) {
          cardEl.querySelector(`[data-opt="${c.ans}"]`).classList.add("right");
        } else {
          cardEl.querySelectorAll(".mk-cloze").forEach((el, i) => {
            const answers = [...(showOrig ? c.orig : c.t).matchAll(/\{\{(.+?)\}\}/g)];
            el.textContent = answers[i][1];
            el.classList.add("mk-ans");
          });
        }
        $(".mk-answer").innerHTML = GRADE_NAMES
          .map((g, i) => `<span data-grade="${i}" style="color:${GRADES[i]}">${g}</span>`).join("");
      }

      function flare(color) {
        const f = document.createElement("div");
        f.className = "mk-flare";
        f.style.background =
          `radial-gradient(ellipse at center, ${color}17 0%, ${color}4d 50%, ${color}99 100%)`;
        win.appendChild(f);
        setTimeout(() => f.remove(), 650);
      }

      function grade(g) {
        if (busy) return;
        busy = true;
        const c = card();
        flare(GRADES[g]);
        deck.c[c.q] = Math.max(0, deck.c[c.q] - 1);
        if (g === 0) deck.c[1] += 1;   // Again → back into learning
        idx += 1;
        setTimeout(showCard, 260);
      }

      // Practice questions grade by answer choice: right → Good, wrong → Again.
      function pick(i) {
        if (busy || revealed) return;
        const c = card();
        revealed = true;
        const right = i === c.ans;
        cardEl.querySelector(`[data-opt="${c.ans}"]`).classList.add("right");
        if (!right) cardEl.querySelector(`[data-opt="${i}"]`).classList.add("wrong");
        flare(GRADES[right ? 2 : 0]);
        busy = true;
        setTimeout(() => { busy = false; grade(right ? 2 : 0); }, 1100);
      }

      function toggleOriginal() {
        const c = card();
        showOrig = !showOrig;
        cardEl.classList.remove("mk-in");
        void cardEl.offsetWidth;
        cardEl.classList.add("mk-in");
        cardEl.innerHTML = cloze(showOrig ? c.orig : c.t, revealed);
        chip.textContent = showOrig ? "↻ Show rephrase" : "↻ Rephrased · show original";
      }

      win.addEventListener("click", e => {
        const t = e.target;
        const go = t.closest("[data-go]");
        if (go) { go.dataset.go === "practice" ? open(practice) : setView("decks"); return; }
        if (t.closest(".mk-bar")) return;
        const row = t.closest("[data-deck]");
        if (row) { open(decks[+row.dataset.deck]); return; }
        if (win.dataset.view === "done") { setView("decks"); return; }
        if (win.dataset.view !== "review") return;
        if (t.closest(".mk-chip")) { toggleOriginal(); return; }
        const gb = t.closest("[data-grade]");
        if (gb) { grade(+gb.dataset.grade); return; }
        const opt = t.closest("[data-opt]");
        if (opt) { pick(+opt.dataset.opt); return; }
        if (!revealed) { reveal(); return; }
        // Answer showing: grade by where you clicked, like Janki's position grading.
        const r = win.getBoundingClientRect();
        grade(Math.min(3, Math.floor((e.clientX - r.left) / r.width * 4)));
      });

      win.addEventListener("keydown", e => {
        if (win.dataset.view === "done" && (e.key === " " || e.key === "Enter")) {
          setView("decks");
        } else if (win.dataset.view !== "review") {
          return;
        } else if (e.key === " " || e.key === "Enter") {
          if (!revealed) reveal(); else grade(2);
        } else if (/^[1-4]$/.test(e.key) && revealed) {
          grade(+e.key - 1);
        } else if (e.key === "Escape") {
          setView("decks");
        } else {
          return;
        }
        e.preventDefault();
      });

      // Focus Mode's card timer: when the ring fills, the edges flare red.
      timer.addEventListener("animationend", () => {
        edge.classList.remove("on");
        void edge.offsetWidth;
        edge.classList.add("on");
      });

      renderDecks();
      return mock;
    }

    // First load on a phone: present the splash (title + tagline) centered like an
    // Anki card. Tapping grades it — a red→orange→green→blue flare sweeps in from
    // the left (Again/Hard/Good/Easy) — or a scroll dismisses it. After that the
    // page behaves exactly like normal. Shown once per session.
    function setupCardMode(container) {
      // Wrap the title + tagline into a .splash block. The title stays pinned to the
      // top of the block; the tagline is auto-centred in the space below it.
      if (!container.querySelector(".splash")) {
        const h1 = container.querySelector("h1");
        const tag = [...container.querySelectorAll('p[align="center"]')]
          .find(el => /feature-rich/i.test(el.textContent));
        if (tag) {
          tag.classList.add("tagline");
          window.__tagEl = tag;
          const splash = document.createElement("div");
          splash.className = "splash";
          const first = h1 || tag;
          first.parentNode.insertBefore(splash, first);
          const stop = tag.nextSibling;
          let n = splash.nextSibling;
          while (n && n !== stop) { const next = n.nextSibling; splash.appendChild(n); n = next; }
        }
      }

      const isMobile = window.matchMedia("(max-width: 768px)").matches;

      // Turn the "Janki" title into a cloze [...] too, until the card is graded.
      // (Runs each render — incl. the live refresh — while the card is still up.)
      if (isMobile && !window.__cardDismissed) {
        const h1c = container.querySelector("h1");
        if (h1c && !h1c.querySelector(".cloze-mock")) {
          window.__titleEl = h1c;
          window.__titleOrig = h1c.innerHTML;
          h1c.innerHTML = '<span class="cloze-mock">[...]</span>';
        }
      }

      // TEMP: on-screen diagnostics when the URL has ?debug
      if (/[?&]debug/.test(location.search)) {
        let dbg = document.getElementById("carddbg");
        if (!dbg) { dbg = document.createElement("div"); dbg.id = "carddbg"; document.body.appendChild(dbg); }
        dbg.style.cssText = "position:fixed;top:0;left:0;z-index:99999;background:#000;color:#0f0;font:12px/1.3 monospace;padding:4px;white-space:pre;max-width:100vw";
        dbg.textContent =
          "w=" + window.innerWidth + " mobile=" + isMobile +
          " splash=" + !!container.querySelector(".splash") +
          " bound=" + !!window.__cardBound + " y=" + Math.round(window.scrollY);
      }

      if (!isMobile) return;   // TESTING: shows on every refresh (no session gate yet)

      // Body class persists across the live re-render, so only bind handlers once.
      if (window.__cardBound) {
        if (!window.__cardDismissed) document.body.classList.add("card-mode");
        return;
      }
      window.__cardBound = true;
      // Don't let the browser restore a prior scroll position (would sit past the
      // card and let the load-time scroll dismiss it immediately).
      try { if ("scrollRestoration" in history) history.scrollRestoration = "manual"; } catch (e) {}
      window.scrollTo(0, 0);
      document.body.classList.add("card-mode");
      const shownAt = Date.now();

      const hint = document.createElement("div");
      hint.className = "card-hint";
      hint.textContent = "tap to grade · or scroll";
      document.body.appendChild(hint);

      function dismiss() {
        if (!document.body.classList.contains("card-mode")) return;
        window.__cardDismissed = true;
        const tag = window.__tagEl;
        const first = tag ? tag.getBoundingClientRect().top : 0;   // centered position
        document.body.classList.remove("card-mode");
        hint.remove();
        revealTitle();
        // FLIP: the tagline just jumped from centered (fixed) to its normal spot;
        // invert that and animate back to 0 so it slides up smoothly.
        if (tag) {
          const last = tag.getBoundingClientRect().top;
          const dy = first - last;
          if (dy) {
            tag.style.transition = "none";
            tag.style.transform = "translateY(" + dy + "px)";
            void tag.offsetHeight;   // force reflow
            tag.style.transition = "transform 0.5s cubic-bezier(0.4, 0, 0.2, 1)";
            tag.style.transform = "translateY(0)";
            setTimeout(() => { tag.style.transition = ""; tag.style.transform = ""; }, 560);
          }
        }
      }

      // Grade the card by where you tap (like janki): the screen splits into four
      // columns — Again / Hard / Good / Easy — and a soft glow in that grade's
      // colour bursts from the tap point.
      const GRADE_COLORS = ["#ff5c5c", "#ffa63d", "#35d073", "#4d9dff"];
      function flare(x) {
        const col = Math.min(3, Math.floor((x / window.innerWidth) * 4));
        const c = GRADE_COLORS[col];
        const f = document.createElement("div");
        f.className = "grade-flare";
        // Wash the whole screen in the grade colour — faint in the centre, glowing
        // toward every border — so it reads as the card flashing the grade.
        f.style.background =
          "radial-gradient(ellipse at center, " + c + "17 0%, " + c + "4d 50%, " + c + "99 100%)";
        document.body.appendChild(f);
        setTimeout(() => f.remove(), 650);
      }

      // Tap detection via pointer events (window "click" is unreliable for taps on
      // plain elements in iOS Safari). A short press with little movement = a tap.
      let downX = 0, downY = 0, downT = 0;
      window.addEventListener("pointerdown", e => {
        downX = e.clientX; downY = e.clientY; downT = Date.now();
      }, { passive: true });
      window.addEventListener("pointerup", e => {
        if (!document.body.classList.contains("card-mode")) return;
        // Let the corner mark navigate to the site instead of grading the card.
        if (e.target.closest && e.target.closest(".corner-mark")) return;
        const moved = Math.abs(e.clientX - downX) + Math.abs(e.clientY - downY);
        if (moved < 14 && Date.now() - downT < 500) {
          flare(e.clientX);
          revealCloze();
          revealTitle();
          setTimeout(dismiss, 260);   // let the flare + reveal play, then slide up
        }
      }, { passive: true });
      // Ignore the scroll/resize the browser fires on load (URL-bar collapse);
      // only a real downward scroll after a short grace period dismisses it.
      window.addEventListener("scroll", () => {
        if (!document.body.classList.contains("card-mode")) return;
        if (Date.now() - shownAt < 600) return;
        if (window.scrollY > 12) { revealCloze(); dismiss(); }
      }, { passive: true });
    }

    // Reveal the tagline's [...] cloze answer (called on the card tap/dismiss).
    // If the line hasn't finished typing yet, ask it to reveal as soon as it does.
    function revealCloze() {
      if (window.__clozeReveal) { window.__clozeReveal(); window.__clozeReveal = null; }
      else { window.__clozeWantReveal = true; }
    }

    // Restore the "Janki" title from its [...] cloze.
    function revealTitle() {
      if (window.__titleEl && window.__titleOrig != null) {
        window.__titleEl.innerHTML = window.__titleOrig;
        window.__titleEl = null;
        window.__titleOrig = null;
      }
    }

    // Scale the tagline so its single line nearly fills the content width.
    function fitTagline(para) {
      if (!para || !para.parentElement) return;
      // Measure the actual text width via a Range (not the block <p>, whose width
      // is the full container), so it works regardless of inline wrapper tags.
      para.style.whiteSpace = "nowrap";
      para.style.fontSize = "";                       // reset to base before measuring
      const avail = para.clientWidth;
      const base = parseFloat(getComputedStyle(para).fontSize) || 16;
      const range = document.createRange();
      range.selectNodeContents(para);
      const textW = range.getBoundingClientRect().width;
      if (!(textW > 0 && avail > 0)) return;
      const MIN = 22;   // don't shrink below this — wrap instead (narrow screens)
      const fit = base * avail * 0.82 / textW;
      if (fit >= MIN) {
        para.style.whiteSpace = "nowrap";
        para.style.fontSize = fit + "px";
      } else {
        para.style.whiteSpace = "normal";   // let it wrap at a readable size
        para.style.fontSize = MIN + "px";
      }
    }

    (function () {
      let rt;
      window.addEventListener("resize", () => {
        clearTimeout(rt);
        rt = setTimeout(() => { if (window.__taglineEl) fitTagline(window.__taglineEl); }, 120);
      });
      // Re-fit once the Lora webfont swaps in, so the width isn't measured with
      // the fallback font.
      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(() => { if (window.__taglineEl) fitTagline(window.__taglineEl); });
      }
    })();

    // Type out the tagline under the title ("A feature-rich Anki client…") once per
    // visit. Keeps its inline markup (italics, the Anki link): each text node is
    // emptied and refilled character by character. The paragraph's height is pinned
    // first so the content below doesn't jump while it types.
    function typeTagline(root) {
      const target = [...root.querySelectorAll('p[align="center"]')]
        .find(el => /feature-rich/i.test(el.textContent));

      if (!target) {
        return;
      }

      const para = target.closest("p") || target;
      // (Tagline size is handled by the .tagline CSS clamp — no JS fitting.)

      const reduce = window.matchMedia &&
        window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      if (reduce) {
        return;
      }

      // This runs on every render() — the instant baked paint and again after
      // the live README refresh, which rebuilds the DOM. Bump a generation token
      // so any in-flight animation from a superseded render aborts and only the
      // current, on-screen tagline types (otherwise the refresh render would
      // replace the animated line with static text).
      window.__taglineGen = (window.__taglineGen || 0) + 1;
      const gen = window.__taglineGen;

      para.style.minHeight = para.offsetHeight + "px";

      const walker = document.createTreeWalker(target, NodeFilter.SHOW_TEXT);
      const nodes = [];

      while (walker.nextNode()) {
        nodes.push({ node: walker.currentNode, text: walker.currentNode.textContent });
      }

      nodes.forEach(n => { n.node.textContent = ""; });

      let ni = 0;
      let ci = 0;
      let pendingCloze = null;   // reveal fn for the mock cloze, run after the line

      function step() {
        if (gen !== window.__taglineGen) return;   // a newer render superseded us
        while (ni < nodes.length && ci >= nodes[ni].text.length) {
          ni += 1;
          ci = 0;
        }

        if (ni >= nodes.length) {
          para.style.minHeight = "";
          const reveal = pendingCloze;
          pendingCloze = null;
          if (reveal) {
            // In the mobile card intro, hold the answer until the card is tapped
            // (act like a real cloze). Otherwise reveal automatically.
            if (document.body.classList.contains("card-mode") && !window.__clozeWantReveal) {
              window.__clozeReveal = reveal;
            } else {
              window.__clozeWantReveal = false;
              setTimeout(reveal, 450);
            }
          }
          return;
        }

        const n = nodes[ni];

        // The "Anki" link plays a mock cloze: a blue [...] blank while the line types
        // on, then the answer is revealed in place once the line finishes (Janki's
        // cloze colour + text-reveal fade).
        const link = n.node.parentElement && n.node.parentElement.closest("a");

        if (ci === 0 && link && n.text.trim() === "Anki") {
          link.classList.add("cloze-mock");
          n.node.textContent = "[...]";
          ci = n.text.length;

          pendingCloze = () => {
            const span = document.createElement("span");
            span.className = "cloze-reveal";
            span.textContent = n.text;
            n.node.textContent = "";
            link.appendChild(span);
          };
          setTimeout(step, 90);
          return;
        }

        ci += 1;
        n.node.textContent = n.text.slice(0, ci);

        // Short pause on punctuation, near-instant on whitespace (source line breaks).
        const ch = n.text[ci - 1];
        const delay = /[.,]/.test(ch) ? 70 : (/\s/.test(ch) ? 6 : 13);
        setTimeout(step, delay);
      }

      setTimeout(step, 350);   // let the page fade-in land first
    }
  </script>

</body>
</html>

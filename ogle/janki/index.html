<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Janki</title>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.6;
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
      color: #24292f;
    }

    a {
      color: #0969da;
    }

    img {
      max-width: 100%;
    }

    code {
      background: #f6f8fa;
      padding: 2px 4px;
      border-radius: 4px;
    }

    pre {
      overflow-x: auto;
      padding: 16px;
      background: #f6f8fa;
      border-radius: 8px;
    }

    blockquote {
      margin-left: 0;
      padding-left: 16px;
      border-left: 4px solid #d0d7de;
      color: #57606a;
    }

    table {
      border-collapse: collapse;
      width: 100%;
    }

    th, td {
      border: 1px solid #d0d7de;
      padding: 6px 13px;
    }

    th {
      background: #f6f8fa;
    }
  </style>
</head>

<body>
  <main id="content">Loading…</main>

  <script>
    const README_URL =
      "https://raw.githubusercontent.com/cjreplogle/janki/master/README.md";

    const REPO_URL =
      "https://github.com/cjreplogle/janki";

    const REPO_BLOB_URL =
      `${REPO_URL}/blob/master/`;

    fetch(README_URL)
      .then(response => {
        if (!response.ok) {
          throw new Error("Failed to load README");
        }
        return response.text();
      })
      .then(markdown => {
        const html = marked.parse(markdown);

        const container = document.createElement("div");
        container.innerHTML = html;

        // Fix relative links so they point back to the Janki GitHub repo.
        container.querySelectorAll("a").forEach(link => {
          const href = link.getAttribute("href");

          if (!href || href.startsWith("#") ||
              href.startsWith("http://") ||
              href.startsWith("https://") ||
              href.startsWith("mailto:")) {
            return;
          }

          // GitHub's ../../releases link
          if (href === "../../releases" || href === "../releases") {
            link.href = `${REPO_URL}/releases`;
            return;
          }

          // Other relative links, e.g. docs/practice-questions.md
          link.href = new URL(href, REPO_BLOB_URL).href;
        });

        // Fix relative images too.
        container.querySelectorAll("img").forEach(img => {
          const src = img.getAttribute("src");

          if (!src ||
              src.startsWith("http://") ||
              src.startsWith("https://") ||
              src.startsWith("data:")) {
            return;
          }

          img.src = new URL(
            src,
            `https://raw.githubusercontent.com/cjreplogle/janki/master/`
          ).href;
        });

        document.getElementById("content").replaceChildren(container);
      })
      .catch(error => {
        document.getElementById("content").innerHTML =
          "<h1>Janki</h1><p>Unable to load README.</p>";
        console.error(error);
      });
  </script>
</body>
</html>

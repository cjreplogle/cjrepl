              '<div class="mk-cal-sws"><span class="on">Hutch</span><span>AnKing</span></div>' +
              '<div class="mk-cal-btns"><span class="mk-cal-study" data-cal-study>Study active cards</span>' +
                '<span class="mk-cal-prac" data-go="practice">Practice</span></div>' +
              `<div class="mk-cal-links">Show ${e.tags} tags ▾ · Open in LMS</div>` +
            "</div>";
          return;
        }
        const span = CAL_HI - CAL_LO, pct = h => ((h - CAL_LO) / span * 100).toFixed(2) + "%";
        let hours = "";
        for (let h = CAL_LO; h <= CAL_HI; h++)
          hours += `<div class="mk-cal-hr" style="top:${pct(h)}"><i>${hm(h).replace(":00", "")}</i></div>`;
        const lanes = {};      // two-lane overlap on Thursday
        const cols = CAL_DAYS.map((dn, d) => {
          const evs = CAL_EVENTS.map((e, i) => [e, i]).filter(([e]) => e.d === d);
          const blocks = evs.map(([e, i]) => {
            const over = evs.filter(([o]) => o !== e && o.s < e.e && e.s < o.e);
            const lane = over.length ? (over.some(([o]) => o.s < e.s || (o.s === e.s && CAL_EVENTS.indexOf(o) < i)) ? 1 : 0) : -1;
            const pos = lane < 0 ? "" : `left:${lane ? 50 : 0}%;right:auto;width:calc(50% - 3px);`;
            return `<div class="mk-cal-ev c${e.c}" data-cal-ev="${i}" style="top:${pct(e.s)};height:calc(${pct(e.e)} - ${pct(e.s)} - 2px);${pos}">` +
              (e.m ? STAR : "") + `<b>${e.t}</b><small>${hm(e.s)}–${hm(e.e)}</small></div>`;
          }).join("");
          const now = d === CAL_TODAY ? `<div class="mk-cal-now" style="top:${pct(CAL_NOW)}"></div>` : "";
          return `<div class="mk-cal-col${d === CAL_TODAY ? " today" : ""}"><div class="mk-cal-dh">${dn}</div>` +
            `<div class="mk-cal-ad">${CAL_DRESS[d] ? `<span>${SHIRT}${CAL_DRESS[d]}</span>` : ""}</div>` +
            `<div class="mk-cal-body">${blocks}${now}</div></div>`;
        }).join("");
        el.innerHTML =
          '<div class="mk-cal-bar"><span class="mk-cal-segs"><i>Day</i><i>3-day</i><i class="on">Week</i></span>' +
            '<span class="mk-cal-date">‹&nbsp; Oct 5 – Oct 9 &nbsp;›</span><span class="mk-cal-today">Today</span></div>' +
          `<div class="mk-cal-grid"><div class="mk-cal-hours">${hours}</div>${cols}</div>`;
      }

      const gear =
        '<svg class="mk-gear" viewBox="0 0 24 24" aria-hidden="true"><path d="M19.4 13a7.5 7.5 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.6 7.6 0 0 0-1.7-1L15 3.3h-4l-.4 2.6a7.6 7.6 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.5 7.5 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.6 7.6 0 0 0 1.7 1l.3 2.6h4l.4-2.6a7.6 7.6 0 0 0 1.7-1l2.5 1 2-3.5ZM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7Z"/></svg>';

      const mock = document.createElement("div");
      mock.className = "anki-mock";
      mock.innerHTML =
        '<div class="mk-win" data-view="decks" tabindex="0" role="application" aria-label="Interactive Janki demo">' +
          '<div class="mk-lights"><i></i><i></i><i></i></div>' +
          '<div class="mk-bar"><span class="cal" data-go="cal" title="Calendar">' + CAL_ICON + '</span><span data-go="decks">Decks</span><span>Add</span><span>Browse</span>' +
            '<span data-go="stats">Stats</span><span class="practice" data-go="practice">Practice</span><span class="sync">Sync</span></div>' +
          '<svg class="mk-timer" viewBox="0 0 24 24" aria-hidden="true"><circle class="track" cx="12" cy="12" r="9"/><circle class="fill" cx="12" cy="12" r="9"/></svg>' +
          '<div class="mk-view mk-decks">' +
            '<div class="mk-table"></div>' +
            '<div class="mk-actions"><span>Get Shared</span><span>Create Deck</span>' +
              '<span>Import File</span><span data-lec>Load Lectures</span></div>' +
            '<div class="mk-lec" hidden></div>' +
          "</div>" +
          '<div class="mk-view mk-stats"><div class="mk-stats-grid"></div></div>' +
          '<div class="mk-view mk-cal"></div>' +
          '<div class="mk-view mk-review">' +
            '<div class="mk-card"></div>' +
            '<span class="mk-chip" hidden></span>' +
            '<span class="mk-rel" hidden>Practice</span>' +
            '<span class="mk-focus-btn">Focus</span>' +
            '<div class="mk-counts"></div>' +
            '<div class="mk-answer"></div>' +
          "</div>" +
          '<div class="mk-view mk-done"><p>Congratulations! You have finished this deck for now.<br>' +
            "<small>Click to return to your decks.</small></p></div>" +
          '<div class="mk-edge"></div>' +
        "</div>" +
        '<div class="mk-caption"><button type="button" class="mk-tour-replay">Take the tour</button>' +
          '<a class="mk-dl" href="https://github.com/cjreplogle/janki/releases/latest/download/janki.ankiaddon">' +
          'Download Janki</a></div>';

      const win = mock.querySelector(".mk-win");
      const $ = sel => win.querySelector(sel);
      const cardEl = $(".mk-card");
      const chip = $(".mk-chip");
      const timer = $(".mk-timer");
      const edge = $(".mk-edge");
      const relBtn = $(".mk-rel");
      const focusBtn = $(".mk-focus-btn");
      timer.style.setProperty("--mk-secs", TIMER_SECS + "s");

      // `result` is the practice pick: null (none yet), true (right) or false (wrong).
      let deck = null, idx = 0, revealed = false, showOrig = false, busy = false, result = null;
      // A related question shown in place of the current card ("corner" = pulled
      // from the corner tab, "after" = interspersed by Janki after a review).
      let detour = null, detourKind = "", rankiDone = 0, focusOn = false, tabHeld = false;
      let studied = 0;   // cards graded in this demo — feeds the Stats "Today" panel
      const card = () => detour || deck.cards[idx % deck.cards.length];
      let tourEvent = () => {};   // guided tour hook (set up below)

      function renderDecks() {
        const count = (v, cls) => `<span class="${v ? cls : "z"}">${v}</span>`;
        $(".mk-table").innerHTML =
          '<div class="mk-row mk-head"><span class="mk-name">Deck</span>' +
            "<span>New</span><span>Learn</span><span>Due</span></div>" +
          decks.map((d, i) =>
            `<div class="mk-row" data-deck="${i}"><span class="mk-name" data-exp="${d.exp}">${d.name}</span>` +
            count(d.c[0], "n") + count(d.c[1], "l") + count(d.c[2], "d") +
            (d.c.some(Boolean) ? gear : "") + "</div>").join("");
      }

      function setView(v) {
        win.dataset.view = v;
        $(".mk-lec").hidden = true;
        if (v === "review") return;
        timer.classList.remove("run");
        if (v === "decks") renderDecks();
      }

      function open(d) {
        deck = d;
        idx = 0;
        showCard();
      }

      function cloze(text, answered) {
        return text.replace(/\{\{(.+?)\}\}/g, (_, a) =>
          answered ? `<span class="mk-cloze mk-ans">${a}</span>` : '<span class="mk-cloze">[...]</span>');
      }

      function showCard() {
        if (!deck.c.some(Boolean)) { setView("done"); return; }
        setView("review");
        // Cards come from whichever queue still has cards (new → learn → due).
        const c = card();
        if (!deck.c[c.q]) c.q = deck.c.findIndex(Boolean);
        revealed = false;
        showOrig = false;
        busy = false;
        result = null;
        win.classList.remove("mk-fill-right", "mk-fill-wrong");
        cardEl.className = "mk-card mk-in" + (c.mcq ? " mk-mcq" : "");
        cardEl.innerHTML = c.mcq
          ? '<div class="mk-stem">' + c.t + '</div><div class="mk-opts">' +
              c.opts.map((o, i) => `<div class="mk-opt" data-opt="${i}"><b>${"ABCDE"[i]}.</b> ${o}</div>`).join("") +
            "</div>"
          : cloze(c.t, false);
        chip.hidden = !c.orig;
        chip.textContent = "↻ Rephrased · show original";
        relBtn.hidden = !!(detour || c.mcq || !c.rel);
        if (detour) {
          chip.hidden = false;
          chip.textContent = detourKind === "after" ? "↳ Interspersed · related question" : "↳ Related question";
        }
        $(".mk-counts").innerHTML = ["n", "l", "d"]
          .map((k, i) => `<span class="${k}${i === c.q ? " u" : ""}">${deck.c[i]}</span>`).join(" + ");
        $(".mk-answer").classList.remove("mk-grades");
        $(".mk-answer").innerHTML = '<span data-show>Show Answer</span>';
        timer.classList.remove("run");
        void timer.getBoundingClientRect();
        timer.classList.add("run");
      }

      function reveal() {
        const c = card();
        revealed = true;
        tourEvent("reveal");
        if (c.mcq) {
          cardEl.querySelector(`[data-opt="${c.ans}"]`).classList.add("blue");
          practiceBack();
          return;
        } else {
          cardEl.querySelectorAll(".mk-cloze").forEach((el, i) => {
            const answers = [...(showOrig ? c.orig : c.t).matchAll(/\{\{(.+?)\}\}/g)];
            el.textContent = answers[i][1];
            el.classList.add("mk-ans");
          });
        }
        // Janki's answer bar: four tinted pills, next interval above each.
        const ivl = INTERVALS[c.q] || INTERVALS[2];
        const bar = $(".mk-answer");
        bar.classList.add("mk-grades");
        bar.innerHTML = GRADE_NAMES
          .map((g, i) => `<span data-grade="${i}" class="mk-g mk-g${i}"><em>${ivl[i]}</em>${g}</span>`).join("");
      }

      function flare(color) {
        const f = document.createElement("div");
        f.className = "mk-flare";
        f.style.background =
          `radial-gradient(ellipse at center, ${color}17 0%, ${color}4d 50%, ${color}99 100%)`;
        win.appendChild(f);
        setTimeout(() => f.remove(), 650);
      }

      function grade(g, { quiet = false } = {}) {
        if (busy) return;
        busy = true;
        const c = card();
        studied += 1;
        tourEvent(deck === practice ? "pgrade" : "grade");
        if (!quiet) flare(GRADES[g]);
        deck.c[c.q] = Math.max(0, deck.c[c.q] - 1);
        if (g === 0) deck.c[1] += 1;   // Again → back into learning
        idx += 1;
        // Every few reviews Janki intersperses a question related to the card
        // you just studied.
        if (deck !== practice && ++rankiDone % 3 === 0 && c.rel) {
          setTimeout(() => startDetour(c, "after"), 260);
          return;
        }
        setTimeout(showCard, 260);
      }

      function startDetour(src, kind) {
        detour = src.rel;
        detourKind = kind;
        showCard();
      }

      function endDetour() {
        detour = null;
        tourEvent("relend");
        showCard();   // corner → back to the same card; interspersed → the next one
      }

      // Focus Mode: only the card on screen, plus the timer ring.
      function setFocus(on) {
        if (focusOn === on) return;
        focusOn = on;
        win.classList.toggle("mk-focus", on);
        focusBtn.textContent = on ? "Focus: on" : "Focus";
        if (on) {
          timer.classList.remove("run");
          void timer.getBoundingClientRect();
          timer.classList.add("run");
        }
        tourEvent(on ? "focuson" : "focusoff");
      }

      // Practice questions: the pick IS the grade (right → Easy, wrong → Hard, as
      // Janki's binary grading). Its card-wide wash is the card's one flash;
      // Continue applies the grade quietly.
      function pick(i) {
        if (busy || revealed) return;
        const c = card();
        revealed = true;
        result = i === c.ans;
        cardEl.querySelector(".mk-opts").classList.add("locked");
        cardEl.querySelector(`[data-opt="${i}"]`).classList.add(result ? "right" : "wrong");
        if (!result) cardEl.querySelector(`[data-opt="${c.ans}"]`).classList.add("blue");
        win.classList.add(result ? "mk-fill-right" : "mk-fill-wrong");
        setTimeout(() => win.classList.remove("mk-fill-right", "mk-fill-wrong"), 700);
        setTimeout(practiceBack, 450);
      }

      // The answer side: fold away the choices that don't matter (behind an
      // "Other answers" toggle), slide in the explanation, and swap the bar for
      // Continue.
      function practiceBack() {
        const c = card();
        const box = cardEl.querySelector(".mk-opts");
        box.classList.add("locked");
        const others = [...box.children].filter(o =>
          !o.classList.contains("right") && !o.classList.contains("wrong") && !o.classList.contains("blue"));
        const fold = show => others.forEach(o => {
          o.style.maxHeight = o.scrollHeight + "px";
          void o.offsetHeight;
          o.classList.toggle("gone", !show);
        });
        setTimeout(() => fold(false), 220);
        const link = document.createElement("div");
        link.className = "mk-others";
        link.textContent = "Other answers";
        link.onclick = e => {
          e.stopPropagation();
          const show = link.textContent === "Other answers";
          fold(show);
          link.textContent = show ? "Hide other answers" : "Other answers";
        };
        box.after(link);
        const ex = document.createElement("div");
        ex.className = "mk-explain";
        ex.innerHTML =
          '<div class="mk-explain-h"><span>Explanation / Rationale</span><span class="mk-explain-t">−</span></div>' +
          '<div class="mk-explain-body">' + c.exp + "</div>";
        ex.querySelector(".mk-explain-h").onclick = e => {
          e.stopPropagation();
          const body = ex.querySelector(".mk-explain-body");
          body.hidden = !body.hidden;
          ex.querySelector(".mk-explain-t").textContent = body.hidden ? "+" : "−";
        };
        link.after(ex);
        $(".mk-answer").classList.remove("mk-grades");
        $(".mk-answer").innerHTML = '<span class="mk-continue" data-continue>Continue →</span>';
      }

      // No pick (Show Answer) counts as a miss. The pick already flashed the card,
      // so Continue moves on without a second flare.
      const practiceContinue = () => detour ? endDetour() : grade(result ? 3 : 1, { quiet: true });

      function toggleOriginal() {
        const c = card();
        showOrig = !showOrig;
        cardEl.classList.remove("mk-in");
        void cardEl.offsetWidth;
        cardEl.classList.add("mk-in");
        cardEl.innerHTML = cloze(showOrig ? c.orig : c.t, revealed);
        chip.textContent = showOrig ? "↻ Show rephrase" : "↻ Rephrased · show original";
      }

      win.addEventListener("click", e => {
        const t = e.target;
        const go = t.closest("[data-go]");
        if (go) {
          const to = go.dataset.go;
          if (to === "cal") { renderCal(); setView("cal"); tourEvent("cal"); }
          else if (to === "practice") { open(practice); tourEvent("practice"); }
          else if (to === "stats") { renderStats(); setView("stats"); tourEvent("stats"); }
          else setView("decks");
          return;
        }
        if (t.closest(".mk-bar")) return;
        if (win.dataset.view === "cal") {
          const ev = t.closest("[data-cal-ev]");
          if (ev) { renderCal(+ev.dataset.calEv); tourEvent("calclass"); return; }
          if (t.closest("[data-cal-back]")) { renderCal(); return; }
          if (t.closest("[data-cal-study]")) { open(decks[0]); return; }
          return;
        }
        if (t.closest("[data-lec]")) { openLectures(); return; }
        const row = t.closest("[data-deck]");
        if (row) { open(decks[+row.dataset.deck]); tourEvent("open"); return; }
        if (win.dataset.view === "done") { setView("decks"); return; }
        if (win.dataset.view !== "review") return;
        if (t.closest(".mk-rel")) { startDetour(card(), "corner"); tourEvent("related"); return; }
        if (t.closest(".mk-focus-btn")) { setFocus(!focusOn); return; }
        if (t.closest(".mk-chip")) { if (!detour) toggleOriginal(); return; }
        if (t.closest("[data-continue]")) { practiceContinue(); return; }
        const gb = t.closest("[data-grade]");
        if (gb) { grade(+gb.dataset.grade); return; }
        const opt = t.closest("[data-opt]");
        if (opt) { pick(+opt.dataset.opt); return; }
        if (!revealed) { reveal(); return; }
        if (card().mcq) return;   // practice grades only through Continue
        // Answer showing: grade by where you clicked, like Janki's position grading.
        const r = win.getBoundingClientRect();
        grade(Math.min(3, Math.floor((e.clientX - r.left) / r.width * 4)));
      });

      // Janki's Tab chords: Tab+F = Focus Mode, Tab+Q = related question. They
      // work whenever the demo has focus, or nothing does and the demo is on
      // screen. A plain Tab (no chord) still moves focus on as usual.
      let chordUsed = false, tabFromDemo = false;
      const onScreen = () => {
        const r = win.getBoundingClientRect();
        return win.offsetParent !== null && r.top < innerHeight * 0.75 && r.bottom > innerHeight * 0.25;
      };
      const ownsKeys = () => {
        const ae = document.activeElement;
        if (ae === win || (ae && mock.contains(ae))) return true;
        return (!ae || ae === document.body || ae === document.documentElement) && onScreen();
      };
      function leaveDemo() {
        const next = [...document.querySelectorAll(
          'a[href], button, input, select, textarea, [tabindex]:not([tabindex="-1"])')]
          .filter(el => !el.disabled && el.offsetParent !== null && !mock.contains(el))
          .find(el => mock.compareDocumentPosition(el) & Node.DOCUMENT_POSITION_FOLLOWING);
        if (next) next.focus(); else win.blur();
      }
      document.addEventListener("keydown", e => {
        if (e.key === "Tab" && !e.shiftKey && !e.metaKey && !e.ctrlKey && !e.altKey) {
          if (!tabHeld) {
            if (!ownsKeys()) return;
            const ae = document.activeElement;
            tabFromDemo = ae === win || (ae && mock.contains(ae));
            tabHeld = true;
            chordUsed = false;
          }
          e.preventDefault();
          win.focus({ preventScroll: true });
          return;
        }
        if (!tabHeld) return;
        const k = e.key.toLowerCase();
        if (k !== "f" && k !== "q") return;
        e.preventDefault();
        e.stopPropagation();
        chordUsed = true;
        if (k === "f") {
          setFocus(!focusOn);
          if (win.dataset.view !== "review")
            toast(focusOn ? "Focus Mode on — open a deck to see it" : "Focus Mode off");
          return;
        }
        if (win.dataset.view !== "review") { toast("Open a card, then Tab+Q pulls a related question"); return; }
        if (detour || card().mcq) return;
        if (!card().rel) { toast("No related questions for this card"); return; }
        startDetour(card(), "corner");
        tourEvent("related");
      }, true);
      document.addEventListener("keyup", e => {
        if (e.key !== "Tab" || !tabHeld) return;
        tabHeld = false;
        if (!chordUsed && tabFromDemo) leaveDemo();   // plain Tab moves on out of the demo
      }, true);

      win.addEventListener("keydown", e => {
        if (win.dataset.view === "stats" && e.key === "Escape") {
          setView("decks");
          e.preventDefault();
          return;
        }
        if (!$(".mk-lec").hidden) {
          if (e.key === "Escape") { $(".mk-lec").hidden = true; tourEvent("lecdone"); e.preventDefault(); }
          return;
        }
        if (win.dataset.view === "done" && (e.key === " " || e.key === "Enter")) {
          setView("decks");
        } else if (win.dataset.view !== "review") {
          return;
        } else if (e.key === " " || e.key === "Enter") {
          if (!revealed) reveal();
          else if (card().mcq) practiceContinue();
          else grade(2);
        } else if (card().mcq && !revealed && /^[1-5]$/.test(e.key)) {
          pick(+e.key - 1);
        } else if (/^[1-4]$/.test(e.key) && revealed && !card().mcq) {
          grade(+e.key - 1);
        } else if (e.key === "Escape") {
          setView("decks");
        } else {
          return;
        }
        e.preventDefault();
      });

      // Focus Mode's card timer: when the ring fills, the edges flare red.
      timer.addEventListener("animationend", () => {
        edge.classList.remove("on");
        void edge.offsetWidth;
        edge.classList.add("on");
      });

      // --- Load Lectures ------------------------------------------------------
      // Placeholder calendar (day offset → events) matched against a placeholder
      // lecture → tag list; `fuzzy` rows are the "~" auto-guesses.
      // A made-up (but realistic) cardiovascular block.
      const LECTURES = {
        "Cardiac Electrophysiology": [96, "Ranki::Cardio::Physiology::Electrophysiology"],
        "Antiarrhythmic Drugs": [74, "Ranki::Cardio::Pharm::Antiarrhythmics"],
        "Heart Failure": [132, "Ranki::Cardio::Pathology::HeartFailure"],
        "Ischemic Heart Disease": [118, "Ranki::Cardio::Pathology::IschemicHeartDisease"],
        "Valvular Heart Disease": [88, "Ranki::Cardio::Pathology::Valves"],
        "Antihypertensives": [104, "Ranki::Cardio::Pharm::Antihypertensives"],
        "Congenital Heart Disease": [67, "Ranki::Cardio::Embryology::Congenital"],
        "Lipid-Lowering Drugs": [52, "Ranki::Cardio::Pharm::Lipids"],
      };
      const SCHEDULE = {
        "-1": [
          { ev: "CV Block — Cardiac Electrophysiology", lec: "Cardiac Electrophysiology" },
          { ev: "Embryology: Heart Tube & Septation", lec: "Congenital Heart Disease", fuzzy: true },
          { ev: "Anatomy Lab — Mediastinum", lec: "" },
        ],
        "0": [
          { ev: "CV Block — Heart Failure", lec: "Heart Failure" },
          { ev: "Pharm: Antiarrhythmics I (Na⁺ & K⁺ Channel Blockers)", lec: "Antiarrhythmic Drugs", fuzzy: true },
          { ev: "Lunch", lec: "" },
          { ev: "Pathology: Myocardial Infarction", lec: "Ischemic Heart Disease", fuzzy: true },
          { ev: "Clinical Skills — Cardiac Exam", lec: "" },
        ],
        "1": [
          { ev: "CV Block — Valvular Heart Disease", lec: "Valvular Heart Disease" },
          { ev: "Pharm: Drugs for Hypertension", lec: "Antihypertensives", fuzzy: true },
          { ev: "Small Group: Lipid Management", lec: "Lipid-Lowering Drugs", fuzzy: true },
        ],
      };
      const lec = $(".mk-lec");
      const lecState = {};   // day → [{use, lec}] (the dialog's "Changes are saved")
      const applied = {};    // day → cards unsuspended
      let lecDay = 0, exactOnly = false;

      const lecRows = () => {
        const sched = SCHEDULE[lecDay] || [];
        if (!lecState[lecDay]) lecState[lecDay] = sched.map(r => ({ use: !!r.lec, lec: r.lec }));
        return lecState[lecDay].map((st, i) => {
          const skip = !st.lec || (exactOnly && sched[i].fuzzy && st.lec === sched[i].lec);
          return { ...sched[i], ...st, live: st.use && !skip };
        });
      };

      function renderLec() {
        const rows = lecRows();
        const d = new Date();
        d.setDate(d.getDate() + lecDay);
        const when = lecDay === 0 ? "Today"
          : `${lecDay > 0 ? "+" : ""}${lecDay} day${Math.abs(lecDay) === 1 ? "" : "s"}`;
        const date = d.toLocaleDateString("en-US",
          { weekday: "short", month: "short", day: "2-digit", year: "numeric" }).replace(",", "");
        const fuzzy = rows.filter(r => r.fuzzy && r.live).length;
        const total = rows.reduce((n, r) => n + (r.live ? LECTURES[r.lec][0] : 0), 0);
        const opts = sel => ['<option value="">— skip —</option>']
          .concat(Object.keys(LECTURES).map(l =>
            `<option${l === sel ? " selected" : ""}>${l}</option>`)).join("");
        lec.innerHTML =
          '<div class="mk-lec-title"><div class="mk-lights"><i data-lecact="close"></i><i></i><i></i></div>Lectures</div>' +
          '<div class="mk-lec-body">' +
            '<div class="mk-lec-nav"><button data-lecnav="-1">◀ Prev day</button>' +
              '<button data-lecnav="0">Today</button><button data-lecnav="1">Next day ▶</button>' +
              `<span class="mk-lec-date">${when} — ${date}</span></div>` +
            `<p class="mk-lec-info">${rows.length} calendar event${rows.length === 1 ? "" : "s"}, ` +
              `${Object.keys(LECTURES).length} lectures in spreadsheet. Pick the matching lecture for each row. ` +
              "“~” = auto-guess (fuzzy). Changes are saved.</p>" +
            (fuzzy ? `<p class="mk-lec-warn">⚠ ${fuzzy} event${fuzzy === 1 ? " was" : "s were"} matched loosely (~) — double-check ${fuzzy === 1 ? "it unsuspends" : "they unsuspend"} the right cards.</p>` : "") +
            '<div class="mk-lec-opts"><span>Unsuspend from: <label><input type="checkbox" checked disabled> Ranki</label></span>' +
              `<label><input type="checkbox" data-exact${exactOnly ? " checked" : ""}> Exact matches only</label></div>` +
            '<div class="mk-lec-table"><div class="mk-lec-tr mk-lec-th"><span>Use</span><span>Calendar event</span>' +
              "<span>Matched lecture</span><span>Cards</span><span>Tags</span></div>" +
              (rows.length ? rows.map((r, i) =>
                `<div class="mk-lec-tr${r.live ? "" : " off"}">` +
                  `<span><input type="checkbox" data-use="${i}"${r.live ? " checked" : ""}></span>` +
                  `<span title="${r.ev}">${r.ev}${r.fuzzy ? "  (~)" : ""}</span>` +
                  `<span><select data-pick="${i}">${opts(r.lec)}</select></span>` +
                  `<span>${r.live ? LECTURES[r.lec][0] : "—"}</span>` +
                  `<span title="${r.lec ? "tag:" + LECTURES[r.lec][1] : ""}">${r.live ? "+" : ""}</span>` +
                "</div>").join("")
              : '<div class="mk-lec-empty">No classes on the calendar for this day.</div>') +
            "</div>" +
            `<div class="mk-lec-foot"><span><b>${total}</b> cards will be unsuspended — Ranki ${total}</span>` +
              `<button data-lecact="resuspend"${applied[lecDay] ? "" : " disabled"}>Re-suspend day</button>` +
              '<button data-lecact="close">Close</button>' +
              `<button class="primary" data-lecact="apply"${total ? "" : " disabled"}>Apply</button></div>` +
          "</div>";
        lec.dataset.total = total;
      }

      function toast(text, big = false) {
        win.querySelectorAll(".mk-toast").forEach(old => old.remove());   // newest wins
        const t = document.createElement("div");
        t.className = "mk-toast" + (big ? " mk-toast-big" : "");
        t.textContent = text;
        win.appendChild(t);
        setTimeout(() => t.remove(), big ? 3600 : 2700);
      }

      // Unsuspending adds the day's cards to Ranki's New count.
      function lecAction(act) {
        const ranki = decks[0];
        if (act === "apply") {
          const n = +lec.dataset.total;
          ranki.c[0] += n;
          applied[lecDay] = (applied[lecDay] || 0) + n;
          toast(`Unsuspended ${n} cards for ${lecDay === 0 ? "today" : "that day"}'s lectures`);
        } else if (act === "resuspend") {
          ranki.c[0] = Math.max(0, ranki.c[0] - applied[lecDay]);
          toast(`Re-suspended ${applied[lecDay]} cards`);
          delete applied[lecDay];
        }
        lec.hidden = true;
        renderDecks();
        if (act !== "close") $('[data-deck="0"]').classList.add("mk-bump");
        tourEvent("lecdone");
      }

      lec.addEventListener("change", e => {
        const t = e.target, st = lecState[lecDay];
        if (t.dataset.exact !== undefined) exactOnly = t.checked;
        else if (t.dataset.use !== undefined) {
          const row = st[+t.dataset.use];
          row.use = t.checked;
          if (t.checked && !row.lec) row.lec = SCHEDULE[lecDay][+t.dataset.use].lec || Object.keys(LECTURES)[0];
        } else if (t.dataset.pick !== undefined) {
          const row = st[+t.dataset.pick];
          row.lec = t.value;
          row.use = !!t.value;
        }
        renderLec();
      });

      lec.addEventListener("click", e => {
        e.stopPropagation();
        const nav = e.target.closest("[data-lecnav]");
        const act = e.target.closest("[data-lecact]");
        if (nav) {
          const step = +nav.dataset.lecnav;   // 0 = Today
          lecDay = step ? lecDay + step : 0;
          renderLec();
        } else if (act) {
          lecAction(act.dataset.lecact);
        }
      });

      // --- Stats ---------------------------------------------------------------
      // Fake but stable history (seeded), drawn as small SVG charts.
      function seeded(seed) {
        return () => {
          seed = (seed + 0x6d2b79f5) | 0;
          let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      const rand = seeded(20260928);
      const PAST = Array.from({ length: 182 }, (_, i) =>
        rand() < 0.12 ? 0 : Math.round(30 + rand() * 90 + i * 0.35));
      const FUTURE = Array.from({ length: 30 }, (_, i) => Math.round(60 + rand() * 80 - i * 1.2));
      const BLUES = ["#0d47a1", "#1769cc", "#2f8ae0", "#5aa8ee"];   // Mature/Young/Relearn/Learn
      const GREENS = ["#1d3325", "#1f5c35", "#2a8a4a", "#3fc46a", "#8ff0b0"];

      function barChart(stacks, colors, labels) {
        const W = 300, H = 90, n = stacks[0].length, bw = W / n;
        const tot = i => stacks.reduce((a, st) => a + st[i], 0);
        const max = Math.max(...stacks[0].map((_, i) => tot(i))) || 1;
        let out = "";
        for (let i = 0; i < n; i++) {
          let y = H - 12;
          stacks.forEach((st, k) => {
            const h = st[i] / max * (H - 20);
            y -= h;
            out += `<rect x="${(i * bw + 0.6).toFixed(1)}" y="${y.toFixed(1)}" width="${(bw - 1.2).toFixed(1)}" height="${h.toFixed(1)}" fill="${colors[k]}" rx="0.6"/>`;
          });
        }
        return `<svg viewBox="0 0 ${W} ${H}">${out}` +
          `<line x1="0" x2="${W}" y1="${H - 12}" y2="${H - 12}" stroke="currentColor" stroke-opacity="0.2"/>` +
          `<text x="0" y="${H - 2}">${labels[0]}</text>` +
          `<text x="${W / 2}" y="${H - 2}" text-anchor="middle">${labels[1]}</text>` +
          `<text x="${W}" y="${H - 2}" text-anchor="end">${labels[2]}</text>` +
          `<text x="0" y="7">${max}</text></svg>`;
      }

      function calendar(days) {
        const cols = Math.ceil(days.length / 7), cell = 300 / cols;
        const max = Math.max(...days);
        let out = "";
        days.forEach((v, i) => {
          const lvl = v ? Math.min(4, 1 + Math.floor(v / max * 4)) : 0;
          out += `<rect x="${(Math.floor(i / 7) * cell + 0.5).toFixed(1)}" y="${((i % 7) * cell + 0.5).toFixed(1)}" ` +
            `width="${(cell - 1).toFixed(1)}" height="${(cell - 1).toFixed(1)}" rx="1" fill="${GREENS[lvl]}"><title>${v} reviews</title></rect>`;
        });
        return `<svg viewBox="0 0 300 ${(7 * cell + 9).toFixed(1)}">${out}` +
          `<text x="0" y="${(7 * cell + 8).toFixed(1)}">6 months ago</text>` +
          `<text x="300" y="${(7 * cell + 8).toFixed(1)}" text-anchor="end">today</text></svg>`;
      }

      function donut(parts) {
        const total = parts.reduce((a, p) => a + p[1], 0);
        let a0 = -Math.PI / 2, out = "";
        parts.forEach(([, v, c]) => {
          const a1 = a0 + v / total * Math.PI * 2;
          const pt = (a, r) => `${(50 + r * Math.cos(a)).toFixed(2)} ${(50 + r * Math.sin(a)).toFixed(2)}`;
          const big = a1 - a0 > Math.PI ? 1 : 0;
          out += `<path d="M${pt(a0, 46)}A46 46 0 ${big} 1 ${pt(a1, 46)}L${pt(a1, 28)}A28 28 0 ${big} 0 ${pt(a0, 28)}Z" fill="${c}"/>`;
          a0 = a1;
        });
        return `<svg viewBox="0 0 100 100">${out}</svg>`;
      }

      function renderStats() {
        const today = 68 + studied, secs = 9.5;
        const past30 = PAST.slice(-30);
        past30[29] = today;
        const split = f => past30.map(v => Math.round(v * f));
        const ranki = decks[0].c;
        const counts = [
          ["New", 4812 + ranki[0] - 528, "#6baed6"],
          ["Learning", ranki[1], "#5aa8ee"],
          ["Relearning", 31, "#2f8ae0"],
          ["Young", 1944, "#74c476"],
          ["Mature", 3106, "#31a354"],
          ["Suspended", Math.max(0, 12480 - (ranki[0] - 528)), "#ffdc41"],
        ];
        const cardTotal = counts.reduce((a, p) => a + p[1], 0);
        const fmt = n => n.toLocaleString("en-US");
        $(".mk-stats-grid").innerHTML =
          '<div class="mk-panel"><h4>Today</h4><div class="mk-today">' +
            `Studied <b>${today}</b> cards in <b>${(today * secs / 60).toFixed(1)}</b> minutes today (${secs}s/card)<br>` +
            `Again count: <b>${Math.round(today * 0.1)}</b> (${(90).toFixed(1)}% correct)<br>` +
            `Learn: ${Math.round(today * 0.35)}, Review: ${Math.round(today * 0.55)}, Relearn: ${Math.round(today * 0.1)}<br>` +
            "Correct answers on mature cards: 41/44 (93.2%)</div></div>" +
          '<div class="mk-panel"><h4>Calendar</h4>' + calendar(PAST.slice(0, 181).concat(today)) + "</div>" +
          '<div class="mk-panel"><h4>Reviews</h4><p class="sub">The number of questions you have answered.</p>' +
            barChart([split(0.5), split(0.3), split(0.05), split(0.15)], BLUES, ["-30d", "-15d", "today"]) + "</div>" +
          '<div class="mk-panel"><h4>Future Due</h4><p class="sub">The number of reviews due in the future.</p>' +
            barChart([FUTURE], ["#2f8ae0"], ["today", "+15d", "+30d"]) + "</div>" +
          '<div class="mk-panel mk-wide"><h4>Card Counts</h4><div class="mk-counts-wrap">' + donut(counts) +
            '<table class="mk-legend">' + counts.map(([k, v, c]) =>
              `<tr><td><i style="background:${c}"></i></td><td>${k}</td><td>${fmt(v)}</td><td>${(v / cardTotal * 100).toFixed(1)}%</td></tr>`).join("") +
            `<tr><td></td><td><b>Total</b></td><td><b>${fmt(cardTotal)}</b></td><td></td></tr></table></div></div>`;
        $(".mk-stats").scrollTop = 0;
      }

      // Drag the Lectures dialog by its title bar (kept inside the window).
      let lecDX = 0, lecDY = 0;
      lec.addEventListener("pointerdown", e => {
        if (!e.target.closest(".mk-lec-title") || e.target.closest("[data-lecact]")) return;
        e.preventDefault();
        const wr = win.getBoundingClientRect(), lr = lec.getBoundingClientRect();
        const baseL = lr.left - lecDX - wr.left, baseT = lr.top - lecDY - wr.top;
        const sx = e.clientX - lecDX, sy = e.clientY - lecDY;
        const move = ev => {
          lecDX = Math.max(-baseL, Math.min(wr.width - lr.width - baseL, ev.clientX - sx));
          lecDY = Math.max(-baseT, Math.min(wr.height - 32 - baseT, ev.clientY - sy));
          lec.style.transform = `translate(${lecDX}px, ${lecDY}px)`;
        };
        const up = () => {
          window.removeEventListener("pointermove", move);
          window.removeEventListener("pointerup", up);
          lec.classList.remove("mk-dragging");
        };
        window.addEventListener("pointermove", move);
        window.addEventListener("pointerup", up);
        lec.classList.add("mk-dragging");
      });

      function openLectures() {
        lecDX = lecDY = 0;
        lec.style.transform = "";
        lecDay = 0;
        renderLec();
        lec.hidden = false;
        tourEvent("lectures");
      }

      // --- Guided tour ---------------------------------------------------------
      // Runs once, the first time the demo scrolls into view (replay from the
      // caption). A coach bar sits under the window so it never covers the UI;
      // each step highlights its target and advances when you actually do it.
      const onRanki = () => {
        if (win.dataset.view !== "review" || deck !== decks[0]) open(decks[0]);
      };
      const withRel = () => {
        onRanki();
        if (!detour && !card().rel) { idx = deck.cards.findIndex(x => x.rel); showCard(); }
      };
      const touch = window.matchMedia("(hover: none)").matches;
      const Click = touch ? "Tap" : "Click", click = touch ? "tap" : "click";
      const TOUR = [
        { sel: '[data-deck="0"]', prep: () => setView("decks"), on: "open",
          text: `<b>Decks.</b> This is a working Janki window. ${Click} <b>Ranki</b> to start studying.` },
        { sel: ".mk-card", prep: onRanki, on: "reveal",
          text: `Each <span class="mk-tour-cz">[...]</span> is a cloze hiding an answer. ${Click} the card to reveal it. <b>↻ Rephrased</b> cards can flip back to the deck's original wording.` },
        { sel: ".mk-answer", prep: () => { onRanki(); if (!revealed) reveal(); }, on: "grade",
          text: `Grade by where you ${click}: left edge <b style="color:#ff5c5c">Again</b> → right edge ` +
                `<b style="color:#4d9dff">Easy</b>. The window flashes that grade’s color.` },
        { sel: ".mk-rel", prep: withRel, on: "relend",
          text: `<b>Related questions.</b> ${Click} the gray <b>Practice</b> button in the bottom-right corner to pull a question tied to this card — Janki also intersperses them into your reviews on its own. Answer it to continue.` },
        { sel: ".mk-focus-btn", prep: onRanki, on: "focusoff",
          text: `<b>Focus Mode.</b> ${Click} <b>Focus</b>${touch ? "" : " (or Tab+F)"} to strip away everything but the card and start a timer ring — linger too long and the edges flare red. Then turn it back off.` },
        { sel: '.mk-bar [data-go="practice"]', prep: () => setFocus(false), on: "pgrade",
          text: "<b>Practice.</b> Import and automatically process your own practice question banks from .pptx, .docx, or .qb. Open it and answer a question." },
        { sel: "[data-lec]", prep: () => { setFocus(false); setView("decks"); }, on: "lecdone",
          text: "<b>Load Lectures.</b> Reads your class calendar and unsuspends just today’s lecture cards. Open it, then <b>Apply</b>." },
        { sel: '.mk-bar [data-go="cal"]', prep: () => { setFocus(false); setView("decks"); }, on: "calclass",
          text: `<b>Calendar.</b> Your week of classes, straight from your lecture calendar — dress codes on top, ★ mandatory. ${Click} the calendar icon, then a class to study its cards or practice questions.` },
        { sel: '.mk-bar [data-go="stats"]', prep: () => setFocus(false), on: "stats", last: true,
          text: "<b>Stats.</b> Open it to see what you just studied. That’s the tour!" },
      ];
      let tourStep = -1;
      const tourBar = document.createElement("div");
      tourBar.className = "mk-tour";
      tourBar.hidden = true;
      win.after(tourBar);
      const caption = mock.querySelector(".mk-caption");

      const clearHl = () =>
        win.querySelectorAll(".mk-tour-hl").forEach(el => el.classList.remove("mk-tour-hl"));

      function showStep(i) {
        tourStep = i;
        const s = TOUR[i];
        clearHl();
        if (s.prep) s.prep();
        const el = win.querySelector(s.sel);
        if (el) el.classList.add("mk-tour-hl");
        // Keep keyboard focus in the demo so Space / Tab chords act on it rather
        // than scrolling the page.
        win.focus({ preventScroll: true });
        tourBar.innerHTML =
          `<div class="mk-tour-text"><span class="mk-tour-n">${i + 1}/${TOUR.length}</span> ${s.text}</div>` +
          '<div class="mk-tour-btns"><button data-tour="skip">Skip tour</button>' +
          `<button class="next" data-tour="next">${s.last ? "Done" : "Next →"}</button></div>`;
        tourBar.hidden = false;
        caption.hidden = true;
      }

      function endTour(finished) {
        tourStep = -1;
        clearHl();
        tourBar.hidden = true;
        caption.hidden = false;
        win.focus({ preventScroll: true });
        try { localStorage.setItem("jankiTourDone", "1"); } catch (e) {}
        if (finished) toast("That’s the tour — explore freely!", true);
      }

      function nextStep() {
        if (tourStep < 0) return;
        if (tourStep >= TOUR.length - 1) endTour(true);
        else showStep(tourStep + 1);
      }

      tourEvent = name => {
        if (tourStep < 0 || TOUR[tourStep].on !== name) return;
        const at = tourStep;
        setTimeout(() => { if (tourStep === at) nextStep(); },
          name === "grade" || name === "pgrade" ? 450 : 250);
      };

      tourBar.addEventListener("click", e => {
        const b = e.target.closest("[data-tour]");
        if (!b) return;
        if (b.dataset.tour === "skip") endTour(false);
        else nextStep();
      });
      mock.addEventListener("click", e => {
        if (e.target.closest(".mk-tour-replay")) showStep(0);
      });

      let toured = false;
      try { toured = !!localStorage.getItem("jankiTourDone"); } catch (e) {}
      if (!toured && "IntersectionObserver" in window) {
        const io = new IntersectionObserver(entries => {
          if (!entries.some(en => en.isIntersecting)) return;
          io.disconnect();
          setTimeout(() => { if (tourStep < 0) showStep(0); }, 500);
        }, { threshold: 0.6 });
        io.observe(win);
      }

      renderDecks();
      return mock;
    }

    // First load on a phone: present the splash (title + tagline) centered like an
    // Anki card. Tapping grades it — a red→orange→green→blue flare sweeps in from
    // the left (Again/Hard/Good/Easy) — or a scroll dismisses it. After that the
    // page behaves exactly like normal. Shown once per session.
    function setupCardMode(container) {
      // Wrap the title + tagline into a .splash block. The title stays pinned to the
      // top of the block; the tagline is auto-centred in the space below it.
      if (!container.querySelector(".splash")) {
        const h1 = container.querySelector("h1");
        const tag = [...container.querySelectorAll('p[align="center"]')]
          .find(el => /feature[- ]rich/i.test(el.textContent));
        if (tag) {
          tag.classList.add("tagline");
          window.__tagEl = tag;
          const splash = document.createElement("div");
          splash.className = "splash";
          const first = h1 || tag;
          first.parentNode.insertBefore(splash, first);
          const stop = tag.nextSibling;
          let n = splash.nextSibling;
          while (n && n !== stop) { const next = n.nextSibling; splash.appendChild(n); n = next; }
        }
      }

      const isMobile = window.matchMedia("(max-width: 768px)").matches;

      // Turn the "Janki" title into a cloze [...] too, until the card is graded.
      // (Runs each render — incl. the live refresh — while the card is still up.)
      if (isMobile && !window.__cardDismissed) {
        const h1c = container.querySelector("h1");
        if (h1c && !h1c.querySelector(".cloze-mock")) {
          window.__titleEl = h1c;
          window.__titleOrig = h1c.innerHTML;
          h1c.innerHTML = '<span class="cloze-mock">[...]</span>';
        }
      }

      // TEMP: on-screen diagnostics when the URL has ?debug
      if (/[?&]debug/.test(location.search)) {
        let dbg = document.getElementById("carddbg");
        if (!dbg) { dbg = document.createElement("div"); dbg.id = "carddbg"; document.body.appendChild(dbg); }
        dbg.style.cssText = "position:fixed;top:0;left:0;z-index:99999;background:#000;color:#0f0;font:12px/1.3 monospace;padding:4px;white-space:pre;max-width:100vw";
        dbg.textContent =
          "w=" + window.innerWidth + " mobile=" + isMobile +
          " splash=" + !!container.querySelector(".splash") +
          " bound=" + !!window.__cardBound + " y=" + Math.round(window.scrollY);
      }

      if (!isMobile) return;   // TESTING: shows on every refresh (no session gate yet)

      // Body class persists across the live re-render, so only bind handlers once.
      if (window.__cardBound) {
        if (!window.__cardDismissed) document.body.classList.add("card-mode");
        return;
      }
      window.__cardBound = true;
      // Don't let the browser restore a prior scroll position (would sit past the
      // card and let the load-time scroll dismiss it immediately).
      try { if ("scrollRestoration" in history) history.scrollRestoration = "manual"; } catch (e) {}
      window.scrollTo(0, 0);
      document.body.classList.add("card-mode");
      const shownAt = Date.now();

      const hint = document.createElement("div");
      hint.className = "card-hint";
      hint.textContent = "tap to grade · or scroll";
      document.body.appendChild(hint);

      function dismiss() {
        if (!document.body.classList.contains("card-mode")) return;
        window.__cardDismissed = true;
        const tag = window.__tagEl;
        const first = tag ? tag.getBoundingClientRect().top : 0;   // centered position
        document.body.classList.remove("card-mode");
        hint.remove();
        revealTitle();
        // FLIP: the tagline just jumped from centered (fixed) to its normal spot;
        // invert that and animate back to 0 so it slides up smoothly.
        if (tag) {
          const last = tag.getBoundingClientRect().top;
          const dy = first - last;
          if (dy) {
            tag.style.transition = "none";
            tag.style.transform = "translateY(" + dy + "px)";
            void tag.offsetHeight;   // force reflow
            tag.style.transition = "transform 0.5s cubic-bezier(0.4, 0, 0.2, 1)";
            tag.style.transform = "translateY(0)";
            setTimeout(() => { tag.style.transition = ""; tag.style.transform = ""; }, 560);
          }
        }
      }

      // Grade the card by where you tap (like janki): the screen splits into four
      // columns — Again / Hard / Good / Easy — and a soft glow in that grade's
      // colour bursts from the tap point.
      const GRADE_COLORS = ["#ff5c5c", "#ffa63d", "#35d073", "#4d9dff"];
      function flare(x) {
        const col = Math.min(3, Math.floor((x / window.innerWidth) * 4));
        const c = GRADE_COLORS[col];
        const f = document.createElement("div");
        f.className = "grade-flare";
        // Wash the whole screen in the grade colour — faint in the centre, glowing
        // toward every border — so it reads as the card flashing the grade.
        f.style.background =
          "radial-gradient(ellipse at center, " + c + "17 0%, " + c + "4d 50%, " + c + "99 100%)";
        document.body.appendChild(f);
        setTimeout(() => f.remove(), 650);
      }

      // Tap detection via pointer events (window "click" is unreliable for taps on
      // plain elements in iOS Safari). A short press with little movement = a tap.
      let downX = 0, downY = 0, downT = 0;
      window.addEventListener("pointerdown", e => {
        downX = e.clientX; downY = e.clientY; downT = Date.now();
      }, { passive: true });
      window.addEventListener("pointerup", e => {
        if (!document.body.classList.contains("card-mode")) return;
        // Let the corner mark navigate to the site instead of grading the card.
        if (e.target.closest && e.target.closest(".corner-mark")) return;
        const moved = Math.abs(e.clientX - downX) + Math.abs(e.clientY - downY);
        if (moved < 14 && Date.now() - downT < 500) {
          flare(e.clientX);
          revealCloze();
          revealTitle();
          setTimeout(dismiss, 260);   // let the flare + reveal play, then slide up
        }
      }, { passive: true });
      // Ignore the scroll/resize the browser fires on load (URL-bar collapse);
      // only a real downward scroll after a short grace period dismisses it.
      window.addEventListener("scroll", () => {
        if (!document.body.classList.contains("card-mode")) return;
        if (Date.now() - shownAt < 600) return;
        if (window.scrollY > 12) { revealCloze(); dismiss(); }
      }, { passive: true });
    }

    // Reveal the tagline's [...] cloze answer (called on the card tap/dismiss).
    // If the line hasn't finished typing yet, ask it to reveal as soon as it does.
    function revealCloze() {
      if (window.__clozeReveal) { window.__clozeReveal(); window.__clozeReveal = null; }
      else { window.__clozeWantReveal = true; }
    }

    // Restore the "Janki" title from its [...] cloze.
    function revealTitle() {
      if (window.__titleEl && window.__titleOrig != null) {
        window.__titleEl.innerHTML = window.__titleOrig;
        window.__titleEl = null;
        window.__titleOrig = null;
      }
    }

    // Scale the tagline so its single line nearly fills the content width.
    function fitTagline(para) {
      if (!para || !para.parentElement) return;
      // Measure the actual text width via a Range (not the block <p>, whose width
      // is the full container), so it works regardless of inline wrapper tags.
      para.style.whiteSpace = "nowrap";
      para.style.fontSize = "";                       // reset to base before measuring
      const avail = para.clientWidth;
      const base = parseFloat(getComputedStyle(para).fontSize) || 16;
      const range = document.createRange();
      range.selectNodeContents(para);
      const textW = range.getBoundingClientRect().width;
      if (!(textW > 0 && avail > 0)) return;
      const MIN = 22;   // don't shrink below this — wrap instead (narrow screens)
      const fit = base * avail * 0.82 / textW;
      if (fit >= MIN) {
        para.style.whiteSpace = "nowrap";
        para.style.fontSize = fit + "px";
      } else {
        para.style.whiteSpace = "normal";   // let it wrap at a readable size
        para.style.fontSize = MIN + "px";
      }
    }

    (function () {
      let rt;
      window.addEventListener("resize", () => {
        clearTimeout(rt);
        rt = setTimeout(() => { if (window.__taglineEl) fitTagline(window.__taglineEl); }, 120);
      });
      // Re-fit once the Lora webfont swaps in, so the width isn't measured with
      // the fallback font.
      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(() => { if (window.__taglineEl) fitTagline(window.__taglineEl); });
      }
    })();

    // Type out the tagline under the title ("A feature rich Anki client…") once per
    // visit. Keeps its inline markup (italics, the Anki link): each text node is
    // emptied and refilled character by character. The paragraph's height is pinned
    // first so the content below doesn't jump while it types.
    function typeTagline(root) {
      const target = [...root.querySelectorAll('p[align="center"]')]
        .find(el => /feature[- ]rich/i.test(el.textContent));

      if (!target) {
        return;
      }

      const para = target.closest("p") || target;
      // (Tagline size is handled by the .tagline CSS clamp — no JS fitting.)

      const reduce = window.matchMedia &&
        window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      if (reduce) {
        return;
      }

      // This runs on every render() — the instant baked paint and again after
      // the live README refresh, which rebuilds the DOM. Bump a generation token
      // so any in-flight animation from a superseded render aborts and only the
      // current, on-screen tagline types (otherwise the refresh render would
      // replace the animated line with static text).
      window.__taglineGen = (window.__taglineGen || 0) + 1;
      const gen = window.__taglineGen;

      para.style.minHeight = para.offsetHeight + "px";

      const walker = document.createTreeWalker(target, NodeFilter.SHOW_TEXT);
      const nodes = [];

      while (walker.nextNode()) {
        nodes.push({ node: walker.currentNode, text: walker.currentNode.textContent });
      }

      nodes.forEach(n => { n.node.textContent = ""; });

      let ni = 0;
      let ci = 0;
      let pendingCloze = null;   // reveal fn for the mock cloze, run after the line

      function step() {
        if (gen !== window.__taglineGen) return;   // a newer render superseded us
        while (ni < nodes.length && ci >= nodes[ni].text.length) {
          ni += 1;
          ci = 0;
        }

        if (ni >= nodes.length) {
          para.style.minHeight = "";
          const reveal = pendingCloze;
          pendingCloze = null;
          if (reveal) {
            // In the mobile card intro, hold the answer until the card is tapped
            // (act like a real cloze). Otherwise reveal automatically.
            if (document.body.classList.contains("card-mode") && !window.__clozeWantReveal) {
              window.__clozeReveal = reveal;
            } else {
              window.__clozeWantReveal = false;
              setTimeout(reveal, 450);
            }
          }
          return;
        }

        const n = nodes[ni];

        // The "Anki" link plays a mock cloze: a blue [...] blank while the line types
        // on, then the answer is revealed in place once the line finishes (Janki's
        // cloze colour + text-reveal fade).
        const link = n.node.parentElement && n.node.parentElement.closest("a");

        if (ci === 0 && link && n.text.trim() === "Anki") {
          link.classList.add("cloze-mock");
          n.node.textContent = "[...]";
          ci = n.text.length;

          pendingCloze = () => {
            const span = document.createElement("span");
            span.className = "cloze-reveal";
            span.textContent = n.text;
            n.node.textContent = "";
            link.appendChild(span);
          };
          setTimeout(step, 90);
          return;
        }

        ci += 1;
        n.node.textContent = n.text.slice(0, ci);

        // Short pause on punctuation, near-instant on whitespace (source line breaks).
        const ch = n.text[ci - 1];
        const delay = /[.,]/.test(ch) ? 70 : (/\s/.test(ch) ? 6 : 13);
        setTimeout(step, delay);
      }

      setTimeout(step, 350);   // let the page fade-in land first
    }
  </script>

</body>
</html>

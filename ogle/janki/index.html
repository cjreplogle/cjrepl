<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Janki</title>
  <meta name="description" content="A feature rich Anki client designed around you.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="cjre.pl">
  <meta property="og:title" content="Janki">
  <meta property="og:description" content="A feature rich Anki client designed around you.">
  <meta property="og:url" content="https://cjre.pl/ogle/janki">
  <meta property="og:image" content="https://cjre.pl/ogle/janki/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Janki: a mock review window with a cloze card and Again/Hard/Good/Easy buttons">
  <meta name="twitter:card" content="summary_large_image">
  <script src="../marked.min.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">

  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --text: #1f2328;
      --muted: #59636e;
      --border: #d0d7de;
      --surface: #f6f8fa;
      --link: #0969da;
      --note-text: #0969da;
      --note-border: #0969da;
      --note-bg: #ddf4ff;
      --tip-text: #1a7f37;
      --tip-border: #1a7f37;
      --tip-bg: #dafbe1;
      --important-text: #8250df;
      --important-border: #8250df;
      --important-bg: #fbefff;
      --warning-text: #9a6700;
      --warning-border: #9a6700;
      --warning-bg: #fff8c5;
      --caution-text: #cf222e;
      --caution-border: #cf222e;
      --caution-bg: #ffebe9;
      --error-text: #cf222e;
      --error-border: #ff8182;
      --error-bg: #ffebe9;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #000000;
        --text: #ffffff;
        --muted: #b0b8c1;
        --border: #333333;
        --surface: #111111;
        --link: #58a6ff;
        --note-text: #58a6ff;
        --note-border: #58a6ff;
        --note-bg: #06151f;
        --tip-text: #56d364;
        --tip-border: #56d364;
        --tip-bg: #071a0d;
        --important-text: #bc8cff;
        --important-border: #bc8cff;
        --important-bg: #160d24;
        --warning-text: #e3b341;
        --warning-border: #e3b341;
        --warning-bg: #211a05;
        --caution-text: #ff7b72;
        --caution-border: #ff7b72;
        --caution-bg: #210b0b;
        --error-text: #ff7b72;
        --error-border: #ff8182;
        --error-bg: #210b0b;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 10px;
      background: var(--bg);
      color: var(--text);
      font-family:
        "Lora",
        Georgia,
        "Times New Roman",
        serif;
      font-size: 16px;
      line-height: 1.5;
    }

    .markdown-body {
      max-width: 900px;
      margin: 0 auto;
    }

    .fade-in {
      animation: fadeIn 0.45s ease-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(4px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .fade-in {
        animation: none;
      }
    }

    /* Mock Anki cloze on the tagline's "Anki": blank [...] → revealed answer, in
       Janki's cloze blue. */
    /* Keep the tagline's "Anki" (and its [...] cloze blank/reveal) blue in every
       state — static first paint, mid-animation, and after the reveal. */
    p[align="center"] a,
    .cloze-mock,
    .cloze-reveal {
      color: #6db3ff !important;
    }

    /* First-load "card" intro (mobile): center the splash like an Anki card,
       tap to grade (color flare) or scroll — then the page behaves normally. */
    .splash {
      min-height: 0;
      display: flex;
      flex-direction: column;
      transition: min-height 0.55s cubic-bezier(0.4, 0, 0.2, 1);
    }
    /* Card intro: fill the viewport (page content sits below the fold); the title
       stays at the top and the tagline is centred in the remaining space. */
    body.card-mode .splash {
      min-height: 100vh;
      min-height: 100dvh;
    }
    /* While the card is up, hide the rest of the page so nothing peeks. */
    body.card-mode .splash ~ * { display: none !important; }
    /* Center the tagline in the actual visible viewport; the title stays at top.
       On dismiss it's animated from here up to its normal position (see JS). */
    body.card-mode .tagline {
      position: fixed;
      top: 50%;
      left: 0;
      right: 0;
      transform: translateY(-50%);
      margin: 0;
      padding: 0 18px;
      z-index: 70;
    }
    /* Prominent, responsive tagline size (bigger on mobile), robust across the
       card/typewriter timing. */
    .tagline {
      font-size: clamp(1.45rem, 5.2vw, 2.15rem) !important;
      line-height: 1.35;
      margin: 1.5em 0 1.7em;   /* breathing room above/below in the normal layout */
    }
    @media (prefers-reduced-motion: reduce) {
      .splash { transition: none; }
    }
    /* Legal / support fine print (everything after the #legal marker) — smaller. */
    #legal ~ * {
      font-size: 0.85em;
      opacity: 0.8;
    }
    #legal ~ h2 { font-size: 1.1em; }
    .card-hint {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 26px;
      text-align: center;
      font-size: 0.8rem;
      opacity: 0.4;
      pointer-events: none;
      z-index: 40;
      animation: hintPulse 2s ease-in-out infinite;
    }
    @keyframes hintPulse { 50% { opacity: 0.14; } }
    .grade-flare {
      position: fixed;
      inset: 0;
      z-index: 60;
      pointer-events: none;
      opacity: 0;
      animation: gradeFlare 0.6s ease-out forwards;
      /* background (a radial glow in the grade colour, from the tap point) is set
         inline per tap; emulates the janki reviewer's grade glow. */
    }
    @keyframes gradeFlare {
      0% { opacity: 0; }
      22% { opacity: 0.55; }
      100% { opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .grade-flare { animation-duration: 0.25s; }
      body.card-mode .splash { transition: none; }
    }

    .cloze-mock {
      font-weight: normal;
      text-decoration: none;
    }

    .cloze-reveal {
      display: inline-block;
      animation: clozeReveal 0.45s ease-out;
    }

    @keyframes clozeReveal {
      from {
        opacity: 0;
        filter: blur(3px);
        transform: translateY(2px);
      }

      to {
        opacity: 1;
        filter: blur(0);
        transform: translateY(0);
      }
    }

    h1, h2, h3, h4, h5, h6 {
      margin-top: 24px;
      margin-bottom: 16px;
      font-weight: 600;
      line-height: 1.25;
    }

    h1 {
      padding-bottom: 0.3em;
      font-size: 2em;
    }

    #content h1 {
      margin-top: 4px;
    }

    h2 {
      padding-bottom: 0.3em;
      border-bottom: 1px solid var(--border);
      font-size: 1.5em;
    }

    h3 {
      font-size: 1.25em;
    }

    h4 {
      font-size: 1em;
    }

    p {
      margin-top: 0;
      margin-bottom: 16px;
    }

    a {
      color: var(--link);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    img,
    video {
      max-width: 100%;
      height: auto;
    }

    ul,
    ol {
      margin-top: 0;
      margin-bottom: 16px;
      padding-left: 2em;
    }

    li + li {
      margin-top: 0.25em;
    }

    code,
    tt {
      padding: 0.2em 0.4em;
      margin: 0;
      font-size: 85%;
      background: var(--surface);
      border-radius: 6px;
      font-family:
        ui-monospace,
        SFMono-Regular,
        "SF Mono",
        Menlo,
        Consolas,
        "Liberation Mono",
        monospace;
    }

    pre {
      padding: 16px;
      overflow: auto;
      margin-top: 0;
      margin-bottom: 16px;
      background: var(--surface);
      border-radius: 6px;
      line-height: 1.45;
    }

    pre code {
      padding: 0;
      margin: 0;
      background: transparent;
      border: 0;
      font-size: 100%;
      white-space: pre;
    }

    blockquote {
      margin: 0 0 16px;
      padding: 0 1em;
      color: var(--muted);
      border-left: 0.25em solid var(--border);
    }

    blockquote > :first-child {
      margin-top: 0;
    }

    blockquote > :last-child {
      margin-bottom: 0;
    }

    hr {
      height: 0.25em;
      padding: 0;
      margin: 24px 0;
      background: var(--border);
      border: 0;
    }

    table {
      width: 100%;
      margin-bottom: 16px;
      border-spacing: 0;
      border-collapse: collapse;
      display: block;
      overflow-x: auto;
    }

    th,
    td {
      padding: 6px 13px;
      border: 1px solid var(--border);
    }

    th {
      font-weight: 600;
      background: var(--surface);
    }

    tr {
      background: var(--bg);
      border-top: 1px solid var(--border);
    }

    tr:nth-child(2n) {
      background: var(--surface);
    }

    strong {
      font-weight: 600;
    }

    .markdown-alert {
      position: relative;
      overflow: hidden;
      padding: 8px 16px;
      margin-bottom: 16px;
      border-left: 4px solid;
      border-radius: 4px;
      transition:
        max-height 0.28s ease,
        opacity 0.28s ease,
        transform 0.28s ease,
        margin 0.28s ease,
        padding 0.28s ease;
    }

    .markdown-alert.dismissing {
      opacity: 0;
      transform: translateX(16px);
      margin-bottom: 0;
      padding-top: 0;
      padding-bottom: 0;
    }

    .alert-dismiss {
      position: absolute;
      top: 6px;
      right: 8px;
      padding: 2px;
      font-size: 13px;
      line-height: 1;
      color: inherit;
      background: transparent;
      border: 0;
      outline: none;
      cursor: pointer;
      opacity: 0.45;
      transition: opacity 0.15s ease;
    }

    .alert-dismiss:hover {
      opacity: 0.85;
    }

    .markdown-alert > *:last-child {
      margin-bottom: 0;
    }

    .markdown-alert-title {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 4px;
      font-weight: 600;
    }

    .markdown-alert-note {
      color: var(--note-text);
      border-color: var(--note-border);
      background: var(--note-bg);
    }

    .markdown-alert-tip {
      color: var(--tip-text);
      border-color: var(--tip-border);
      background: var(--tip-bg);
    }

    .markdown-alert-important {
      color: var(--important-text);
      border-color: var(--important-border);
      background: var(--important-bg);
    }

    .markdown-alert-warning {
      color: var(--warning-text);
      border-color: var(--warning-border);
      background: var(--warning-bg);
    }

    .markdown-alert-caution {
      color: var(--caution-text);
      border-color: var(--caution-border);
      background: var(--caution-bg);
    }

    .task-list-item {
      list-style-type: none;
    }

    .task-list-item input[type="checkbox"] {
      margin: 0 0.35em 0.25em -1.6em;
      vertical-align: middle;
    }

    h2.section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      cursor: pointer;
    }

    .section-toggle {
      flex: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      padding: 0;
      font-size: 20px;
      line-height: 1;
      color: var(--muted);
      background: transparent;
      border: 0;
      outline: none;
      border-radius: 6px;
      cursor: pointer;
      opacity: 0.4;
      transition: opacity 0.15s ease;
    }

    .section-toggle:hover {
      opacity: 0.75;
    }

    .section-body {
      overflow: hidden;
      transition: max-height 0.3s ease, opacity 0.3s ease;
    }

    .section-body.collapsed {
      max-height: 0 !important;
      opacity: 0;
    }

    .corner-mark {
      position: fixed;
      top: 8px;
      right: 12px;
      z-index: 10;
      font-size: 0.72em;
      color: var(--muted);
      text-decoration: none;
      opacity: 0.65;
      transition: opacity 0.15s ease;
      /* Own GPU layer + fixed anti-aliasing so the small fixed text doesn't
         shimmer when other parts of the page animate. */
      transform: translateZ(0);
      backface-visibility: hidden;
      will-change: transform;
      -webkit-font-smoothing: antialiased;
    }
    /* Kept invisible until it's been positioned with the real font, so it
       doesn't visibly jump when Lora loads. */
    .corner-mark:not(.placed) { opacity: 0; }

    .corner-mark:hover {
      opacity: 1;
      text-decoration: underline;
    }

    .corner-mark.hidden {
      opacity: 0;
      pointer-events: none;
    }

    /* Mock Janki deck browser, drawn in place of the reviewer.jpg hero. Sized in
       em off a container-width base (1em = 1/90 of the window width), so it scales
       like a screenshot; the dark tokens match Janki on a black background. */
    .anki-mock {
      --mk-win: #f4f4f5;
      --mk-edge: #d4d4d8;
      --mk-pill: #e4e4e7;
      --mk-text: #18181b;
      --mk-zero: #8a8f98;
      --mk-rule: #d4d4d8;
      --mk-new: #1d6fd6;
      --mk-learn: #d63a3a;
      --mk-due: #1f9d4c;
      --mk-practice: #1f9d4c;
      --mk-sync: #4a63a8;
      --mk-hover: #0000000d;
      --mk-opt: #ffffff;
      --mk-cloze: #1d6fd6;
      --mk-fill-right: #e3f4e8;
      --mk-fill-wrong: #f8e3e3;
      --mk-exp: #3f444c;
      --mk-exp-h: #4a6390;
      --mk-go: #1f7a45;
      --mk-dlg: #ffffff;
      --mk-warn: #9a6700;
      --mk-btn: #2f7fe0;
      --mk-g0: #c43b3b; --mk-g0b: #f9e0e0;
      --mk-g1: #b0650f; --mk-g1b: #faebd8;
      --mk-g2: #1f8745; --mk-g2b: #dcf1e3;
      --mk-g3: #2b6cc4; --mk-g3b: #dde9fa;
      container-type: inline-size;
      /* Shrink on short windows so the mock + the preview arrow fit on screen
         (≈500px of title, tagline, caption + tour/download buttons and arrow around
         a 1800:1130 window — 430 left the arrow below the fold once the Download
         button joined the caption). */
      max-width: min(900px, max(500px, (100svh - 500px) * 1.593));
      margin: 0 auto 12px;
    }
    @media (prefers-color-scheme: dark) {
      .anki-mock {
        --mk-win: #111214;
        --mk-edge: #3a3b3e;
        --mk-pill: #09090a;
        --mk-text: #ffffff;
        --mk-zero: #8a8f98;
        --mk-rule: #3a3b3e;
        --mk-new: #82b6ff;
        --mk-learn: #ff6b6b;
        --mk-due: #36c75e;
        --mk-practice: #86e39a;
        --mk-sync: #a9bde6;
        --mk-hover: #ffffff0f;
        --mk-opt: #ffffff08;
        --mk-cloze: #5aa0ff;
        --mk-fill-right: #18271d;
        --mk-fill-wrong: #2b181b;
        --mk-exp: #cfd3da;
        --mk-exp-h: #9fb4d8;
        --mk-go: #8ff0b0;
        --mk-dlg: #1c1d21;
        --mk-warn: #e3b341;
        --mk-g0: #ff8585; --mk-g0b: #3d2024;
        --mk-g1: #f0a45a; --mk-g1b: #3b2b1c;
        --mk-g2: #5fd081; --mk-g2b: #173220;
        --mk-g3: #80b3ff; --mk-g3b: #1a2b46;
      }
    }
    .mk-win {
      position: relative;
      aspect-ratio: 1800 / 1130;
      font-size: calc(100cqw / 90);
      line-height: 1;
      color: var(--mk-text);
      background: var(--mk-win);
      border: 1px solid var(--mk-edge);
      border-radius: 0.8em;
      overflow: hidden;
      user-select: none;
    }
    .mk-lights {
      position: absolute;
      top: 0.6em;
      left: 0.58em;
      display: flex;
      gap: 0.62em;
    }
    .mk-lights i {
      width: 0.88em;
      height: 0.88em;
      border-radius: 50%;
    }
    .mk-lights i:nth-child(1) { background: #ff5f57; }
    .mk-lights i:nth-child(2) { background: #febc2e; }
    .mk-lights i:nth-child(3) { background: #28c840; }
    .mk-bar,
    .mk-actions {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      white-space: nowrap;
    }
    .mk-bar {
      top: 2.15em;
      height: 2.25em;
      align-items: center;
      gap: 2.2em;
      padding: 0 1.4em;
      font-weight: 700;
      background: var(--mk-pill);
      border-radius: 1.125em;
    }
    .mk-bar .practice { color: var(--mk-practice); }
    .mk-bar .sync { color: var(--mk-sync); }
    .mk-table {
      position: absolute;
      top: 8.15em;
      left: 50%;
      width: 39.7em;
      transform: translateX(-50%);
    }
    .mk-row {
      position: relative;
      display: flex;
      align-items: center;
      height: 2.4em;
      padding-right: 0.6em;
    }
    .mk-row.mk-head {
      height: auto;
      padding-bottom: 0.52em;
      margin-bottom: 0.55em;
      font-weight: 700;
      border-bottom: 1px solid var(--mk-rule);
    }
    .mk-name {
      flex: 1;
      display: flex;
    }
    .mk-row:not(.mk-head) .mk-name::before {
      content: attr(data-exp);
      width: 1.45em;
      padding-left: 0.3em;
    }
    .mk-row > span:not(.mk-name) {
      width: 5.8em;
      text-align: center;
    }
    .mk-row .z { color: var(--mk-zero); }
    .mk-row .n { color: var(--mk-new); }
    .mk-row .l { color: var(--mk-learn); }
    .mk-row .d { color: var(--mk-due); }
    .mk-gear {
      position: absolute;
      right: 1.3em;
      width: 0.95em;
      height: 0.95em;
      fill: var(--mk-zero);
    }
    .mk-actions {
      bottom: 1.05em;
      gap: 0.6em;
      font-size: 0.9em;
    }
    .mk-actions span {
      display: flex;
      align-items: center;
      height: 2.55em;
      padding: 0 1.1em;
      background: var(--mk-pill);
      border-radius: 1.28em;
    }

    /* Interactive layer: one view at a time (decks / review / done). */
    .mk-win { outline: none; }
    .mk-bar { z-index: 3; }
    .mk-bar [data-go] { cursor: pointer; }
    .mk-view {
      position: absolute;
      inset: 0;
      display: none;
    }
    .mk-win[data-view="decks"] .mk-decks,
    .mk-win[data-view="review"] .mk-review,
    .mk-win[data-view="done"] .mk-done { display: block; }
    .mk-row[data-deck] {
      cursor: pointer;
      border-radius: 0.4em;
    }
    .mk-row[data-deck]:hover { background: var(--mk-hover); }
    .mk-review { cursor: pointer; }
    .mk-card {
      position: absolute;
      top: 6.7em;
      left: 0;
      right: 0;
      width: min(75em, 88%);
      margin: 0 auto;   /* not translateX: the fadeIn transform would override it */
      font-size: 2.15em;
      line-height: 1.3;
      text-align: center;
    }
    .mk-card.mk-in { animation: fadeIn 0.35s ease-out; }
    /* Focus Mode slides the card down to the vertical center (the separate
       `translate` property doesn't fight the fadeIn transform). */
    .mk-card {
      translate: 0 0;
      transition: top 0.45s cubic-bezier(0.4, 0, 0.2, 1), translate 0.45s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .mk-win.mk-focus .mk-card:not(.mk-mcq) { top: 50%; translate: 0 -50%; }
    .mk-cloze {
      font-weight: 700;
      color: var(--mk-cloze);
    }
    .mk-cloze.mk-ans {
      display: inline-block;
      animation: clozeReveal 0.45s ease-out;
    }
    /* Practice cards, after Janki's Practice note type: staggered choices, the
       pick tints solid green/red (correct shown blue on a miss) plus a card-wide
       wash, then the back folds the other choices away and slides in the
       explanation; Continue grades. */
    .mk-card.mk-mcq {
      top: 4.3em;
      bottom: 4.3em;
      width: min(50em, 90%);
      font-size: 1.6em;
      line-height: 1.4;
      text-align: left;
      overflow-y: auto;
      scrollbar-width: none;
    }
    /* The pick's card-wide wash flashes in, then fades back out. */
    .mk-win { transition: background-color 0.9s ease; }
    .mk-win.mk-fill-right,
    .mk-win.mk-fill-wrong { transition-duration: 0.25s; }
    .mk-win.mk-fill-right { background-color: var(--mk-fill-right); }
    .mk-win.mk-fill-wrong { background-color: var(--mk-fill-wrong); }
    .mk-opts {
      display: flex;
      flex-direction: column;
      margin-top: 0.85em;
    }
    .mk-opt {
      margin: 0.18em 0;
      padding: 0.4em 0.6em;
      overflow: hidden;
      background: var(--mk-opt);
      border: 1px solid var(--mk-edge);
      border-radius: 0.4em;
      animation: jpIn 0.2s ease-out backwards;
      transition: opacity 0.3s ease, max-height 0.35s ease, margin 0.3s ease,
        padding 0.3s ease, border-width 0.3s ease, background-color 0.25s ease,

    .mk-cal-pick { display: inline-block; padding: 0.15em 1em; border-radius: 0.5em; border: 1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.07); }
    .mk-cal-when { opacity: 0.8; margin: 0.4em 0 0.7em; font-size: 0.92em; }
    .mk-cal-counts .n { color: var(--mk-new); } .mk-cal-counts .d { color: var(--mk-due); }

      border-radius: 1em; background: rgba(255,255,255,.18); box-shadow: inset -0.15em 0 0 0.15em rgba(255,255,255,.7); }
    .mk-cal-sws span.on::before { background: #9cbcf3; box-shadow: inset 0.95em 0 0 -0.1em #9cbcf3, inset -0.15em 0 0 0.15em #fff; }
    .mk-cal-btns { display: flex; gap: 0.6em; justify-content: center; margin: 0.6em 0; }
    .mk-cal-study, .mk-cal-prac { padding: 0.5em 1.4em; border-radius: 0.6em; font-weight: 700; cursor: pointer; }
    .mk-cal-study { background: #9cbcf3; color: #10203a; }

    .mk-stats {

# Janki

<p align="center" style="font-weight: 400;">A feature rich <a href=https://github.com/ankitects/anki>Anki</a> client designed around you.
</p>

<p align="center">
  <img src="docs/media/reviewer.jpg" alt="Frosted-glass reviewer" width="360">
</p>

>[!WARNING]
> Some features within this add-on are still rather experimental. Please use at your own risk!

## Install

Runs as a plugin on top of Anki. No separate app.
Two builds — pick one (each link always downloads the latest release):

- **[⬇ Download `janki.ankiaddon`](https://github.com/cjreplogle/janki/releases/latest/download/janki.ankiaddon)**
  — the full frosted-glass experience. Adds a small, self-healing, reversible
  **patch layer** to Anki that enables the transparency (details below). I use this.
- **[⬇ Download `load-todays-lectures.ankiaddon`](https://github.com/cjreplogle/janki/releases/latest/download/load-todays-lectures.ankiaddon)**
  — a bare-bones version of the add-on that simply has the
  [Load today's lectures](docs/load-todays-lectures.md) import functionality.
  Designed for if you don't care for any of the other features.

1. **Install Anki** (if you haven't yet) from [apps.ankiweb.net](https://apps.ankiweb.net).
2. **Double-click the downloaded `.ankiaddon`** (Anki opens and installs it), or in Anki:
   **Tools → Add-ons → Install from file…** → pick the file.
3. **Restart Anki.** On first launch Janki applies a small one-time patch to Anki
   so the frosted glass can work, then asks you to **quit and reopen once**. Do
   that, and the glass is on. From then on, just open Anki normally.

> [!NOTE]
> **Why the one-time patch + restart?** True transparency needs a setting applied
> before Anki starts drawing — something an add-on alone can't do. Janki modifies
> two of Anki's own files to enable it (backups are kept), and **re-applies
> automatically after any Anki update**, prompting a quick restart when it does.



**From source (devs):** copy the files into
`~/Library/Application Support/Anki2/addons21/janki/`.

### Updating
After the first install, Janki updates itself — no more manual downloads. It
checks this repo's Releases about once a day and, when a newer version is out,
offers a one-click **Update now** (it grabs the matching build, installs it, and
keeps your settings). You can also trigger it anytime with **Tools → Janki: Check
for updates…**, or turn the auto-check off via the `auto_update_check` config.

### Uninstall
Because the glass involves a small patch to Anki's own files, remove it the clean
way: **Tools → Janki: Settings… → General → "Restore stock Anki (remove glass
patch)"**, restart, then delete the add-on from **Tools → Add-ons**. That restores
Anki's original files (repairing its signature) and clears everything Janki added,
so nothing is left behind.

**Windows:** **Tools → Janki: Uninstall…** (also in Settings → General) removes
Janki and everything it added in one click, then closes Anki.

> To change or disable any feature: **Tools → Janki: Settings…**


### Windows (beta)

Janki now runs on Windows too. However, it does not meet my current performance and quality standards. Using it in its current state will be buggy. If you still feel so inclined, you may try it for yourself below.

Download
**[`janki-windows.ankiaddon`](https://github.com/cjreplogle/janki/releases)**

Some features unavailable. New installs start with the **Solid** window (fastest);
pick a glass look in **Settings → General → Window glass**.

## Features

- **Frosted-glass reviewer** — revamps the Anki user interface from the ground up. Minimal, yet designed to seamlessly take advantage of modern hardware features. Includes a rework of card animations, application-wide frosted glass transparency, and much, much more...

  <p align="center">
    <img src="docs/media/reviewer2.jpg" alt="Reviewer glass" width="48%">
    <img src="docs/media/reviewer3.jpg" alt="Reviewer glass, another card" width="48%">
  </p>
  <p align="center">
    <a href="https://youtu.be/2jU0c5a6myo"><img src="https://img.youtube.com/vi/2jU0c5a6myo/hqdefault.jpg" alt="Watch the glass reviewer on YouTube" width="60%"></a>
  </p>
- **Focus Mode** (**`Tab+F`**) — hides toolbar/answer bar and centers the card.
  Only has the card contents on screen. Also throws in small customizable timer
  which fills over N seconds; when it runs out a red edge-glow flares
  (a "time to move on" nudge). A green flare denotes a card as finished for the day.
- **Lockdown Mode** (`backtick/~+delete`) — locks Janki into fullscreen to keep
  you from getting distracted. Escape by holding space/the entry bind for 10s.
  Tiered into three levels depending on how cooked your attention span is from
  doom-scrolling.
  
  <p align="center">
    <video src="https://github.com/cjreplogle/janki/raw/master/docs/media/scroll-animations.mp4" autoplay loop muted playsinline controls width="560"></video>
  </p>

- **Rephrase** — automatically re-word the same card
  slightly differently while retaining core information (Enable: **`Tab + R`**), so you
  don't simply memorize the card without understanding it. Automatically intersperses
  reworded cards after a single pass, while the original text is easily retrievable. All
  rephrases fall with the same card, so making headway with the adjusted wording has the
  same effect as getting the original card correct.

  **→ [How to Use Card Rephrasing](https://cjre.pl/ogle/janki/rephrase)**
- **Practice questions** — pull multiple-choice questions
  related to the card you're reviewing (**`Tab + Q`**), or load whole question banks into
  Anki as a real, syncable Practice deck. Banks are local `.qb` files; grading is by answer
  choice (correct → suspend, wrong → retry, skip → bury) with a per-bank Score. Runtime is
  100% local.
  
  **→ [Practice system + how to import a document as a question bank](docs/practice-questions.md)**
- **.jank bundles** — one file per content drop: decks (`.apkg`), question banks (`.qb`),
  lecture tag maps (`.json`) and rephrasings (`.rp`) imported together, in the right order,
  without touching your review history. **Settings → General → Import .jank…**, and
  **Build .jank…** to package your own.

  **→ [.jank bundles: importing and building](https://cjre.pl/ogle/janki/jank)**
- **Mobile card theming** *(experimental, off by default)* — AnkiMobile/AnkiDroid can't run
  add-ons, so this can stamp an OLED-dark background, a serif font, and the text-reveal
  animation into your note types (scoped to mobile) so the look rides your normal sync
  to the phone/iPad. It rewrites every note type's templates, so it's opt-in: set
  `"mobile_cards": true` in the add-on config to reveal **Tools → Janki: Mobile cards**
  (Apply / Remove — one-click reversible).
  
  **→ [Mobile cards setup + recommended AnkiMobile settings](docs/mobile-cards.md)**

  <p align="center">
    <video src="https://github.com/cjreplogle/janki/raw/master/docs/media/mobile-cards.mp4" autoplay loop muted playsinline controls width="240"></video>
    <!-- practice mobile clip hidden for now
    <video src="https://github.com/cjreplogle/janki/raw/master/docs/media/mobile-practice.mp4" autoplay loop muted playsinline controls width="240"></video>
    -->
  </p>
- **Load today's lectures** — reads a local `.ics`
  calendar (URL/file) and a local `.txt`/`.xlsx` lecture→tag map, finds your
  classes for the day, and adaptively unsuspends relevant tagged cards
  (AJ/#AK/Hutch decks tested). A calendar is optional — without one you pick
  lectures manually.

  **→ [Load Today's Lectures tutorial](docs/load-todays-lectures.md)**

  <p align="center">
    <img src="docs/media/load-todays-lectures.jpg" alt="Load today's lectures" width="375">
  </p>

  *This feature expects your own calendar export and tag map; set their paths on
  the Lectures → Sources tab (or just run **Tools → Load today's lectures** and
  pick a tag map when prompted). Nothing is uploaded — the calendar is read
  locally (a URL source is optional and fetched only if you enter one).*
- **Lecture Card Manager** — click the calendar icon in the toolbar for a week view of
  your classes, built from your calendar and lecture → tag map (matched lectures in blue,
  fuzzy matches edged amber). Click a class to manage that lecture's cards in one place:
  **Study active cards** or **Study all cards** (a temporary filtered deck — reviews count
  normally), **Suspend / Unsuspend cards for this lecture**, and see which tags it pulls
  in. **Study Progress** ranks the lectures you've already had by how under-studied
  they are, so you know what to catch up on. Everything is read locally.
- **Caption Mode** — Trying to multitask but still see your anki cards? Press **`Tab + \`**
  to change the Anki notecard view to be in "caption" form. **`Tab+Arrow Keys`**
  adjusts their screen position. Remains visible in this view even when other
  things are in fullscreen. (Note: also integrated to work & adjust with remote buttons)

  <p align="center">
    <video src="https://github.com/cjreplogle/janki/raw/master/docs/media/caption-mode.mp4" autoplay loop muted playsinline controls width="560"></video>
  </p>
- **Global hotkeys & remote** — hold **Tab** as a modifier or use your
  controller to drive the reviewer even when Anki is not focused.
  (i.e. **`Tab+Z`** → again, overrides being unfocused). **`Cmd+Opt+A`** also will globally
  focus the Anki window regardless of whatever else you are doing.
  Every shortcut (including the Tab chord key itself) can be changed in
  **Settings → Hotkeys**.
- **Pomodoro** — review-time work intervals, an in-window break screen
  (hold **Space** to skip), and a calm "break due" blue edge tint.
  Toggle the whole system on/off in settings. 
- **Tray menu** — keeps Anki open in the background and allows you to navigate a
  miniaturized menu with other things focused.
- **Quick Zoom** — for whatever god forsaken reason Anki does not have **`Cmd+`**
  or **`Cmd-`** hotkeys to zoom card contents so that exists now...

            dismiss.className = "alert-dismiss";

              "aria-label",

            const dismissAlert = () => {
              if (blockquote.classList.contains("dismissing")) {
                return;
              }
              // Fade + slide out, collapsing the space, then remove.
              blockquote.style.maxHeight =
                blockquote.scrollHeight + "px";
              void blockquote.offsetHeight;
              blockquote.classList.add("dismissing");
              blockquote.style.maxHeight = "0px";

              blockquote.addEventListener(
                "transitionend",
                () => blockquote.remove(),
                { once: true }
              );
            };

            dismiss.addEventListener("click", e => {
              e.stopPropagation();
              dismissAlert();
            });

            // Clicking anywhere on the alert dismisses it too (but not its links).
            blockquote.style.cursor = "pointer";
            blockquote.addEventListener("click", e => {

        container

    // Features: each item collapses to its name (and shortcut, if the README puts
    // one in parentheses after it); clicking expands the full description. The
    // smaller features are grouped under one "Various Quality-of-Life Features".
    function condenseFeatures(root) {
      const QOL = /focus mode|lockdown mode|global hotkeys|pomodoro|tray menu|quick zoom/i;
      const RENAME = {   // site-only display names
        "Rephrase": "Card Rephrasing",
        "Practice questions": "Import Question Banks",
      };
      // Shortcuts the README only mentions inside the description; shown next to
      // the name like the ones it puts in parentheses (Focus / Lockdown).
      const KEYS = {
        "Rephrase": ["Tab+R"],
        "Practice questions": ["Tab+Q"],
        "Caption Mode": ["Tab+\\"],
        "Global hotkeys & remote": ["Cmd+Opt+A"],
        "Quick Zoom": ["Cmd+", "Cmd−"],
      };
      // Consistent Title Case for feature names ("Tray menu" → "Tray Menu",
      // "Frosted-glass" → "Frosted-Glass"); file names like ".jank" stay as-is.
      const SMALL = new Set(["a", "an", "and", "of", "the", "to", "in", "on", "for"]);
      const titleCase = t => t.split(" ").map((w, i) => w.startsWith(".") ? w :
        w.split("-").map((p, j) => (i || j) && SMALL.has(p.toLowerCase()) ? p :
          p.charAt(0).toUpperCase() + p.slice(1)).join("-")).join(" ");
      const keyTag = keys => '<span class="feat-key">(' +
        keys.map(k => `<code>${k}</code>`).join(" / ") + ")</span>";
      const h2 = [...root.querySelectorAll("h2")].find(h => /^\s*features\s*$/i.test(h.textContent));
      let list = h2 && h2.nextElementSibling;
      while (list && list.tagName !== "UL" && list.tagName !== "H2") list = list.nextElementSibling;
      if (!list || list.tagName !== "UL") return;

      const items = [...list.children];
      const qol = items.filter(li => QOL.test(li.textContent.slice(0, 40)));
      if (qol.length) {
        const group = document.createElement("li");
        const sub = document.createElement("ul");
        sub.className = "feat-sub";
        qol.forEach(li => {
          const name = li.querySelector("strong");
          const keys = name && KEYS[name.textContent.trim()];
          if (keys) name.insertAdjacentHTML("afterend", " " + keyTag(keys));
          if (name) name.textContent = titleCase(name.textContent.trim());
          sub.appendChild(li);
        });
        group.innerHTML = "<strong>Various Quality-of-Life Features</strong>";
        group.appendChild(sub);
        list.appendChild(group);
      }

      list.classList.add("feat-list");
      [...list.children].forEach(li => {
        // Loose lists wrap the first line in a <p>; tight ones don't.
        const lead = li.innerHTML.trimStart().startsWith("<p") ? li.firstElementChild : li;
        const m = lead.innerHTML.match(
          /^\s*<strong>([\s\S]*?)<\/strong>\s*(\((?:(?!—)[\s\S])*?\))?\s*(?:—\s*)?/);
        if (!m) return;
        lead.innerHTML = lead.innerHTML.slice(m[0].length)
          .replace(/^(\s*)([a-z])/, (_, sp, ch) => sp + ch.toUpperCase());   // was mid-sentence

        const body = document.createElement("div");
        body.className = "feat-body";
        while (li.firstChild) body.appendChild(li.firstChild);
        if (lead !== li && !lead.textContent.trim() && !lead.querySelector("img,video")) lead.remove();

        const head = document.createElement("button");
        head.type = "button";
        head.className = "feat-head";
        head.setAttribute("aria-expanded", "false");
        head.innerHTML = `<span class="feat-name">${RENAME[m[1].trim()] || titleCase(m[1].trim())}</span>` +
          (m[2] ? `<span class="feat-key">${m[2]}</span>`
            : KEYS[m[1].trim()] ? keyTag(KEYS[m[1].trim()]) : "") +
          '<span class="feat-chev">+</span>';
        head.addEventListener("click", () => {
          const open = !li.classList.contains("open");
          body.style.maxHeight = body.scrollHeight + "px";
          void body.offsetHeight;
          li.classList.toggle("open", open);
          head.setAttribute("aria-expanded", String(open));
          head.lastChild.textContent = open ? "−" : "+";
          if (open) {
            // Let it grow freely once open (videos/images load after the measure).
            body.addEventListener("transitionend", function done(e) {
              if (e.propertyName !== "max-height") return;
              body.style.maxHeight = "";
              body.removeEventListener("transitionend", done);
            });
          }
        });

        li.classList.add("feat");
        li.append(head, body);
      });
    }

    // The arrow under the mock that ends the preview phase (see .more-arrow CSS).
    function addMoreArrow(mock) {
      const arrow = document.createElement("button");
      arrow.type = "button";
      arrow.className = "more-arrow";
      arrow.setAttribute("aria-label", "Show the rest of the page");
      arrow.innerHTML =
        '<svg width="22" height="14" viewBox="0 0 22 14" fill="none" stroke="currentColor" ' +
        'stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 2l9 9 9-9"/></svg>';
      arrow.addEventListener("click", revealRest);
      mock.after(arrow);
      document.body.classList.add("preview-mode");
      if (window.__previewBound) return;
      window.__previewBound = true;

      // Any downward gesture outside the mock (which has its own scrolling panes
      // and keys) also ends the preview. Not while the phone card intro is up.
      const ready = e =>
        document.body.classList.contains("preview-mode") &&
        !document.body.classList.contains("card-mode") &&
        !(e.target.closest && e.target.closest(".mk-win"));
      window.addEventListener("wheel", e => {
        if (e.deltaY > 0 && ready(e)) revealRest();
      }, { passive: true });
      let touchY = null;
      // (a swipe that started on the phone card intro doesn't count)
      window.addEventListener("touchstart", e => {
        touchY = document.body.classList.contains("card-mode") ? null : e.touches[0].clientY;
      }, { passive: true });
      window.addEventListener("touchmove", e => {
        if (touchY !== null && touchY - e.touches[0].clientY > 30 && ready(e)) revealRest();
      }, { passive: true });
      window.addEventListener("keydown", e => {
        if (["ArrowDown", "PageDown", " "].includes(e.key) && ready(e) &&
            !e.target.isContentEditable) {
          e.preventDefault();
          revealRest();
        }
      });
    }

    function revealRest() {
      const arrow = document.querySelector(".more-arrow");
      if (window.__previewDone || !arrow) return;
      window.__previewDone = true;
      const top = arrow.getBoundingClientRect().top + window.scrollY;
      document.body.classList.remove("preview-mode");
      document.querySelectorAll(".more-arrow ~ *").forEach(el => el.classList.add("fade-in"));
      arrow.remove();
      window.scrollTo({ top: top - 12, behavior: "smooth" });
    }

    // Interactive mock of Janki (see the .anki-mock CSS): the deck browser opens

    function buildAnkiMock() {

  <script src="../marked.min.js"></script>

  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --text: #1f2328;
      --muted: #59636e;
      --border: #d0d7de;
      --surface: #f6f8fa;
      --link: #0969da;
      --note-text: #0969da;
      --note-border: #0969da;
      --note-bg: #ddf4ff;
      --tip-text: #1a7f37;
      --tip-border: #1a7f37;
      --tip-bg: #dafbe1;
      --important-text: #8250df;
      --important-border: #8250df;
      --important-bg: #fbefff;
      --warning-text: #9a6700;
      --warning-border: #9a6700;
      --warning-bg: #fff8c5;
      --caution-text: #cf222e;
      --caution-border: #cf222e;
      --caution-bg: #ffebe9;
      --error-text: #cf222e;
      --error-border: #ff8182;
      --error-bg: #ffebe9;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #000000;
        --text: #ffffff;
        --muted: #b0b8c1;
        --border: #333333;
        --surface: #111111;
        --link: #58a6ff;
        --note-text: #58a6ff;
        --note-border: #58a6ff;
        --note-bg: #06151f;
        --tip-text: #56d364;
        --tip-border: #56d364;
        --tip-bg: #071a0d;
        --important-text: #bc8cff;
        --important-border: #bc8cff;
        --important-bg: #160d24;
        --warning-text: #e3b341;
        --warning-border: #e3b341;
        --warning-bg: #211a05;
        --caution-text: #ff7b72;
        --caution-border: #ff7b72;
        --caution-bg: #210b0b;
        --error-text: #ff7b72;
        --error-border: #ff8182;
        --error-bg: #210b0b;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 10px;
      background: var(--bg);
      color: var(--text);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Helvetica,
        Arial,
        sans-serif;
      font-size: 16px;
      line-height: 1.5;
    }

    .markdown-body {
      max-width: 900px;
      margin: 0 auto;
    }

    .fade-in {
      animation: fadeIn 0.45s ease-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(4px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .fade-in {
        animation: none;
      }
    }

    h1, h2, h3, h4, h5, h6 {
      margin-top: 24px;
      margin-bottom: 16px;
      font-weight: 600;
      line-height: 1.25;
    }

    h1 {
      padding-bottom: 0.3em;
      font-size: 2em;
    }

    h2 {
      padding-bottom: 0.3em;
      border-bottom: 1px solid var(--border);
      font-size: 1.5em;
    }

    h3 {
      font-size: 1.25em;
    }

    h4 {
      font-size: 1em;
    }

    p {
      margin-top: 0;
      margin-bottom: 16px;
    }

    a {
      color: var(--link);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    img {
      max-width: 100%;
      height: auto;
    }

    ul,
    ol {
      margin-top: 0;
      margin-bottom: 16px;
      padding-left: 2em;
    }

    li + li {
      margin-top: 0.25em;
    }

    code,
    tt {

      margin: 0;
      font-size: 85%;
      background: var(--surface);
      border-radius: 6px;
      font-family:
        ui-monospace,
        SFMono-Regular,
        "SF Mono",
        Menlo,
        Consolas,
        "Liberation Mono",
        monospace;
    }

    pre {
      padding: 16px;
      overflow: auto;
      margin-top: 0;
      margin-bottom: 16px;
      background: var(--surface);
      border-radius: 6px;
      line-height: 1.45;
    }

    pre code {
      padding: 0;
      margin: 0;
      background: transparent;
      border: 0;
      font-size: 100%;
      white-space: pre;
    }

    blockquote {
      margin: 0 0 16px;
      padding: 0 1em;
      color: var(--muted);
      border-left: 0.25em solid var(--border);
    }

    blockquote > :first-child {
      margin-top: 0;
    }

    blockquote > :last-child {
      margin-bottom: 0;
    }

    hr {
      height: 0.25em;
      padding: 0;
      margin: 24px 0;
      background: var(--border);
      border: 0;
    }

    table {
      width: 100%;
      margin-bottom: 16px;
      border-spacing: 0;
      border-collapse: collapse;
      display: block;
      overflow-x: auto;
    }

    th,
    td {
      padding: 6px 13px;
      border: 1px solid var(--border);
    }

    th {
      font-weight: 600;
      background: var(--surface);
    }

    tr {
      background: var(--bg);
      border-top: 1px solid var(--border);
    }

    tr:nth-child(2n) {
      background: var(--surface);
    }

    strong {
      font-weight: 600;
    }

    .markdown-alert {
      position: relative;
      padding: 8px 16px;
      margin-bottom: 16px;
      border-left: 4px solid;
      border-radius: 4px;
    }

    .alert-dismiss {
      position: absolute;
      top: 6px;
      right: 8px;
      padding: 2px;
      font-size: 13px;
      line-height: 1;
      color: inherit;
      background: transparent;
      border: 0;
      outline: none;
      cursor: pointer;
      opacity: 0.45;
      transition: opacity 0.15s ease;
    }

    .alert-dismiss:hover {
      opacity: 0.85;
    }

    .markdown-alert > *:last-child {
      margin-bottom: 0;
    }

    .markdown-alert-title {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 4px;
      font-weight: 600;
    }

    .markdown-alert-note {
      color: var(--note-text);
      border-color: var(--note-border);
      background: var(--note-bg);
    }

    .markdown-alert-tip {
      color: var(--tip-text);
      border-color: var(--tip-border);
      background: var(--tip-bg);
    }

    .markdown-alert-important {
      color: var(--important-text);
      border-color: var(--important-border);
      background: var(--important-bg);
    }

    .markdown-alert-warning {
      color: var(--warning-text);
      border-color: var(--warning-border);
      background: var(--warning-bg);
    }

    .markdown-alert-caution {
      color: var(--caution-text);
      border-color: var(--caution-border);
      background: var(--caution-bg);
    }

    .task-list-item {
      list-style-type: none;
    }

    .task-list-item input[type="checkbox"] {
      margin: 0 0.35em 0.25em -1.6em;
      vertical-align: middle;
    }

    h2.section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      cursor: pointer;
    }

    .section-toggle {
      flex: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      padding: 0;
      font-size: 20px;
      line-height: 1;
      color: var(--muted);
      background: transparent;
      border: 0;
      outline: none;
      border-radius: 6px;
      cursor: pointer;
      opacity: 0.4;
      transition: opacity 0.15s ease;
    }

    .section-toggle:hover {
      opacity: 0.75;
    }

    .section-body {
      overflow: hidden;
      transition: max-height 0.3s ease, opacity 0.3s ease;
    }

    .section-body.collapsed {
      max-height: 0 !important;
      opacity: 0;
    }

    .corner-mark {
      position: fixed;
      top: 8px;
      right: 12px;
      z-index: 10;
      font-size: 0.72em;
      color: var(--muted);
      text-decoration: none;
      opacity: 0.65;
      transition: opacity 0.15s ease;
    }

    .corner-mark:hover {
      opacity: 1;
      text-decoration: underline;
    }

    .loading {
      color: var(--muted);
      text-align: center;
      padding: 40px 0;
    }

    .error {
      color: var(--error-text);
      padding: 20px;
      border: 1px solid var(--error-border);
      border-radius: 6px;
      background: var(--error-bg);
    }

    @media (max-width: 600px) {
      body {
        padding: 20px 16px;
        font-size: 15px;
      }

      h1 {
        font-size: 1.75em;
      }

      h2 {
        font-size: 1.35em;
      }

      pre {
        font-size: 13px;
      }

      .alert-dismiss {
        font-size: 11px;
      }
    }
  </style>

  <script type="text/markdown" id="readme-source"><!--README:START-->
# A Quick-Access Metabolic Pathway Viewer.

A tiny native AppKit/SwiftUI/PDFKit viewer for a local copy of the Stanford
Pathways of Human Metabolism PDF. It lives in the menu bar, pops the map
open (or over any full-screen app) with a global hotkey, and adds fast find,
zoom, pan, and a cursor "peek-through" so you can glance at what's behind it.

> [!NOTE]
> The PDF is NOT included. Please download from [**here**](https://mededucation.stanford.edu/pathways-download/).
> On first launch the app asks you to pick your local copy and remembers it;
> Options also has a **Download Stanford Map** link and a **Change Map PDF** button.

<picture>
  <source srcset="https://raw.githubusercontent.com/cjreplogle/metabolic-map-hotkey/main/docs/demo.webp" type="image/webp">
  <img src="https://raw.githubusercontent.com/cjreplogle/metabolic-map-hotkey/main/docs/demo.gif" alt="MetabolicMap in action" width="300" height="195">
</picture>

## Download

Grab the prebuilt app from the
[latest release](https://github.com/cjreplogle/metabolic-map-hotkey/releases/latest):

1. Download `MetabolicMap.zip`, unzip, and move `MetabolicMap.app` to Applications.
2. First launch: right-click the app → **Open** (it's signed with a personal
   Apple Development certificate and isn't notarized, so Gatekeeper warns once).
3. Pick your local map PDF when prompted.
4. Grant Accessibility (below) so the global hotkeys work.

Requires macOS 14+.

## Permissions

The global shortcuts use a keyboard event tap, which macOS gates behind:

**System Settings → Privacy & Security → Accessibility**

Enable **MetabolicMap** there. The app polls for the permission, so it starts
working the moment you toggle it on — no relaunch needed.

## Shortcuts

Global (work from any app; ⌥⌘M / ⌥⌘S are rebindable in Options → Shortcuts):

- **⌥⌘M**  show the map (without stealing focus) / hide it when it's frontmost
- **⌥⌘S**  show the map and open the find bar
- **⌥⌘→**  pan the map
- **⌃⌘→**  snap the window across a 3×3 grid of screen positions
- **⌥⌘ +/−**  zoom the map in / out
- **⌃⌘ +/−**  resize the window (anchored top-right)
- **⌥⌘B**  return focus to the app you were using before

With the map focused:
- **click+drag** — pan (grab)
- **⌘-drag** — move the window
- **trackpad scroll** - pan

## Features

- Menu-bar app with a live glucose→TCA metabolite icon that walks the pathway.
- Shows over full-screen Spaces; optional **Always on Top**; **Launch at Login**.
- Cover-fit rendering (no gray letterbox), with a low-res underlay so panning/
  zooming doesn't flash white.
- **Peek-through**: hover near the window and a soft, adjustable circular hole
  lets you read whatever is behind it (fades out while the window is focused).
- Adjustable **base transparency**; frameless rounded window; remembers your last
  zoom/scroll position.
- Built-in **update check** with one-click self-update (Options footer).

All settings live in the tray menu's **Options…** window (General, Shortcuts,
and Animation tabs).

## Build from source

Requires macOS + Xcode Command Line Tools.

```bash
./build.sh
```

`build.sh` compiles `MetabolicMapApp.swift`, generates the app icon and
`Info.plist`, and code-signs with a stable identity (so the Accessibility grant
survives rebuilds). If macOS reports `zsh: permission denied: ./build.sh`, run
`chmod +x build.sh` once first. Then launch `MetabolicMap.app`.

## Note

This project does not bundle or redistribute the Stanford metabolic-map PDF; it
only views a copy you already have.

  <script>
    const README_URL =
      "https://raw.githubusercontent.com/cjreplogle/metabolic-map-hotkey/refs/heads/main/README.md";

    const REPO_URL =
      "https://github.com/cjreplogle/metabolic-map-hotkey";

    const REPO_BLOB_URL =
      `${REPO_URL}/blob/main/`;

    const RAW_REPO_URL =
      "https://raw.githubusercontent.com/cjreplogle/metabolic-map-hotkey/main/";

    marked.setOptions({
      gfm: true,
      breaks: false
    });

    // Static-first, then refresh: render the baked-in README immediately (instant
    // paint, works offline), then fetch the live README in the background and
    // re-render only if it changed — so the page is fast AND never stays desynced.
    const baked =
      document.getElementById("readme-source")
        .textContent
        .replace(/^\s*<!--README:START-->\s*/, "")
        .replace(/\s*<!--README:END-->\s*$/, "");

    render(baked);

    fetch(README_URL)
      .then(response =>
        response.ok ? response.text() : Promise.reject()
      )
      .then(live => {
        if (live.trim() !== baked.trim()) {
          render(live);
        }
      })
      .catch(() => {
        // Offline or GitHub unreachable — keep the baked copy.
      });

    function render(markdown) {
        const html = marked.parse(markdown);
        const container = document.createElement("div");

        container.innerHTML = html;

        container
          .querySelectorAll("blockquote")
          .forEach(blockquote => {
            const firstParagraph =
              blockquote.querySelector("p");

            if (!firstParagraph) {
              return;
            }

            const html = firstParagraph.innerHTML;

            const match = html.match(
              /^\s*\[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\]\s*(?:<br\s*\/?>)?/i
            );

            if (!match) {
              return;
            }

            const type =
              match[1].toLowerCase();

            firstParagraph.innerHTML =
              html.substring(match[0].length);

            blockquote.classList.add(
              "markdown-alert",
              `markdown-alert-${type}`
            );

            const title =
              document.createElement("div");

            title.className =
              "markdown-alert-title";

            const titles = {
              note: "Note",
              tip: "Tip",
              important: "Important",
              warning: "Warning",
              caution: "Caution"
            };

            const icons = {
              note: "ⓘ",
              tip: "💡",
              important: "❗",
              warning: "⚠️",
              caution: "🛑"
            };

            title.textContent =
              `${icons[type]} ${titles[type]}`;

            blockquote.prepend(title);

            const dismiss =
              document.createElement("button");

            dismiss.type = "button";
            dismiss.className = "alert-dismiss";
            dismiss.setAttribute(
              "aria-label",
              "Dismiss"
            );
            dismiss.textContent = "✕";

            dismiss.addEventListener("click", () => {
              blockquote.remove();
            });

            blockquote.appendChild(dismiss);
          });

        container
          .querySelectorAll("a")
          .forEach(link => {
            const href =
              link.getAttribute("href");

            if (!href) {
              return;
            }

            if (
              href.startsWith("#") ||
              href.startsWith("http://") ||
              href.startsWith("https://") ||
              href.startsWith("mailto:")
            ) {
              return;
            }

            if (
              href === "../../releases" ||
              href === "../releases" ||
              href === "releases"
            ) {
              link.href =
                `${REPO_URL}/releases`;

              return;
            }

            if (
              href === "../../issues" ||
              href === "../issues" ||
              href === "issues"
            ) {
              link.href =
                `${REPO_URL}/issues`;

              return;
            }

            if (
              href === "../../discussions" ||
              href === "../discussions" ||
              href === "discussions"
            ) {
              link.href =
                `${REPO_URL}/discussions`;

              return;
            }

            link.href =
              new URL(
                href,
                REPO_BLOB_URL
              ).href;

            link.target = "_blank";
            link.rel = "noopener noreferrer";
          });

        container
          .querySelectorAll("img")
          .forEach(img => {
            const src =
              img.getAttribute("src");

            if (!src) {
              return;
            }

            if (
              src.startsWith("http://") ||
              src.startsWith("https://") ||
              src.startsWith("data:")
            ) {
              return;
            }

            img.src =
              new URL(
                src,
                RAW_REPO_URL
              ).href;
          });

        container
          .querySelectorAll("a")
          .forEach(link => {
            if (
              link.href.startsWith("http")
            ) {
              link.target = "_blank";
              link.rel = "noopener noreferrer";
            }
          });

        // Make each ## section collapsible via a +/− toggle on the right.
        container
          .querySelectorAll("h2")
          .forEach(h2 => {
            const body =
              document.createElement("div");

            body.className = "section-body";

            let el = h2.nextElementSibling;

            while (el && el.tagName !== "H2") {
              const next = el.nextElementSibling;
              body.appendChild(el);
              el = next;
            }

            const toggle =
              document.createElement("button");

            toggle.type = "button";
            toggle.className = "section-toggle";
            toggle.setAttribute(
              "aria-expanded",
              "true"
            );
            toggle.textContent = "−";

            h2.classList.add("section-header");
            h2.appendChild(toggle);
            h2.after(body);

            const setOpen = open => {
              toggle.textContent = open ? "−" : "+";
              toggle.setAttribute(
                "aria-expanded",
                open ? "true" : "false"
              );

              if (open) {
                body.classList.remove("collapsed");
                body.style.maxHeight =
                  body.scrollHeight + "px";

                body.addEventListener(
                  "transitionend",
                  function te(e) {
                    if (e.propertyName === "max-height") {
                      body.style.maxHeight = "";
                      body.removeEventListener(
                        "transitionend",
                        te
                      );
                    }
                  }
                );
              } else {
                body.style.maxHeight =
                  body.scrollHeight + "px";
                void body.offsetHeight;
                body.classList.add("collapsed");
              }
            };

            h2.addEventListener("click", e => {
              if (e.target.closest("a")) {
                return;
              }

              setOpen(
                toggle.getAttribute(
                  "aria-expanded"
                ) !== "true"
              );
            });
          });

        // Link the page title (h1) to the GitHub repo.
        const heading = container.querySelector("h1");

        if (heading) {
          const repoLink = document.createElement("a");
          repoLink.href = REPO_URL;
          repoLink.target = "_blank";
          repoLink.rel = "noopener noreferrer";
          repoLink.style.color = "inherit";
          repoLink.style.textDecoration = "none";

          while (heading.firstChild) {
            repoLink.appendChild(heading.firstChild);
          }

          heading.appendChild(repoLink);
        }

        // The cjre.pl/ogle mark lives fixed at the top-right (see .corner-mark),
        // so drop the baked footer copy from the bottom of the content.
        const footerLink =
          container.querySelector('a[href*="cjre.pl/ogle"]');

        if (footerLink && footerLink.parentElement) {
          footerLink.parentElement.remove();
        }

        container.classList.add("fade-in");

        document
          .getElementById("content")
          .replaceChildren(container);
    }
  </script>
